<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css?v=FINAL" />
</head>

<body>

<div class="hero-wrapper">

  <!-- LEFT PANEL -->
  <div class="hero-panel">
    <h3>Welcome to The Sanctuary Club</h3>
    <p>A residents’ club for Sanctuary Mews and Sanctuary Court.</p>
  </div>

  <!-- HERO (CENTRE) -->
  <section class="hero">
    <div class="hero-overlay">

      <h1 class="hero-title">The Sanctuary Club</h1>

      <div class="action-stack">

        <!-- LOGGED-IN ACTIONS -->
        <div class="hero-buttons" id="member-actions" style="display:none;">
          <button
            class="hero-button"
            onclick="location.href='events.html'"
          >
            What’s On
          </button>

          <button
            class="hero-button"
            onclick="location.href='members-directory.html'"
          >
            Member Information
          </button>
        </div>

        <!-- LOGGED-OUT ACTION -->
        <div class="hero-buttons" id="login-action" style="display:none;">
          <button
            class="hero-button"
            onclick="location.href='member-login.html'"
          >
            Member Login
          </button>
        </div>

      </div>

      <footer class="site-footer">
        <p>© The Sanctuary Club. All rights reserved.</p>
      </footer>

    </div>
  </section>

  <!-- RIGHT PANEL -->
  <div class="hero-panel" style="position: relative;">

    <!-- LOGOUT -->
    <a
      href="#"
      id="logout-link"
      onclick="logout(); return false;"
      style="
        position: absolute;
        top: 0;
        right: 0;
        font-size: 0.85rem;
        text-decoration: underline;
        cursor: pointer;
        display: none;
      "
    >
      Logout
    </a>

    <p>
      <strong><em>
        See what’s on, join activities, and optionally share contact details
        so neighbours can reach you — or so you can reach them.
      </em></strong>
    </p>

  </div>

</div>

<script src="logout.js"></script>

<script>
  const loggedIn =
    sessionStorage.getItem("sanctuaryAccess") === "granted";

  document.getElementById("member-actions").style.display =
    loggedIn ? "flex" : "none";

  document.getElementById("login-action").style.display =
    loggedIn ? "none" : "flex";

  const logoutLink = document.getElementById("logout-link");
  if (logoutLink) {
    logoutLink.style.display = loggedIn ? "inline" : "none";
  }
</script>

</body>
</html>
