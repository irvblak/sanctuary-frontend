<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member Information — The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css" />

  <style>
    body {
      background: linear-gradient(180deg, #e9f1fb, #f6f9fc);
    }

    .content-wrapper {
      max-width: 900px;
      margin: 6rem auto 3rem;
      padding: 0 1rem;
    }

    h1 {
      color: #003366;
      margin-bottom: 0.5rem;
    }

    .intro {
      color: #445;
      margin-bottom: 2rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .info-card {
      display: block;
      padding: 1.4rem;
      background: #ffffff;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .info-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .info-card h3 {
      margin-top: 0;
      margin-bottom: 0.4rem;
      color: #003366;
    }

    .info-card p {
      margin: 0;
      color: #556;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

  <!-- TOP NAV -->
  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="events-calendar.html">Calendar</a>
    <a href="#" id="logout-link">Logout</a>
  </nav>

  <main class="content-wrapper">

    <h1>Member Information</h1>

    <p class="intro">
      Access member resources, update your details, or browse the directory.
    </p>

    <div class="card-grid">

      <a href="members-directory.html" class="info-card">
        <h3>Members Directory</h3>
        <p>View contact details shared by residents.</p>
      </a>

      <a href="your-info.html" class="info-card">

        <h3>Your Information</h3>
        <p>Update household members and contact preferences.</p>
      </a>

    </div>

  </main>

  <script src="logout.js"></script>

</body>
</html>
