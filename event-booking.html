<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Event Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />

<script src="access.js?v=AC_2"></script>

<style>
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f8fc;
  margin:0;
  padding:20px;
}
.wrap{
  max-width:700px;
  margin:auto;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:16px;
}
button{
  padding:10px 14px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary{background:#245d8b;color:#fff;}
.secondary{background:#e8f0f8;}
.danger{background:#9e2b2b;color:#fff;}
input{width:100%;padding:10px;margin-top:4px;}
label{display:block;margin-bottom:12px;}
.msg{margin-bottom:12px;}
</style>
</head>

<body>
<div class="wrap">

<div id="msg" class="msg"></div>

<div class="card">
<h2 id="eventTitle">Loading event…</h2>
<div id="eventInfo"></div>
</div>

<div class="card">
<h3>Member lookup</h3>

<form id="lookupForm">
<label>
Membership number
<input id="memberIdInput" />
</label>

<label>
PIN
<input id="pinInput" type="password" />
</label>

<button class="primary" type="submit">Lookup</button>
</form>
</div>

<div class="card">
<h3>Booking</h3>

<form id="bookingForm">

<label>
Name
<input id="nameInput" />
</label>

<label>
Email
<input id="emailInput" />
</label>

<label>
Places
<input id="placesInput" type="number" value="1" min="0"/>
</label>

<label>
Notes
<input id="notesInput"/>
</label>

<button class="primary" type="submit">Save</button>
<button class="danger" type="button" id="cancelBtn">Cancel</button>

</form>

<div id="existingBox"></div>

</div>

</div>

<script>
const BACKEND = "https://sanctuary-backend-8iqc.onrender.com";

/* -------------------------
   ROBUST EVENT ID DETECTION
-------------------------- */

const rawSearch = window.location.search || "";
const rawHref = window.location.href || "";
const qs = new URLSearchParams(rawSearch);

let EVENT_ID =
  (qs.get("event_id") || qs.get("_id") || "").trim();

if (!EVENT_ID && rawHref.includes("?")) {
  try{
    const tail = rawHref.split("?")[1].split("#")[0];
    const qs2 = new URLSearchParams(tail);
    EVENT_ID = (qs2.get("event_id") || qs2.get("_id") || "").trim();
  }catch(_){}
}

/* 🔍 TEMP DEBUG (REMOVE LATER) */
alert(
  "DEBUG\n\n" +
  "Href: " + window.location.href + "\n\n" +
  "Search: " + window.location.search + "\n\n" +
  "EVENT_ID: " + EVENT_ID
);

/* ------------------------- */

let authToken = "";
let memberId = "";
let currentBooking = null;

/* ------------------------- */

function msg(t){document.getElementById("msg").textContent=t;}

async function getJson(url, opts={}){
  const r = await fetch(url, opts);
  const j = await r.json();
  if (!r.ok || j.success===false){
    throw new Error(j.message || "error");
  }
  return j;
}

/* -------------------------
   LOAD EVENT (NO AUTH)
-------------------------- */

async function loadEvent(){
  if (!EVENT_ID){
    msg("❌ No event_id detected");
    return;
  }

  try{
    const data = await getJson(`${BACKEND}/api/events/${EVENT_ID}`);
    const e = data.event || data;

    document.getElementById("eventTitle").textContent =
      e.title || e.event_title || "Event";

    document.getElementById("eventInfo").textContent =
      e.location || "";

  }catch(e){
    msg("Event load failed: " + e.message);
  }
}

/* -------------------------
   LOGIN
-------------------------- */

async function login(mid, pin){

  const res = await getJson(`${BACKEND}/auth/login`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      member_id: mid,
      memberId: mid,
      pin: pin
    })
  });

  authToken = res.token || res.authToken;
  memberId = mid;

}

/* -------------------------
   LOAD EXISTING BOOKING
-------------------------- */

async function loadMyBooking(){

  if (!authToken || !memberId) return;

  try{
    const r = await getJson(`${BACKEND}/api/events/${EVENT_ID}/my-booking`,{
      headers:{Authorization:`Bearer ${authToken}`}
    });

    currentBooking = r.booking || null;

    renderExisting();

  }catch(e){
    currentBooking = null;
  }
}

/* -------------------------
   RENDER EXISTING
-------------------------- */

function renderExisting(){

  const box = document.getElementById("existingBox");

  if (!currentBooking){
    box.innerHTML = "No existing booking";
    return;
  }

  box.innerHTML =
    "Existing booking: " +
    JSON.stringify(currentBooking);
}

/* -------------------------
   SAVE
-------------------------- */

async function saveBooking(){

  const payload = {
    member_id: memberId,
    member_name: document.getElementById("nameInput").value,
    email: document.getElementById("emailInput").value,
    places_total: Number(document.getElementById("placesInput").value),
    notes: document.getElementById("notesInput").value
  };

  await getJson(`${BACKEND}/api/events/${EVENT_ID}/book`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:`Bearer ${authToken}`
    },
    body:JSON.stringify(payload)
  });

  msg("Saved ✔");

  await loadMyBooking();
}

/* -------------------------
   CANCEL
-------------------------- */

async function cancelBooking(){

  await getJson(`${BACKEND}/api/events/${EVENT_ID}/cancel`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:`Bearer ${authToken}`
    },
    body:JSON.stringify({member_id:memberId})
  });

  msg("Cancelled ✔");

  currentBooking = null;
  renderExisting();
}

/* -------------------------
   EVENTS
-------------------------- */

document.getElementById("lookupForm").addEventListener("submit", async e=>{
  e.preventDefault();

  try{
    await login(
      document.getElementById("memberIdInput").value.trim(),
      document.getElementById("pinInput").value.trim()
    );

    msg("Login OK");

    await loadMyBooking();

  }catch(err){
    msg("Login failed: " + err.message);
  }
});

document.getElementById("bookingForm").addEventListener("submit", async e=>{
  e.preventDefault();
  await saveBooking();
});

document.getElementById("cancelBtn").addEventListener("click", cancelBooking);

/* ------------------------- */

loadEvent();

</script>
</body>
</html>
