<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Host Notice | Sanctuary Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />

  <script src="access.js?v=AC_1"></script>

  <style>
    :root{
      --bg1:#eef6ff;
      --bg2:#f8fbff;
      --card:#ffffff;
      --ink:#1f2937;
      --muted:#667085;
      --line:#d9e5f0;
      --brand:#0f4c81;
      --brand2:#1d6ca8;
      --soft:#e8f2fb;
      --shadow:0 14px 34px rgba(15,76,129,0.10);
      --radius:24px;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      padding:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, #ffffff 100%);
      min-height:100%;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .page{
      max-width:1240px;
      margin:0 auto;
      padding:20px 16px 52px;
    }

    .topbar{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }

    .crumbs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      color:var(--muted);
      font-size:0.96rem;
    }

    .crumbs a{
      color:var(--brand);
      font-weight:700;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--brand);
      font-weight:700;
      font-size:0.95rem;
    }

    .status{
      margin:0 0 14px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid #deebf5;
      background:#f7fbff;
      color:#466074;
      font-size:0.95rem;
      font-weight:700;
    }

    .hidden{
      display:none !important;
    }

    .poster{
      width:100%;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .poster-image-wrap{
      width:100%;
      background:#edf4fa;
      min-height:180px;
      border-bottom:1px solid var(--line);
    }

    .poster-image{
      width:100%;
      display:block;
      object-fit:cover;
      max-height:520px;
      background:#edf4fa;
    }

    .poster-image-placeholder{
      min-height:180px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
      color:#5c7084;
      font-weight:700;
      background:linear-gradient(135deg, rgba(15,76,129,0.12), rgba(255,255,255,0.98));
    }

    .poster-body{
      padding:24px 22px 26px;
    }

    .poster-top{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      gap:18px;
      margin-bottom:16px;
    }

    .title-wrap{
      flex:1 1 640px;
      min-width:0;
    }

    .badge-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      margin-bottom:12px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:6px 11px;
      border-radius:999px;
      font-size:0.82rem;
      font-weight:800;
      letter-spacing:0.01em;
    }

    .badge.notice{
      background:#e8f2fb;
      color:var(--brand);
    }

    .badge.category{
      background:#eefaf3;
      color:#117a46;
    }

    .poster-title{
      margin:0;
      font-size:clamp(2rem, 4.5vw, 3.25rem);
      line-height:1.05;
      color:var(--brand);
      letter-spacing:-0.02em;
      word-break:break-word;
    }

    .cta-wrap{
      flex:0 0 320px;
      max-width:100%;
    }

    .cta-button{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      width:100%;
      min-height:58px;
      padding:14px 18px;
      border:none;
      border-radius:16px;
      background:var(--brand);
      color:#fff;
      font-weight:800;
      font-size:1.04rem;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(15,76,129,0.20);
    }

    .cta-button:hover{
      background:var(--brand2);
    }

    .facts-strip{
      display:grid;
      grid-template-columns:repeat(5, minmax(0, 1fr));
      gap:10px;
      margin-bottom:18px;
    }

    .fact{
      padding:12px 13px;
      border:1px solid #e2ecf4;
      border-radius:16px;
      background:#fbfdff;
      min-width:0;
    }

    .fact-label{
      margin:0 0 4px;
      color:var(--muted);
      font-size:0.8rem;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.03em;
    }

    .fact-value{
      margin:0;
      color:#213547;
      font-size:0.98rem;
      line-height:1.45;
      font-weight:600;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .summary{
      margin:0 0 18px;
      color:#334155;
      font-size:1.08rem;
      line-height:1.7;
      white-space:pre-wrap;
    }

    .notice-area{
      min-height:260px;
      padding:18px 18px 20px;
      border:1px solid #e2ecf4;
      border-radius:18px;
      background:linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    }

    .notice-body{
      color:#2b3d4f;
      line-height:1.82;
      font-size:1rem;
    }

    .notice-body p{
      margin:0 0 1em;
    }

    .notice-body p:last-child{
      margin-bottom:0;
    }

    .notice-body ul,
    .notice-body ol{
      margin:0 0 1em 1.25em;
      padding:0;
    }

    .notice-body li{
      margin:0 0 .45em;
    }

    .helper-links{
      display:flex;
      flex-wrap:wrap;
      gap:10px 16px;
      margin-top:18px;
    }

    .helper-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--brand);
      font-weight:700;
      font-size:0.95rem;
    }

    .empty-state{
      padding:18px;
      border:1px dashed #c8d9e7;
      border-radius:16px;
      background:#fbfdff;
      color:#526474;
      line-height:1.55;
    }

    @media (max-width: 1040px){
      .facts-strip{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px){
      .poster-top{
        flex-direction:column;
      }

      .cta-wrap{
        width:100%;
        flex:1 1 auto;
      }

      .facts-strip{
        grid-template-columns:1fr;
      }
    }

    @media (max-width: 680px){
      .page{
        padding:16px 12px 36px;
      }

      .poster-body{
        padding:16px 14px 18px;
      }

      .poster-title{
        font-size:clamp(1.8rem, 9vw, 2.5rem);
      }

      .summary{
        font-size:1rem;
      }

      .notice-area{
        padding:14px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="crumbs">
        <a href="events.html">Events Diary</a>
        <span>›</span>
        <span>Host Notice</span>
      </div>

      <a class="back-link" href="events.html">← Back to Events Diary</a>
    </div>

    <div id="status" class="status">Loading Host Notice...</div>

    <main id="app" class="hidden">
      <section class="poster">
        <div id="posterImageWrap" class="poster-image-wrap">
          <img id="posterImage" class="poster-image hidden" src="" alt="" />
          <div id="posterPlaceholder" class="poster-image-placeholder">Host Notice</div>
        </div>

        <div class="poster-body">
          <div class="poster-top">
            <div class="title-wrap">
              <div class="badge-row">
                <span class="badge notice">Host Notice</span>
                <span id="categoryBadge" class="badge category hidden"></span>
              </div>

              <h1 id="title" class="poster-title">Event</h1>
            </div>

            <div class="cta-wrap">
              <button id="bookingBtn" class="cta-button" type="button">
                Book or register your interest
              </button>
            </div>
          </div>

          <div class="facts-strip">
            <div class="fact">
              <p class="fact-label">Date</p>
              <p id="dateValue" class="fact-value">—</p>
            </div>

            <div class="fact">
              <p class="fact-label">Time</p>
              <p id="timeValue" class="fact-value">—</p>
            </div>

            <div class="fact">
              <p class="fact-label">Location</p>
              <p id="locationValue" class="fact-value">—</p>
            </div>

            <div class="fact">
              <p class="fact-label">Host</p>
              <p id="hostValue" class="fact-value">—</p>
            </div>

            <div class="fact">
              <p class="fact-label">Availability</p>
              <p id="availabilityValue" class="fact-value">—</p>
            </div>
          </div>

          <p id="summary" class="summary hidden"></p>

          <div class="notice-area">
            <div id="body" class="notice-body"></div>
          </div>

          <div class="helper-links">
            <a class="helper-link" href="events-calendar.html">View Calendar</a>
            <a class="helper-link" href="events.html">Return to Events Diary</a>
          </div>
        </div>
      </section>
    </main>

    <div id="errorBox" class="empty-state hidden"></div>
  </div>
