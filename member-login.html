<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members Access – Sanctuary Club</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="stylesheet" href="styles-main.css?v=ML_1" />

  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: linear-gradient(180deg, #d9ecff 0%, #f2f7fb 45%, #ffffff 100%);
      color:#222;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:1rem;
    }
    .card{
      width:min(520px, 100%);
      background:#fff;
      border-radius:16px;
      box-shadow:0 2px 12px rgba(0,0,0,0.08);
      padding:1.25rem;
      border:1px solid rgba(219,230,243,0.9);
    }
    h1{margin:0 0 0.5rem; color:#003366; font-size:1.4rem;}
    p{margin:0.35rem 0; color:#556; line-height:1.45;}
    label{display:block; margin-top:0.9rem; font-weight:800; color:#003366;}
    input{
      width:140px;
      padding:0.6rem;
      font-size:1.1rem;
      border:1px solid #cfd8e3;
      border-radius:12px;
      margin-top:0.35rem;
      letter-spacing:0.12em;
    }
    .row{display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap; margin-top:1rem;}
    button{
      background:#005ea8;
      color:#fff;
      border:none;
      padding:0.6rem 1rem;
      border-radius:12px;
      cursor:pointer;
      font-weight:900;
      font-size:1rem;
    }
    button.secondary{background:#7f97ad;}
    .msg{margin-top:0.75rem; font-weight:800; color:#b00020; display:none;}
    .hint{color:#667; font-size:0.92rem;}
  </style>
</head>

<body>
  <div class="card">
    <h1>Members Access</h1>
    <p>Enter the Sanctuary Club access PIN to continue.</p>
    <p class="hint">(This creates an 8-hour session on this device.)</p>

    <label for="pin">Access PIN</label>
    <input id="pin" maxlength="4" placeholder="WXYZ" autocomplete="off" style="text-transform:uppercase;" />


    <div class="row">
      <button id="enterBtn" type="button" disabled>Enter</button>
      <button class="secondary" type="button" onclick="location.href='index.html'">Back</button>
    </div>

    <div id="msg" class="msg">Incorrect PIN.</div>
  </div>

<script>
  // CHANGE THIS to your chosen site-wide access PIN:
  const ACCESS_PIN = "WXYZ";

  const pinEl = document.getElementById("pin");
  const enterBtn = document.getElementById("enterBtn");
  const msg = document.getElementById("msg");

function okPin(v){ return /^[A-Za-z]{4}$/.test(v); }


  pinEl.addEventListener("input", () => {
    msg.style.display = "none";
    enterBtn.disabled = !okPin(pinEl.value.trim());
  });

  function grantAndGo(){
  const v = pinEl.value.trim().toUpperCase();
  
    if (v !== ACCESS_PIN) {
      msg.style.display = "block";
      return;
    }
    sessionStorage.setItem("sanctuaryAccess", "granted");
    sessionStorage.setItem("sanctuaryAccessTime", String(Date.now()));
    location.href = "members-info.html";
  }

  enterBtn.onclick = grantAndGo;
  pinEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !enterBtn.disabled) grantAndGo();
  });
</script>
</body>
</html>
