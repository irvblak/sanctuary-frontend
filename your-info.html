<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Information</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
      color: #222;
    }

    nav {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .intro {
      margin-bottom: 1.25rem;
    }

    .intro .subtle {
      color: #666;
      font-size: 0.9rem;
    }

    .member-id-row {
      margin-bottom: 1.25rem;
    }

    .member-id-row input {
      width: 140px;
      padding: 0.4rem;
      font-size: 0.95rem;
    }

    .residents {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .resident-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.75rem;
      background: #fafafa;
    }

    .resident-card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      margin-top: 0.4rem;
      color: #555;
    }

    input {
      width: 100%;
      padding: 0.35rem;
      font-size: 0.9rem;
    }

    button {
      margin-top: 1.25rem;
      padding: 0.6rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <div>
    <a href="members-directory.html">Members</a>
    &nbsp;|&nbsp;
    <a href="members-info.html">Information</a>
    &nbsp;|&nbsp;
    <a href="#" id="logout-link">Logout</a>
  </div>
</nav>

<main>
  <h1>Your Information</h1>

  <div class="intro">
    <p>
     Enter your membership number and click anywhere to see what you share with other members.
      (You can change it anytime you wish) <br> 
      <span class="subtle">(You can change it at any time.)</span>
    </p>
    <p>
      See it in the <a href="members-directory.html">Members Directory →</a>
    </p>
  </div>

  <div class="member-id-row">
    <label>Membership number (e.g. SM55, SC12)</label>
    <input id="memberId" placeholder="SM55" />
  </div>

  <div class="residents" id="residents"></div>

  <button id="saveBtn">Save</button>
</main>

<script>
  const STORAGE_KEY = "sanctuaryMembers";
  const ACCESS_KEY = "sanctuaryAccess";
  const TIME_KEY = "sanctuaryAccessTime";

  const residentsEl = document.getElementById("residents");

  function loadStore() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch {
      return {};
    }
  }

  function saveStore(store) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }

  function makeResidentCard(index, data = {}) {
    const div = document.createElement("div");
    div.className = "resident-card";
    div.innerHTML = `
      <h3>Resident ${index + 1}</h3>
      <label>Name</label>
      <input data-field="name" value="${data.name || ""}">
      <label>Email</label>
      <input data-field="email" value="${data.email || ""}">
      <label>Mobile</label>
      <input data-field="mobile" value="${data.mobile || ""}">
      ${index === 0 ? `
        <label>Landline</label>
        <input data-field="landline" value="${data.landline || ""}">
      ` : ""}
    `;
    return div;
  }

  function renderResidents(existing = []) {
    residentsEl.innerHTML = "";
    for (let i = 0; i < 4; i++) {
      residentsEl.appendChild(makeResidentCard(i, existing[i]));
    }
  }

  document.getElementById("saveBtn").onclick = () => {
    const memberId = document.getElementById("memberId").value.trim();
    if (!memberId) return;

    const residents = [...document.querySelectorAll(".resident-card")]
      .map(card => {
        const obj = {};
        card.querySelectorAll("input").forEach(inp => {
          if (inp.value.trim()) obj[inp.dataset.field] = inp.value.trim();
        });
        return obj;
      })
      .filter(r => Object.keys(r).length);

    const store = loadStore();
    store[memberId] = { residents };
    saveStore(store);
    alert("Saved");
  };

  // Logout
  document.getElementById("logout-link").onclick = e => {
    e.preventDefault();
    sessionStorage.removeItem(ACCESS_KEY);
    sessionStorage.removeItem(TIME_KEY);
    location.href = "index.html";
  };

  // Init (prefill if exists)
  const store = loadStore();
  const idInput = document.getElementById("memberId");
  idInput.onchange = () => {
    renderResidents(store[idInput.value]?.residents || []);
  };
  renderResidents();
</script>

</body>
</html>
