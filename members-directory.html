<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Members</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #222;
    }

    /* --- Top Navigation --- */
    .top-nav {
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .nav-left {
      justify-self: start;
    }

    .nav-center {
      justify-self: center;
      display: flex;
      gap: 1.25rem;
    }

    .nav-right {
      justify-self: end;
    }

    .top-nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    /* --- Directory Grid --- */
    .directory {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .member-card {
      padding: 1rem;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      border-left: 4px solid #e3edf7;
    }

    .member-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #1a1a1a;
    }

    .member-field {
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 0.15rem;
    }

    .updated {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #777;
    }

    /* --- Mobile polish --- */
    @media (max-width: 640px) {
      .top-nav {
        grid-template-columns: 1fr;
        row-gap: 0.75rem;
        text-align: center;
      }

      .nav-left,
      .nav-center,
      .nav-right {
        justify-self: center;
      }

      .member-card {
        padding: 1rem;
      }

      .member-name {
        font-size: 1.15rem;
      }
    }
  </style>
</head>

<body>

  <nav class="top-nav">
    <div class="nav-left">
      <a href="index.html">Home</a>
    </div>

    <div class="nav-center">
      <a href="calendar.html">Calendar</a>
      <a href="your-info.html">Your Information</a>
    </div>

    <div class="nav-right">
      <a href="logout.html">Logout</a>
    </div>
  </nav>

  <main class="directory" id="directory">
    <!-- Cards rendered by members-directory.js -->
  </main>

  <script src="members-directory.js"></script>
</body>
</html>
