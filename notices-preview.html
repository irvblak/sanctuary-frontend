<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notices | Sanctuary Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Members-only access -->
  <script src="access.js?v=AC_1"></script>

  <style>
    :root{
      --bg1:#eaf4ff;
      --bg2:#f8fbff;
      --card:#ffffff;
      --ink:#1f2937;
      --muted:#667085;
      --line:#dbe6f0;
      --brand:#0f4c81;
      --brand2:#1d6ca8;
      --soft:#e8f2fb;
      --shadow:0 12px 28px rgba(15,76,129,0.08);
      --radius:20px;

      --events:#0f4c81;
      --committee:#7c3aed;
      --activities:#0f766e;
      --services:#c2410c;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      padding:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 42%, #ffffff 100%);
      min-height:100%;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .page{
      max-width:1120px;
      margin:0 auto;
      padding:20px 16px 48px;
    }

    .topbar{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
    }

    .crumbs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      color:var(--muted);
      font-size:0.96rem;
    }

    .crumbs a{
      color:var(--brand);
      font-weight:700;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--brand);
      font-weight:700;
      font-size:0.95rem;
    }

    .hero{
      background:linear-gradient(135deg, rgba(15,76,129,0.10), rgba(255,255,255,0.98));
      border:1px solid rgba(15,76,129,0.12);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:22px 18px;
      margin-bottom:18px;
    }

    .hero h1{
      margin:0 0 8px;
      font-size:clamp(1.8rem, 3vw, 2.35rem);
      line-height:1.12;
      color:var(--brand);
    }

    .hero p{
      margin:0;
      max-width:820px;
      color:#334155;
      line-height:1.58;
    }

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:18px;
    }

    .cat-btn{
      appearance:none;
      border:1px solid #c9dced;
      background:#fff;
      color:var(--brand);
      border-radius:999px;
      padding:10px 16px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(0,0,0,.05);
      transition:transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease;
    }

    .cat-btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 20px rgba(15,76,129,0.10);
    }

    .cat-btn.active{
      background:var(--brand);
      color:#fff;
      border-color:transparent;
    }

    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel-inner{
      padding:18px;
    }

    .panel-head{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:16px;
    }

    .panel-head h2{
      margin:0 0 6px;
      color:var(--brand);
      font-size:1.25rem;
    }

    .panel-sub{
      color:var(--muted);
      line-height:1.5;
    }

    .status{
      display:none;
      margin-bottom:14px;
      padding:12px 14px;
      border-radius:14px;
      font-weight:700;
      line-height:1.45;
    }

    .status.show{ display:block; }

    .status.info{
      background:#eef6ff;
      border:1px solid rgba(15,76,129,.14);
      color:#0b4d87;
    }

    .status.warn{
      background:#fff9ed;
      border:1px solid rgba(138,91,0,.18);
      color:#8a5b00;
    }

    .status.err{
      background:#fff4f4;
      border:1px solid rgba(180,35,24,.18);
      color:#b42318;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(290px, 1fr));
      gap:16px;
    }

    .notice-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 8px 18px rgba(15,76,129,0.06);
      display:flex;
      flex-direction:column;
      min-height:100%;
    }

    .notice-card.media-top .notice-media{
      display:block;
    }

    .notice-media{
      display:none;
      width:100%;
      height:190px;
      object-fit:cover;
      background:#eef4f8;
      border-bottom:1px solid var(--line);
    }

    .notice-body{
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      flex:1;
    }

    .badge-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      font-size:0.8rem;
      font-weight:800;
      letter-spacing:0.01em;
    }

    .badge.events{ background:#e8f2fb; color:var(--events); }
    .badge.committee{ background:#f3e8ff; color:var(--committee); }
    .badge.activities{ background:#e8faf6; color:var(--activities); }
    .badge.services{ background:#fff1e9; color:var(--services); }

    .when{
      color:var(--muted);
      font-size:0.93rem;
      line-height:1.45;
    }

    .title{
      margin:0;
      font-size:1.1rem;
      line-height:1.3;
      color:#123b62;
    }

    .summary{
      margin:0;
      color:#334155;
      line-height:1.55;
      font-size:0.97rem;
      white-space:pre-wrap;
    }

    .card-footer{
      margin-top:auto;
      padding-top:4px;
    }

    .open-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--brand);
      font-weight:800;
      font-size:0.95rem;
    }

    .empty{
      padding:18px;
      border:1px dashed #c8d9e7;
      border-radius:16px;
      background:#fbfdff;
      color:#526474;
      line-height:1.55;
    }

    .hidden{
      display:none !important;
    }

    @media (max-width:680px){
      .page{
        padding:16px 12px 36px;
      }

      .hero,
      .panel-inner{
        padding:16px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="crumbs">
        <a href="members-info.html">Members Hub</a>
        <span>›</span>
        <span>Notices</span>
      </div>

      <a class="back-link" href="members-info.html">← Back to Members Hub</a>
    </div>

    <section class="hero">
      <h1>Club Notices</h1>
      <p>
        Browse notices from Events, Committee, Activities and Services.
        Event notices open to the Host Notice page, where members can then continue to booking or register interest.
      </p>
    </section>

    <div class="toolbar" id="categoryToolbar">
      <button class="cat-btn active" type="button" data-category="events">Events</button>
      <button class="cat-btn" type="button" data-category="committee">Committee</button>
      <button class="cat-btn" type="button" data-category="activities">Activities</button>
      <button class="cat-btn" type="button" data-category="services">Services</button>
    </div>

    <section class="panel">
      <div class="panel-inner">
        <div class="panel-head">
          <div>
            <h2 id="panelTitle">Event Notices</h2>
            <div class="panel-sub" id="panelSub">
              Notices drawn directly from live event records.
            </div>
          </div>
        </div>

        <div id="statusBox" class="status info"></div>
        <div id="content"></div>
      </div>
    </section>
  </div>

  <script>
    (function(){
      const BACKEND_URL =
        (window.SanctuaryConfig && window.SanctuaryConfig.BACKEND_URL) ||
        "https://sanctuary-backend-8iqc.onrender.com";

      const toolbar = document.getElementById("categoryToolbar");
      const panelTitle = document.getElementById("panelTitle");
      const panelSub = document.getElementById("panelSub");
      const content = document.getElementById("content");
      const statusBox = document.getElementById("statusBox");

      let currentCategory = "events";

      const CATEGORY_META = {
        events: {
          title: "Event Notices",
          sub: "Notices drawn directly from live event records."
        },
        committee: {
          title: "Committee Notices",
          sub: "Committee notices will appear here."
        },
        activities: {
          title: "Activities Notices",
          sub: "General activities notices will appear here."
        },
        services: {
          title: "Services Notices",
          sub: "Service-related notices will appear here."
        }
      };

      function setStatus(kind, message){
        if(!message){
          statusBox.className = "status";
          statusBox.textContent = "";
          return;
        }
        statusBox.className = `status show ${kind}`;
        statusBox.textContent = message;
      }

      function escapeHtml(value){
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function stripHtml(value){
        const div = document.createElement("div");
        div.innerHTML = value || "";
        return (div.textContent || div.innerText || "").trim();
      }

      function truncate(text, maxLen){
        const s = String(text || "").trim();
        if(s.length <= maxLen) return s;
        return s.slice(0, maxLen).trimEnd() + "…";
      }

      function asArray(payload){
        if(Array.isArray(payload)) return payload;
        if(Array.isArray(payload?.events)) return payload.events;
        if(Array.isArray(payload?.items)) return payload.items;
        if(Array.isArray(payload?.data)) return payload.data;
        return [];
      }

      function getField(obj, names, fallback=""){
        for(const name of names){
          if(obj && obj[name] !== undefined && obj[name] !== null && obj[name] !== ""){
            return obj[name];
          }
        }
        return fallback;
      }

      function formatDate(dateStr){
        if(!dateStr) return "";
        try{
          const d = new Date(dateStr);
          if(!Number.isNaN(d.getTime())){
            return d.toLocaleDateString("en-GB", {
              weekday:"short",
              day:"numeric",
              month:"short",
              year:"numeric"
            });
          }
        }catch{}
        return String(dateStr);
      }

      function formatWhen(ev){
        const dateVal = getField(ev, ["event_date", "date", "start_date", "start_datetime", "start"]);
        const timeVal = getField(ev, ["start_time", "time", "event_time"]);
        const formattedDate = formatDate(dateVal);
        return [formattedDate, timeVal].filter(Boolean).join(" · ");
      }

      function getEventId(ev){
        return getField(ev, ["event_id", "id"]);
      }

      function getSummary(ev){
        return getField(ev, ["notice_summary", "summary", "short_description"]);
      }

      function getBody(ev){
        return getField(ev, ["notice_body", "description", "body", "details"]);
      }

      function getMedia(ev){
        const media = getField(ev, ["notice_media", "image_url", "image", "media"]);
        if(Array.isArray(media)) return media[0] || "";
        return media;
      }

      function getTitle(ev){
        return getField(ev, ["title", "event_title", "name"], "Untitled event");
      }

      function getLocation(ev){
        return getField(ev, ["location", "venue", "place"]);
      }

      function sortEvents(events){
        return [...events].sort((a, b) => {
          const aVal = getField(a, ["event_date", "date", "start_date", "start_datetime", "start"]);
          const bVal = getField(b, ["event_date", "date", "start_date", "start_datetime", "start"]);
          const aTs = Date.parse(aVal);
          const bTs = Date.parse(bVal);

          if(Number.isNaN(aTs) && Number.isNaN(bTs)) return 0;
          if(Number.isNaN(aTs)) return 1;
          if(Number.isNaN(bTs)) return -1;

          return aTs - bTs;
        });
      }

      function renderEmpty(message){
        content.innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
      }

      function renderPlaceholder(category){
        const messages = {
          committee: "No Committee notices have been published yet.",
          activities: "No Activities notices have been published yet.",
          services: "No Services notices have been published yet."
        };
        renderEmpty(messages[category] || "No notices are available in this category yet.");
      }

      function renderEvents(events){
        const usable = sortEvents(events).filter(ev => getEventId(ev));

        if(!usable.length){
          renderEmpty("There are no event notices to show at the moment.");
          return;
        }

        content.innerHTML = `
          <div class="cards">
            ${usable.map(ev => {
              const eventId = getEventId(ev);
              const title = getTitle(ev);
              const summary = truncate(
                getSummary(ev) || stripHtml(getBody(ev)) || "Open the Host Notice for full details.",
                220
              );
              const media = getMedia(ev);
              const whenText = formatWhen(ev);
              const location = getLocation(ev);
              const href = `events-details.html?event_id=${encodeURIComponent(eventId)}`;

              return `
                <article class="notice-card${media ? " media-top" : ""}">
                  ${media ? `<a href="${href}"><img class="notice-media" src="${escapeHtml(media)}" alt="${escapeHtml(title)}"></a>` : ""}
                  <div class="notice-body">
                    <div class="badge-row">
                      <span class="badge events">Event</span>
                    </div>

                    ${whenText || location ? `
                      <div class="when">
                        ${whenText ? `<div>${escapeHtml(whenText)}</div>` : ""}
                        ${location ? `<div>${escapeHtml(location)}</div>` : ""}
                      </div>
                    ` : ""}

                    <h3 class="title">
                      <a href="${href}">${escapeHtml(title)}</a>
                    </h3>

                    <p class="summary">${escapeHtml(summary)}</p>

                    <div class="card-footer">
                      <a class="open-link" href="${href}">Open Host Notice →</a>
                    </div>
                  </div>
                </article>
              `;
            }).join("")}
          </div>
        `;
      }

      async function getJson(url){
        const res = await fetch(url, {
          headers: { "Accept": "application/json" }
        });

        const text = await res.text();
        let data = {};
        try{
          data = text ? JSON.parse(text) : {};
        }catch{
          data = {};
        }

        if(!res.ok){
          throw new Error(data.message || `HTTP ${res.status}`);
        }

        return data;
      }

      async function loadCategory(category){
        currentCategory = category;

        [...toolbar.querySelectorAll(".cat-btn")].forEach(btn => {
          btn.classList.toggle("active", btn.dataset.category === category);
        });

        const meta = CATEGORY_META[category];
        panelTitle.textContent = meta.title;
        panelSub.textContent = meta.sub;

        if(category !== "events"){
          setStatus("", "");
          renderPlaceholder(category);
          return;
        }

        setStatus("info", "Loading event notices...");
        content.innerHTML = "";

        try{
          const data = await getJson(`${BACKEND_URL}/api/events`);
          const events = asArray(data);
          setStatus("", "");
          renderEvents(events);
        }catch(err){
          console.error(err);
          renderEmpty("Sorry, event notices could not be loaded just now.");
          setStatus("err", err.message || "Could not load event notices.");
        }
      }

      toolbar.addEventListener("click", (e) => {
        const btn = e.target.closest(".cat-btn");
        if(!btn) return;
        const category = btn.dataset.category;
        if(category === currentCategory) return;
        loadCategory(category);
      });

      loadCategory("events");
    })();
  </script>
</body>
</html>
