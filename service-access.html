<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Service Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <link rel="stylesheet" href="styles-main.css?v=SERVICE_ACCESS_1" />

  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
      color:#1f2a37;
    }
    .wrap{
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem;
    }
    .card{
      margin-top: 1rem;
      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      padding: 1rem;
      box-shadow: 0 12px 30px rgba(0,0,0,.10);
    }
    h1{ margin:0; font-size: 1.5rem; }
    .sub{ margin:.35rem 0 0; color:#6b7280; }
    label{ display:block; margin-top:.85rem; font-weight:600; }
    input{
      width:100%;
      box-sizing:border-box;
      margin-top:.35rem;
      padding:.7rem .8rem;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.14);
      font-size: 1rem;
    }
    .row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:.8rem;
    }
    @media (max-width:640px){ .row{ grid-template-columns: 1fr; } }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:.6rem;
      margin-top: 1rem;
      align-items:center;
    }
    button{
      appearance:none;
      border:none;
      border-radius: 999px;
      padding: .65rem .95rem;
      font-weight: 700;
      cursor:pointer;
    }
    .primary{ background:#005ea8; color:#fff; }
    .ghost{
      background:#f3f4f6; color:#374151;
      border: 1px solid rgba(0,0,0,.08);
    }
    .msg{
      margin-top:.85rem;
      padding:.75rem .85rem;
      border-radius: 14px;
      background: #f0f7ff;
      border: 1px solid rgba(0,94,168,.20);
      color:#0b3a66;
      display:none;
    }
    .err{
      background:#fff7ed;
      border-color: rgba(234,88,12,.25);
      color:#9a3412;
    }
    .tiny{
      margin-top:.8rem;
      color:#6b7280;
      font-size:.92rem;
      line-height:1.35;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:.75rem;
      margin-top:.25rem;
    }
    a.btn{
      text-decoration:none;
      font-weight:700;
      color:#005ea8;
      background:#fff;
      border:1px solid rgba(0,0,0,.10);
      border-radius:999px;
      padding:.55rem .85rem;
      box-shadow: 0 8px 18px rgba(0,0,0,.06);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="btn" href="index.html">← Home</a>
      <a class="btn" href="members-hub.html">Members Hub</a>
    </div>

    <div class="card">
      <h1>Service Access</h1>
      <p class="sub">For authorised organisers and providers only.</p>

      <form id="loginForm">
        <div class="row">
          <div>
            <label for="entityId">ID</label>
            <input id="entityId" autocomplete="username" placeholder="e.g. SM55 or YOGA01" required />
          </div>
          <div>
            <label for="pin">PIN</label>
            <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="3 digits" required />
          </div>
        </div>

        <div class="actions">
          <button class="primary" type="submit">Enter</button>
          <button class="ghost" type="button" id="clearBtn">Clear</button>
        </div>

        <div id="msg" class="msg"></div>

        <p class="tiny">
          If you have forgotten your PIN, contact the Sanctuary Club Admin.
          After several incorrect attempts, access will temporarily lock.
        </p>
      </form>
    </div>
  </div>

  <script src="service.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const form = document.getElementById("loginForm");

    function showMessage(text, isError=false){
      msg.textContent = text;
      msg.style.display = "block";
      msg.classList.toggle("err", isError);
    }

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("entityId").value = "";
      document.getElementById("pin").value = "";
      msg.style.display = "none";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.style.display = "none";

      const entityId = document.getElementById("entityId").value.trim().toUpperCase();
      const pin = document.getElementById("pin").value.trim();

      if (!entityId || !pin) return;

      try {
        await ServiceAuth.login(entityId, pin);
        location.href = "service-dashboard2.html";
      } catch (err) {
        showMessage(err.message || "Login failed.", true);
      }
    });
  </script>
</body>
</html>
