<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Members Directory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="access.js"></script>
  <script src="logout.js"></script>
  <script src="members-directory.js" defer></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
      color: #222;
    }

    nav {
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
      margin: 0 0.5rem;
    }

    .nav-left { justify-self: start; }
    .nav-center {
      justify-self: center;
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .nav-right { justify-self: end; }

    main {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
      padding: 0 1rem;
    }

    h1 {
      margin-top: 0.5rem;
      font-size: 1.4rem;
    }

    h2 {
      margin-top: 1.8rem;
      font-size: 1.2rem;
      color: #003366;
    }

    .subtle{
      color:#555;
      line-height:1.45;
      margin:0.35rem 0 1rem 0;
      max-width:70ch;
    }

    .member-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(70px, 1fr));
      gap:0.5rem;
      margin-bottom:1rem;
    }

    .member-button {
      padding:0.45rem;
      font-size:0.85rem;
      border-radius:6px;
      border:1px solid #bbb;
      cursor:pointer;
      font-weight:500;
      transition:background-color 0.15s ease, border-color 0.15s ease;
    }

    .member-button.contact-complete {
      background:#e6f4ea;
      border-color:#2e7d32;
    }

    .member-button.contact-partial {
      background:#fff4d6;
      border-color:#b26a00;
    }

    .member-button.contact-basic {
      background:#e8f2ff;
      border-color:#005ea8;
    }

    .member-button.inactive {
      background:#f3f3f3;
      border-color:#999;
      opacity:1;
      cursor:pointer;
    }

    .member-button.active {
      background:#005ea8;
      color:#fff;
      border-color:#005ea8;
    }

    .md-legend {
      display:flex;
      flex-wrap:wrap;
      gap:1rem;
      align-items:center;
      margin:0.4rem 0 1rem;
      font-size:0.92rem;
      color:#555;
    }

    .md-legend span {
      display:flex;
      align-items:center;
      gap:0.35rem;
    }

    .blob {
      width:12px;
      height:12px;
      border-radius:50%;
      display:inline-block;
      border:1px solid #888;
    }

    .blob.complete {
      background:#e6f4ea;
      border-color:#2e7d32;
    }

    .blob.partial {
      background:#fff4d6;
      border-color:#b26a00;
    }

    .blob.basic {
      background:#e8f2ff;
      border-color:#005ea8;
    }

    .blob.inactive {
      background:#f3f3f3;
      border-color:#999;
    }

    #member-detail {
      margin-top:1.5rem;
    }

    .member-detail-wrapper {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
      gap:1rem;
    }

    .resident-card {
      background:#fff;
      border-radius:10px;
      padding:0.9rem 1rem;
      box-shadow:0 2px 8px rgba(0,0,0,0.06);
      border-left:4px solid #e3edf7;
    }

    .resident-header {
      font-weight:600;
      margin-bottom:0.4rem;
    }

    .resident-row {
      display:flex;
      justify-content:space-between;
      font-size:0.9rem;
      margin:0.2rem 0;
    }

    .resident-row span:first-child {
      color:#555;
    }

    @media (max-width:640px) {
      nav {
        grid-template-columns:1fr;
        row-gap:0.75rem;
        text-align:center;
      }

      .nav-left,
      .nav-center,
      .nav-right {
        justify-self:center;
      }

      .member-grid {
        grid-template-columns:repeat(auto-fill, minmax(60px, 1fr));
      }
    }
  </style>
</head>

<body>
<nav>
  <div class="nav-left">
    <a href="index.html">Home</a>
  </div>

  <div class="nav-center">
    <a href="events-calendar.html">Calendar</a>
    <a href="your-info.html">Your Information</a>
  </div>

  <div class="nav-right">
    <a href="#" onclick="logout(); return false;">Logout</a>
  </div>
</nav>

<main>
  <h1>Members Directory</h1>

  <p class="subtle">
    Click a member button and scroll down to see any contact details they have chosen to share.
  </p>

  <div class="md-legend">
    <span><span class="blob complete"></span> Complete contact details</span>
    <span><span class="blob partial"></span> Some contact details</span>
    <span><span class="blob inactive"></span> Joined (no contact details)</span>
  </div>

  <h2>SCH (Clubhouse)</h2>
  <div id="members-sch" class="member-grid"></div>

  <h2>Sanctuary Mews</h2>
  <div id="members-mews" class="member-grid"></div>

  <h2>Sanctuary Court</h2>
  <div id="members-court" class="member-grid"></div>

  <div id="member-detail"></div>
</main>
</body>
</html>
