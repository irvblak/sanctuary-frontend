<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Members</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
      color: #222;
    }

    /* --- Top Navigation --- */
    nav {
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    .nav-left { justify-self: start; }
    .nav-center {
      justify-self: center;
      display: flex;
      gap: 1.25rem;
    }
    .nav-right { justify-self: end; }

    /* --- Layout --- */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .section {
      margin-bottom: 1.5rem;
    }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 0.5rem;
    }

    .member-button {
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      font-weight: 500;
    }

    .member-button.inactive {
      opacity: 0.4;
      cursor: default;
    }

    .member-button.active {
      background: #e3edf7;
      border-color: #005ea8;
    }

    /* --- Detail area --- */
    #member-detail {
      margin-top: 1.5rem;
    }

    .member-detail-wrapper {
      display: grid;
      gap: 1rem;
    }

    .resident-card {
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-left: 4px solid #e3edf7;
    }

    .resident-header {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .resident-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }

    .resident-row span:first-child {
      color: #555;
    }

    /* --- Mobile polish --- */
    @media (max-width: 640px) {
      nav {
        grid-template-columns: 1fr;
        row-gap: 0.75rem;
        text-align: center;
      }

      .nav-left,
      .nav-center,
      .nav-right {
        justify-self: center;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-left">
      <a href="index.html">Home</a>
    </div>

    <div class="nav-center">
      <a href="calendar.html">Calendar</a>
      <a href="your-info.html">Your Information</a>
    </div>

    <div class="nav-right">
      <a href="logout.html">Logout</a>
    </div>
  </nav>

  <main>
    <h1>Members</h1>

    <div class="section">
      <h2>Sanctuary Mews</h2>
      <div id="members-mews" class="member-grid"></div>
    </div>

    <div class="section">
      <h2>Sanctuary Court</h2>
      <div id="members-court" class="member-grid"></div>
    </div>

    <div id="member-detail"></div>
  </main>

  <script src="members-directory.js"></script>
</body>
</html>
