<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css?v=FINAL" />
</head>

<body>

<div class="hero-wrapper">

  <!-- LEFT PANEL -->
  <div class="hero-panel">
    <h3>Welcome to The Sanctuary Club</h3>
    <p>A residents’ club for Sanctuary Mews and Sanctuary Court.</p>
  </div>

  <!-- HERO (CENTRE) -->
  <section class="hero">
    <div class="hero-overlay">

      <!-- TITLE -->
      <h1 class="hero-title">The Sanctuary Club</h1>

      <!-- ACTION STACK -->
      <div class="action-stack">

        <!-- ACCESS GATE -->
        <div id="access-gate" style="display:none;">
          <div class="access-input-wrapper">
            <input
              type="password"
              id="access-code-input"
              placeholder="Access code"
              autocomplete="off"
            />
            <button
              type="button"
              id="access-eye"
              class="toggle-visibility"
              aria-label="Show access code"
            >👁</button>
          </div>

          <button id="access-submit" class="hero-button">
            Continue
          </button>

          <div id="access-error" class="access-error" style="display:none;">
            Invalid access code
          </div>
        </div>

        <!-- BUTTONS -->
        <div class="hero-buttons">
          <button id="btn-whats-on" class="hero-button">What’s On</button>
          <button id="btn-info" class="hero-button">Info</button>
        </div>

      </div>

      <!-- FOOTER -->
      <footer class="site-footer">
        <p>© The Sanctuary Club. All rights reserved.</p>
      </footer>

    </div>
  </section>

  <!-- RIGHT PANEL -->
  <div class="hero-panel">
    <p>
      <strong><em>
        See what’s on, join activities, and optionally share contact details
        so neighbours can reach you — or so you can reach them.
      </em></strong>
    </p>
  </div>

</div>

<script src="script.js?v=FINAL"></script>

</body>
</html>
