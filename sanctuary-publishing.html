<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sanctuary Publishing | Sanctuary Club</title><script src="access.js?v=SCH_PUB_1"></script><style>
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(180deg,#d9ecff,#f5f9fd 45%,#fff);color:#22384d;min-height:100vh}.wrap{max-width:760px;margin:2rem auto;padding:0 1rem 2rem}.card{background:#fff;border:1px solid #d7e4ef;border-radius:22px;box-shadow:0 12px 32px rgba(20,60,100,.1);padding:1.4rem;margin-top:1rem}h1{margin:.1rem 0;color:#123a78}p{line-height:1.55}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:.7rem;align-items:end}.field label{display:block;font-weight:800;margin-bottom:.25rem}.field input,.field select{width:100%;box-sizing:border-box;padding:.7rem;border:1px solid #cbd9e6;border-radius:10px;font:inherit}button,.btn{border:0;border-radius:999px;padding:.7rem 1rem;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;background:#245d8b;color:#fff}.secondary{background:#eef3f7;color:#31506b;border:1px solid #d7e0e7}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}.menu a{min-height:70px}.hidden{display:none!important}.msg{margin-top:.8rem;font-weight:700;color:#8a2f2f}.top{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}.identity{font-weight:800;color:#31506b}@media(max-width:620px){.login,.menu{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><a class="btn secondary" href="events-calendar.html">← What's On</a><span class="identity" id="identity"></span></div><div class="card"><h1>Sanctuary Publishing</h1><p>For authorised Sanctuary Club House and Sanctuary Court publishing. This area provides Event Host facilities and the Design Studio only.</p><div id="loginPanel"><div class="login"><div class="field"><label for="schId">Publishing identity</label><select id="schId"><option value="SCH/1/M">SCH/1/M — Sanctuary Club House</option><option value="SCH/2/C">SCH/2/C — Sanctuary Court</option></select></div><div class="field"><label for="schPin">PIN</label><input id="schPin" type="password" inputmode="numeric" autocomplete="current-password"></div><button id="signIn" type="button">Sign in</button></div><div id="msg" class="msg"></div></div><div id="menuPanel" class="hidden"><div class="menu"><a class="btn" href="host-event-form.html?v=SCH_PUB_1">Create an Event</a><a class="btn" href="host-my-events.html?v=SCH_PUB_1">My Events</a><a class="btn" href="your-design-studio.html?v=SCH_PUB_1">Design Studio</a><a class="btn" href="my-vault.html?v=SCH_PUB_1">My Vault</a><a class="btn secondary" href="events-calendar.html">Calendar / What's On</a><button class="secondary" id="signOut" type="button">Sign out of Publishing</button></div></div></div></div>
<script>
const API="https://sanctuary-backend-8iqc.onrender.com",tokenKey="schPublishingToken";
function decode(token){try{let p=String(token||"").split(".")[0].replace(/-/g,"+").replace(/_/g,"/");while(p.length%4)p+="=";return JSON.parse(atob(p))}catch(_){return {}}}
function valid(token){const p=decode(token);return p.account_type==="sch_publisher"&&Number(p.exp)*1000>Date.now()}
function showSession(token){const p=decode(token);document.getElementById("loginPanel").classList.add("hidden");document.getElementById("menuPanel").classList.remove("hidden");document.getElementById("identity").textContent=p.rid||"";sessionStorage.setItem("memberToken",token);sessionStorage.setItem("authToken",token);sessionStorage.setItem("currentMemberId",p.mid||p.rid||"");sessionStorage.setItem("currentResidentId",p.rid||"");sessionStorage.setItem("currentHostResidentId",p.rid||"");sessionStorage.setItem("sanctuaryEntryRoute","info")}
async function signIn(){const msg=document.getElementById("msg");msg.textContent="";const residentId=document.getElementById("schId").value,pin=document.getElementById("schPin").value.trim();if(!pin){msg.textContent="Enter the Publishing PIN.";return}try{const r=await fetch(API+"/auth/sch-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({residentId,pin})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.token)throw new Error(d.message||"Sign-in failed.");sessionStorage.setItem(tokenKey,d.token);showSession(d.token)}catch(e){msg.textContent=e.message}}
function signOut(){[tokenKey,"memberToken","authToken","currentMemberId","currentResidentId","currentHostResidentId"].forEach(k=>sessionStorage.removeItem(k));location.reload()}
document.getElementById("signIn").onclick=signIn;document.getElementById("signOut").onclick=signOut;document.getElementById("schPin").addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});const existing=sessionStorage.getItem(tokenKey)||"";if(valid(existing))showSession(existing);
</script></body></html>
