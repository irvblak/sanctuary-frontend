<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Notice | Sanctuary Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />

  <script src="access.js?v=AC_1"></script>

  <style>
    :root{
      --bg1:#eef6fb;
      --bg2:#f8fbfd;
      --card:#ffffff;
      --ink:#1f2937;
      --muted:#6b7280;
      --line:#d9e4ec;
      --blue:#2563eb;
      --blue-2:#1d4ed8;
      --blue-soft:#eff6ff;
      --shadow:0 10px 28px rgba(15,23,42,.08);
      --radius:22px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top, #ffffff 0%, var(--bg2) 38%, var(--bg1) 100%);
      min-height:100vh;
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:20px 14px 42px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .crumbs{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      font-size:.95rem;
      color:var(--muted);
    }

    .crumbs a{
      color:var(--blue);
      text-decoration:none;
      font-weight:600;
    }

    .crumbs a:hover{ text-decoration:underline; }

    .shell{
      background:rgba(255,255,255,.84);
      backdrop-filter:blur(6px);
      border:1px solid rgba(255,255,255,.7);
      box-shadow:var(--shadow);
      border-radius:28px;
      overflow:hidden;
    }

    .notice-head{
      padding:22px 20px 14px;
      border-bottom:1px solid #edf2f7;
      background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(250,252,255,.92));
    }

    .title-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:16px;
      align-items:start;
    }

    .title-block{
      min-width:0;
    }

    .title-graphic-wrap{
      display:none;
      margin-bottom:8px;
    }

    .title-graphic{
      display:block;
      max-width:100%;
      max-height:140px;
      width:auto;
      height:auto;
      object-fit:contain;
    }

    h1{
      margin:0;
      font-size:clamp(1.7rem, 3vw, 2.5rem);
      line-height:1.12;
      letter-spacing:-0.02em;
      word-break:break-word;
    }

    .summary{
      margin:10px 0 0;
      color:var(--muted);
      font-size:1rem;
      line-height:1.55;
      max-width:65ch;
    }

    .head-actions{
      display:flex;
      justify-content:flex-end;
      align-items:flex-start;
    }

    .book-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:46px;
      padding:12px 18px;
      border:none;
      border-radius:999px;
      background:linear-gradient(135deg, var(--blue), var(--blue-2));
      color:#fff;
      text-decoration:none;
      font-weight:700;
      font-size:.98rem;
      box-shadow:0 8px 18px rgba(37,99,235,.18);
      white-space:nowrap;
      cursor:pointer;
    }

    .book-btn:hover{
      filter:brightness(1.02);
    }

    .meta-strip{
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:12px;
      padding:14px 20px 20px;
    }

    .meta-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px 13px;
    }

    .meta-label{
      margin:0 0 6px;
      font-size:.78rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:var(--muted);
    }

    .meta-value{
      font-size:.98rem;
      font-weight:600;
      line-height:1.4;
      word-break:break-word;
    }

    .notice-body{
      padding:22px 20px 26px;
      background:linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    }

    .notice-panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:22px 18px;
    }

    .inline-image-wrap{
      display:none;
      text-align:center;
      margin:0 0 18px;
    }

    .inline-image{
      display:block;
      margin:0 auto;
      max-width:min(100%, 420px);
      max-height:300px;
      width:auto;
      height:auto;
      object-fit:contain;
      border-radius:18px;
      border:1px solid #e6eef5;
      box-shadow:0 8px 22px rgba(15,23,42,.08);
      background:#fff;
    }

    .body-copy{
      font-size:1.06rem;
      line-height:1.75;
      color:#1f2937;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .body-copy p{
      margin:0 0 1em;
    }

    .body-copy p:last-child{
      margin-bottom:0;
    }

    .empty-copy{
      color:var(--muted);
      font-style:italic;
    }

    .foot-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .ghost-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:10px 15px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      text-decoration:none;
      font-weight:700;
    }

    .ghost-btn:hover{
      background:#f8fafc;
    }

    .message{
      margin-top:14px;
      border-radius:18px;
      padding:14px 16px;
      line-height:1.55;
      border:1px solid transparent;
    }

    .message.error{
      background:#fef2f2;
      color:#991b1b;
      border-color:#fecaca;
    }

    .message.info{
      background:#f8fafc;
      color:#334155;
      border-color:#e2e8f0;
    }

    .loading{
      padding:26px 20px 30px;
      color:var(--muted);
      font-weight:600;
    }

    .hidden{
      display:none !important;
    }

    @media (max-width:860px){
      .meta-strip{
        grid-template-columns:repeat(2, minmax(0,1fr));
      }

      .title-row{
        grid-template-columns:1fr;
      }

      .head-actions{
        justify-content:flex-start;
      }
    }

    @media (max-width:560px){
      .wrap{
        padding:14px 10px 30px;
      }

      .notice-head,
      .notice-body{
        padding-left:14px;
        padding-right:14px;
      }

      .meta-strip{
        grid-template-columns:1fr;
        padding-left:14px;
        padding-right:14px;
      }

      .notice-panel{
        border-radius:18px;
        padding:16px 14px;
      }

      .book-btn,
      .ghost-btn{
        width:100%;
      }

      .foot-actions{
        flex-direction:column;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="crumbs">
        <a href="members-info.html">Members Hub</a>
        <span>›</span>
        <a href="events.html">Events List</a>
        <span>›</span>
        <span>Notice</span>
      </div>
    </div>

    <div class="shell">
      <div id="loadingBlock" class="loading">Loading notice…</div>

      <div id="contentBlock" class="hidden">
        <div class="notice-head">
          <div class="title-row">
            <div class="title-block">
              <div id="titleGraphicWrap" class="title-graphic-wrap">
                <img id="titleGraphic" class="title-graphic" alt="Event title graphic" />
              </div>

              <h1 id="eventTitle">Event Notice</h1>
              <p id="eventSummary" class="summary hidden"></p>
            </div>

            <div class="head-actions">
              <a id="bookBtnTop" class="book-btn" href="event-booking.html">Book or register your interest</a>
            </div>
          </div>
        </div>

        <div class="meta-strip">
          <div class="meta-card">
            <div class="meta-label">When</div>
            <div id="metaWhen" class="meta-value">—</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">Where</div>
            <div id="metaWhere" class="meta-value">—</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">Host</div>
            <div id="metaHost" class="meta-value">—</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">Places</div>
            <div id="metaPlaces" class="meta-value">—</div>
          </div>
        </div>

        <div class="notice-body">
          <div class="notice-panel">
            <div id="inlineImageWrap" class="inline-image-wrap">
              <img id="inlineImage" class="inline-image" alt="Event notice image" />
            </div>

            <div id="bodyCopy" class="body-copy"></div>

            <div class="foot-actions">
              <a id="bookBtnBottom" class="book-btn" href="event-booking.html">Book or register your interest</a>
              <a id="backBtn" class="ghost-btn" href="events.html">Back to Events List</a>
            </div>
          </div>

          <div id="messageArea"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const API_BASE = "https://sanctuary-backend-8iqc.onrender.com";
      const qs = new URLSearchParams(window.location.search);
      const eventId = (qs.get("event_id") || "").trim();

      const els = {
        loadingBlock: document.getElementById("loadingBlock"),
        contentBlock: document.getElementById("contentBlock"),

        eventTitle: document.getElementById("eventTitle"),
        eventSummary: document.getElementById("eventSummary"),

        titleGraphicWrap: document.getElementById("titleGraphicWrap"),
        titleGraphic: document.getElementById("titleGraphic"),

        metaWhen: document.getElementById("metaWhen"),
        metaWhere: document.getElementById("metaWhere"),
        metaHost: document.getElementById("metaHost"),
        metaPlaces: document.getElementById("metaPlaces"),

        inlineImageWrap: document.getElementById("inlineImageWrap"),
        inlineImage: document.getElementById("inlineImage"),

        bodyCopy: document.getElementById("bodyCopy"),
        messageArea: document.getElementById("messageArea"),

        bookBtnTop: document.getElementById("bookBtnTop"),
        bookBtnBottom: document.getElementById("bookBtnBottom"),
        backBtn: document.getElementById("backBtn")
      };

      function escapeHtml(value){
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function firstDefined(){
        for (const v of arguments){
          if (v !== undefined && v !== null && v !== "") return v;
        }
        return "";
      }

      function asNumber(value){
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      }

      function formatDateTime(value){
        if (!value) return "To be confirmed";
        const d = new Date(value);
        if (!Number.isNaN(d.getTime())){
          return d.toLocaleString([], {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          });
        }
        return String(value);
      }

      function nl2p(text){
        const safe = escapeHtml(text || "");
        const parts = safe.split(/\n{2,}/).map(part => part.trim()).filter(Boolean);
        if (!parts.length){
          return '<div class="empty-copy">Further details will appear here.</div>';
        }
        return parts.map(part => `<p>${part.replace(/\n/g, "<br>")}</p>`).join("");
      }

      function showMessage(text, type){
        els.messageArea.innerHTML = `<div class="message ${type || "info"}">${escapeHtml(text)}</div>`;
      }

      function setOptionalImage(imgEl, wrapEl, src){
        const clean = String(src || "").trim();
        if (!clean){
          wrapEl.classList.add("hidden");
          return;
        }

        imgEl.onload = function(){
          wrapEl.classList.remove("hidden");
        };

        imgEl.onerror = function(){
          wrapEl.classList.add("hidden");
        };

        imgEl.src = clean;
      }

      function decideBookingLabel(event){
        const mode = String(firstDefined(
          event.booking_mode,
          event.response_mode,
          event.attendance_mode
        )).toLowerCase();

        if (mode === "interest"){
          return "Register your interest";
        }
        if (mode === "booking"){
          return "Book your place";
        }
        return "Book or register your interest";
      }

      function renderEvent(raw){
        const event = (raw && typeof raw === "object" && raw.event && typeof raw.event === "object")
          ? raw.event
          : (raw || {});

        const title = firstDefined(
          event.title,
          event.event_title,
          event.name,
          "Event Notice"
        );

        const summary = firstDefined(
          event.summary,
          event.short_description,
          event.excerpt,
          event.subtitle
        );

        const body = firstDefined(
          event.notice_body,
          event.notice_text,
          event.description,
          event.details,
          event.body,
          ""
        );

        const titleGraphicUrl = firstDefined(
          event.title_graphic_url,
          event.titleGraphicUrl,
          event.title_image_url,
          event.titleImageUrl,
          event.title_art_url,
          event.titleArtUrl,
          event.notice_title_graphic,
          event.noticeTitleGraphic
        );

        const inlineImageUrl = firstDefined(
          event.notice_image_url,
          event.noticeImageUrl,
          event.image_url,
          event.imageUrl,
          event.poster_image_url,
          event.posterImageUrl,
          event.inline_image_url,
          event.inlineImageUrl
        );

        const whenValue = firstDefined(
          event.start,
          event.start_at,
          event.start_datetime,
          event.start_date,
          event.date
        );

        const whereValue = firstDefined(
          event.location,
          event.venue,
          event.place,
          "To be confirmed"
        );

        const hostValue = firstDefined(
          event.host_name,
          event.organiser_name,
          event.organizer_name,
          event.created_by_name,
          "Sanctuary Club"
        );

        const placesValueRaw = firstDefined(
          event.places_total,
          event.capacity,
          event.max_places,
          event.places
        );

        const placesValue = placesValueRaw === ""
          ? "Not specified"
          : String(placesValueRaw);

        const bookingLabel = decideBookingLabel(event);
        const bookingHref = `event-booking.html?event_id=${encodeURIComponent(eventId)}`;

        document.title = `${title} | Sanctuary Club`;

        els.eventTitle.textContent = title;

        if (summary){
          els.eventSummary.textContent = summary;
          els.eventSummary.classList.remove("hidden");
        } else {
          els.eventSummary.classList.add("hidden");
        }

        els.metaWhen.textContent = formatDateTime(whenValue);
        els.metaWhere.textContent = whereValue;
        els.metaHost.textContent = hostValue;
        els.metaPlaces.textContent = placesValue;

        els.bodyCopy.innerHTML = nl2p(body);

        els.bookBtnTop.textContent = bookingLabel;
        els.bookBtnBottom.textContent = bookingLabel;
        els.bookBtnTop.href = bookingHref;
        els.bookBtnBottom.href = bookingHref;

        setOptionalImage(els.titleGraphic, els.titleGraphicWrap, titleGraphicUrl);
        setOptionalImage(els.inlineImage, els.inlineImageWrap, inlineImageUrl);

        els.loadingBlock.classList.add("hidden");
        els.contentBlock.classList.remove("hidden");
      }

      async function fetchEvent(){
        if (!eventId){
          els.loadingBlock.classList.add("hidden");
          showMessage("No event_id was supplied in the page link.", "error");
          return;
        }

        try{
          const res = await fetch(`${API_BASE}/api/events/${encodeURIComponent(eventId)}`, {
            method: "GET",
            headers: { "Accept": "application/json" }
          });

          let data = null;
          try{
            data = await res.json();
          }catch(_err){
            data = null;
          }

          if (!res.ok){
            const msg = data && (data.message || data.error)
              ? data.message || data.error
              : `Unable to load notice (${res.status}).`;
            throw new Error(msg);
          }

          renderEvent(data || {});
        }catch(err){
          els.loadingBlock.classList.add("hidden");
          showMessage(err && err.message ? err.message : "Unable to load notice.", "error");
        }
      }

      fetchEvent();
    })();
  </script>
</body>
</html>
