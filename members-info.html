<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member Information — The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css?v=MI_LAYOUT_2" />

  <style>
    body {
      background: linear-gradient(180deg, #e9f1fb, #f6f9fc);
      margin: 0;
    }

    /* ---- TOP NAV LAYOUT ---- */
    .top-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 1rem 1.25rem;
    }

    .top-nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    .nav-left {
      justify-self: start;
    }

    .nav-centre {
      justify-self: center;
    }

    .nav-right {
      justify-self: end;
    }

    /* ---- PAGE CONTENT ---- */
    .mi-wrapper {
      max-width: 720px;
      margin: 3.5rem auto 4rem;
      padding: 0 1rem;
    }

    h1 {
      margin-bottom: 0.4rem;
      color: #003366;
    }

    .intro {
      margin-bottom: 1.8rem;
      color: #445;
    }

    .mi-list {
      display: grid;
      gap: 1.1rem;
    }

    .mi-item {
      display: block;
      padding: 1.25rem 1.4rem;
      background: #ffffff;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .mi-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .mi-item h3 {
      margin: 0 0 0.35rem 0;
      color: #003366;
    }

    .mi-item p {
      margin: 0;
      font-size: 0.95rem;
      color: #556;
    }

    .mi-item.disabled {
      opacity: 0.55;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- TOP NAV -->
  <nav class="top-nav">
    <a href="index.html" class="nav-left">Home</a>
    <a href="events-calendar.html" class="nav-centre">Calendar</a>
    <a href="#" id="logout-link" class="nav-right">Logout</a>
  </nav>

  <main class="mi-wrapper">

    <h1>Member Information</h1>

    <p class="intro">
      Access member resources, update your details, or browse the directory.
    </p>

    <div class="mi-list">

      <!-- YOUR INFORMATION -->
      <a href="your-info.html" class="mi-item">
        <h3>Your Information</h3>
        <p>Update household members and contact preferences.</p>
      </a>

      <!-- MEMBERS DIRECTORY -->
      <a href="members-directory.html" class="mi-item">
        <h3>Members Directory</h3>
        <p>View contact details shared by residents.</p>
      </a>

      <!-- FUTURE ITEMS -->
      <div class="mi-item disabled">
        <h3>Host</h3>
        <p>Coming soon.</p>
      </div>

      <div class="mi-item disabled">
        <h3>Payments</h3>
        <p>Coming soon.</p>
      </div>

    </div>

  </main>

  <script src="logout.js"></script>

</body>
</html>
