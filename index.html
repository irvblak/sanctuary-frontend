<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css?v=1018" />
</head>

<body>

<div class="hero-wrapper">

  <!-- LEFT PANEL -->
  <div class="hero-panel hero-panel-left">
    <h3>Welcome to The Sanctuary Club</h3>
    <p>
      A residents’ club for Sanctuary Mews and Sanctuary Court.
    </p>
  </div>

  <!-- HERO (CENTRE) -->
  <section class="hero">
    <div class="hero-overlay">

      <h1 class="hero-title">The Sanctuary Club</h1>

      <!-- MAIN BUTTONS -->
      <div class="hero-buttons">
        <button id="btn-whats-on" class="hero-button">What’s On</button>
        <button id="btn-info" class="hero-button">Info</button>
      </div>

      <!-- ACCESS GATE (hidden until button click) -->
      <div id="access-gate" class="access-gate-inline" style="display:none; margin-top:1.5rem; text-align:center;">

        <div class="access-input-wrapper" style="display:inline-flex; align-items:center;">
          <input
            type="password"
            id="access-code-input"
            placeholder="Access code"
            autocomplete="off"
          />
          <button
            type="button"
            class="toggle-visibility"
            aria-label="Show access code"
          >👁</button>
        </div>

        <div style="margin-top:0.75rem;">
          <button id="access-submit" class="hero-button">
            Continue
          </button>
        </div>

        <div id="access-error" class="access-error" style="display:none; margin-top:0.5rem;">
          Invalid access code
        </div>

      </div>

      <footer class="site-footer">
        <p>© The Sanctuary Club. All rights reserved.</p>
      </footer>

    </div>
  </section>

  <!-- RIGHT PANEL -->
  <div class="hero-panel hero-panel-right">
    <p>
      <strong><em>
        See what’s on, join activities, and optionally share contact details
        so neighbours can reach you — or so you can reach them.
      </em></strong>
    </p>
  </div>

</div> <!-- end hero-wrapper -->

<script src="script.js?v=1018"></script>

</body>
</html>
