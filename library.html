<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>The Library | Sanctuary Club</title>
  <script src="access.js?v=LIB_3"></script>
  <style>
    :root{--ink:#203747;--muted:#5c7080;--blue:#123a78;--blue2:#0f3166;--line:#d5e1eb;--soft:#f5f9fc;--learn:#eef8f1;--learn-line:#bedbc7;--warm:#fff8e8;--shadow:0 8px 24px rgba(0,0,0,.08)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#d9ecff,#f5f9fc 46%,#fff);color:var(--ink);font:500 19px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}a,button{font:inherit}
    .topbar{max-width:1180px;margin:auto;padding:1.15rem 1rem .45rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}.brand{color:var(--blue);font-size:2rem;font-weight:850}.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.5rem}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.58rem .88rem;border:1px solid var(--line);border-radius:13px 13px 0 0;background:#fff;color:var(--blue);font-weight:800;text-decoration:none}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:hover,.btn:focus-visible{background:var(--blue2);border-color:var(--blue2);color:#fff}
    .shell{max-width:1180px;margin:auto;padding:0 1rem 2.5rem}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:1.35rem;box-shadow:var(--shadow)}.intro{text-align:center;max-width:860px;margin:0 auto 1.25rem}.intro h1{margin:.15rem 0;color:var(--blue);font-size:1.7rem}.intro p{margin:.35rem 0;color:var(--muted)}
    .school{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;margin:0 0 1.35rem;padding:1rem 1.1rem;border:2px solid var(--learn-line);border-radius:18px;background:var(--learn)}.school-icon{font-size:2.1rem}.school h2{margin:0;color:#245b3a;font-size:1.22rem}.school p{margin:.15rem 0 0;color:#466353;font-size:.9rem}.school-link{display:inline-flex;padding:.6rem .85rem;border-radius:11px;background:#286740;color:#fff;text-decoration:none;font-weight:800}.school-link:hover,.school-link:focus-visible{background:#1f5233}
    .route{margin:0 0 1.25rem;padding:.78rem 1rem;border:1px solid #d4e2ef;border-radius:14px;background:#f7fbff;text-align:center;color:#415567;font-size:.9rem}.route strong{color:var(--blue)}
    .heading{margin:1.15rem 0 .7rem;color:var(--blue);font-size:1.18rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;align-items:start}
    details.department{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 5px 16px rgba(0,0,0,.055)}details.department[open]{box-shadow:0 8px 22px rgba(18,58,120,.11)}summary.department-head{display:flex;align-items:center;gap:.8rem;min-height:78px;padding:.9rem 1rem;background:var(--blue);color:#fff;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary.department-head:hover,summary.department-head:focus-visible{background:var(--blue2)}.icon{width:2rem;text-align:center;font-size:1.6rem}.title{flex:1}.title strong{display:block;font-size:1.12rem;line-height:1.2}.title small{display:block;margin-top:.18rem;color:#e9f2ff;font-size:.8rem;font-weight:650}.arrow{font-size:1.2rem;font-weight:900;transition:transform .18s}details[open]>.department-head .arrow{transform:rotate(90deg)}
    .body{padding:.9rem;background:var(--soft)}.body>p{margin:0 0 .7rem;color:var(--muted);font-size:.87rem}.synopsis-groups{display:grid;gap:.65rem}.synopsis-group{border:1px solid #ceddea;border-radius:13px;background:#fff;overflow:hidden}.synopsis-group summary{padding:.7rem .8rem;color:var(--blue);font-weight:850;cursor:pointer;list-style:none}.synopsis-group summary::after{content:" +";float:right}.synopsis-group[open] summary::after{content:" −"}.synopsis-list{display:grid;gap:.5rem;padding:0 .75rem .75rem}.synopsis{display:block;padding:.65rem .7rem;border:1px solid #d5e1eb;border-radius:10px;background:#fafcff;color:var(--ink);text-decoration:none}.synopsis:hover,.synopsis:focus-visible{border-color:var(--blue);background:#f2f7ff}.synopsis strong{display:block;color:var(--blue)}.synopsis small{display:block;margin-top:.18rem;color:var(--muted);font-size:.78rem}.empty-list{padding:.6rem .7rem;border:1px dashed #b8cadd;border-radius:10px;color:var(--muted);font-size:.82rem}
    .live-links{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.65rem}.live-links a{padding:.38rem .58rem;border:1px solid #c9d9e7;border-radius:9px;background:#fff;color:var(--blue);text-decoration:none;font-weight:800}.live-links a:hover,.live-links a:focus-visible{background:#edf5ff}.protected{display:inline-block;margin-top:.4rem;padding:.18rem .45rem;border-radius:999px;background:var(--warm);color:#6e5920;font-size:.75rem;font-weight:800}
    .school-note{margin-top:1.25rem;padding:.9rem 1rem;border:1px solid var(--learn-line);border-radius:15px;background:var(--learn);color:#405b49;font-size:.88rem}.footer{margin-top:1rem;text-align:center;color:var(--muted);font-size:.84rem}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.school{grid-template-columns:auto 1fr}.school-link{grid-column:1/-1;text-align:center}}
    @media(max-width:620px){body{font-size:18px}.topbar{display:block;padding:.8rem}.actions{justify-content:flex-start;margin-top:.65rem}.brand{font-size:1.65rem}.shell{padding:0 .7rem 1.5rem}.panel{padding:.85rem}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">The Library</div>
    <nav class="actions" aria-label="Main links">
      <a class="btn" href="events-calendar.html">Calendar</a><a class="btn" href="events.html">Events List</a><a class="btn" href="role-holders.html">Role Register</a><a class="btn primary" href="members-info.html">Members Hub</a>
    </nav>
  </header>
  <div class="shell"><main class="panel">
    <section class="intro"><h1>Library Sections</h1><p>Choose a Section. Where a Section has sub-categories, choose one to see its synopsis list.</p></section>
    <section class="school" aria-labelledby="schoolTitle"><div class="school-icon">🎓</div><div><h2 id="schoolTitle">School</h2><p>Guides, lessons and manuals for teaching and learning.</p></div><a class="school-link" href="#school-section">Open School</a></section>
    <h2 class="heading">Sections</h2>
    <div class="grid" id="departments"></div>
    <p class="footer" id="libraryStatus">Loading published work…</p>
  </main></div>
  <script>
  (()=>{
    const API_BASE="https://sanctuary-backend-8iqc.onrender.com";
    const departments=[
      {key:"event-hosts",icon:"🎪",title:"Event Host",sub:"Event knowledge and retained event material",links:[["Event Host Role Guide","role-guide.html?role=event-host"]]},
      {key:"club-activities",icon:"🌱",title:"Club Activities",sub:"Material from each activity and its Organisers",links:[["Activity Organiser Role Guide","role-guide.html?role=activity-organiser"]]},
      {key:"club-news-information",icon:"📰",title:"Club News & Information",sub:"Authorised Club information worth retaining",links:[["Club News","club-news.html"]]},
      {key:"residents-association",icon:"👥",title:"Residents Association",sub:"Association information and standing documents",links:[["Panel Role Guide","role-guide.html?role=residents-association-panel"]]},
      {key:"services",icon:"🤝",title:"Services",sub:"Material from authorised Service Role Holders",links:[["Services Role Guide","role-guide.html?role=services"]]},
      {key:"website-help",icon:"🌿",title:"Website Help",sub:"Help with using and maintaining Sanctuary Club",links:[["Website Helper Guide","role-guide.html?role=website-helper"],["Privacy & Security","privacy-charter.html"]]},
      {key:"articles-stories",icon:"✍️",title:"Articles & Stories",sub:"Writing by members",links:[["Writer Role Guide","role-guide.html?role=writer"]]},
      {key:"gallery",icon:"🎨",title:"Gallery",sub:"Original and AI-assisted visual work",links:[["Members’ Art","library-gallery.html"],["Artist Role Guide","role-guide.html?role=artist"]]},
      {key:"general-useful-information",icon:"💡",title:"General & Useful Information",sub:"Practical material that does not belong elsewhere",links:[["Privacy & Security","privacy-charter.html"]]},
      {key:"school",icon:"🎓",title:"School",sub:"Guides, lessons and manuals",links:[]}
    ];
    const esc=s=>String(s).replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"}[c]));
    const slug=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    const sectionAliases={
      "notices-news":"club-news-information",
      "useful-information":"general-useful-information",
      "members-articles-stories":"articles-stories",
      "guides-help":"website-help",
      "writers":"articles-stories",
      "artists":"gallery",
      "committee":"club-news-information",
      "club-publications":"club-news-information",
      "information-officer":"club-news-information",
      "general-useful-information":"general-useful-information",
      "website-helpers":"website-help",
      "administration":"website-help",
      "editorial":"website-help",
      "condominium":"general-useful-information"
    };
    const canvasMeta=p=>(p&&p.canvas_data&&typeof p.canvas_data==="object")?p.canvas_data:{};
    const sectionFor=p=>{const m=canvasMeta(p),raw=slug(m.section||m.department||p.section||p.category||"");return sectionAliases[raw]||raw||"general-useful-information"};
    const subcategoryFor=p=>String(p.subcategory_name||p.tertiary_category||canvasMeta(p).subcategory_name||canvasMeta(p).tertiary_category||"").trim();
    const itemHtml=p=>{const when=p.published_at?new Date(p.published_at).toLocaleDateString("en-GB"):"";const who=[p.creator_name,p.creator_resident_id].filter(Boolean).join(" · ");return `<a class="synopsis" href="library-publications.html?id=${encodeURIComponent(p.publication_id||"")}"><strong>${esc(p.title||"Untitled")}</strong>${p.summary?`<span>${esc(p.summary)}</span>`:""}<small>${esc([who,when].filter(Boolean).join(" · "))}</small></a>`};
    const groupHtml=(name,items,open)=>`<details class="synopsis-group"${open?" open":""}><summary>${esc(name)}</summary><div class="synopsis-list">${items.length?items.map(itemHtml).join(""):'<div class="empty-list">No published work yet.</div>'}</div></details>`;
    function render(items){document.getElementById("departments").innerHTML=departments.map(d=>{const sectionItems=items.filter(p=>sectionFor(p)===d.key),groups=new Map();sectionItems.forEach(p=>{const name=subcategoryFor(p)||"Published work";if(!groups.has(name))groups.set(name,[]);groups.get(name).push(p)});const contents=groups.size?[...groups.entries()].map(([name,list],i)=>groupHtml(name,list,groups.size===1&&i===0)).join(""):groupHtml("Published work",[],true);return `<details class="department" id="${d.key==="school"?"school-section":"section-"+esc(d.key)}"><summary class="department-head"><span class="icon">${d.icon}</span><span class="title"><strong>${esc(d.title)}</strong><small>${esc(d.sub)}</small></span><span class="arrow">›</span></summary><div class="body"><div class="synopsis-groups">${contents}</div><div class="live-links">${d.links.map(([label,url])=>`<a href="${url}">${esc(label)}</a>`).join("")}</div></div></details>`}).join("");document.querySelectorAll("details.department").forEach(branch=>branch.addEventListener("toggle",()=>{if(branch.open)document.querySelectorAll("details.department").forEach(other=>{if(other!==branch)other.open=false})}));}
    render([]);
    fetch(`${API_BASE}/api/library-publications`,{headers:{Accept:"application/json"},cache:"no-store"}).then(r=>r.json().then(data=>({ok:r.ok,data}))).then(({ok,data})=>{if(!ok||data?.success===false)throw new Error(data?.message||"Library unavailable");const items=Array.isArray(data.publications)?data.publications:[];render(items);document.getElementById("libraryStatus").textContent=items.length?`${items.length} published item${items.length===1?"":"s"}.`:"No work has been published yet."}).catch(err=>{console.error(err);document.getElementById("libraryStatus").textContent="Published work could not be loaded. Please try again shortly."});
    if(location.hash==="#school-section"){const school=document.getElementById("school-section");if(school){school.open=true;school.scrollIntoView({block:"start"})}}
  })();
  </script>
</body>
</html>
