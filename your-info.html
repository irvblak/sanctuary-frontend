<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Your Information</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
}

nav {
  padding: 1rem 1.25rem;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
}

nav a {
  text-decoration: none;
  font-weight: 500;
  color: #005ea8;
}

main {
  max-width: 900px;
  margin: 0 auto 2rem;
  background: #fff;
  border-radius: 12px;
  padding: 1.5rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

h1 { margin-top: 0; }

.intro-text {
  margin-bottom: 1rem;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 0.4rem;
  font-size: 0.9rem;
}

th {
  text-align: left;
  font-weight: 600;
}

input {
  width: 100%;
  font-size: 0.9rem;
  padding: 0.3rem;
}

button {
  margin-top: 1rem;
  padding: 0.6rem 1.2rem;
  font-size: 1rem;
  cursor: pointer;
}

.saved {
  margin-top: 0.75rem;
  color: #2a6f2a;
  display: none;
}

@media (max-width: 640px) {
  th, td { font-size: 0.85rem; }
  input { font-size: 16px; }
}
</style>
</head>

<body>

<nav>
  <div><a href="index.html">Home</a></div>
  <div>
    <a href="calendar.html">Calendar</a> ·
    <a href="members-directory.html">Members</a>
  </div>
  <div style="text-align:right;"><a href="logout.html">Logout</a></div>
</nav>

<main>
<h1>Your Information</h1>

<div class="intro-text">
  Enter as much information as you wish to share.
  <br>(You can change it at any time.)
</div>

<form id="infoForm">
<table>
  <thead>
    <tr>
      <th>Resident</th>
      <th>Name</th>
      <th>Email</th>
      <th>Mobile</th>
      <th>Landline</th>
    </tr>
  </thead>
  <tbody>
    ${[1,2,3,4].map(i => `
    <tr>
      <td>${i}</td>
      <td><input data-field="name" data-idx="${i-1}"></td>
      <td><input data-field="email" data-idx="${i-1}"></td>
      <td><input data-field="mobile" data-idx="${i-1}"></td>
      <td><input data-field="landline" data-idx="${i-1}"></td>
    </tr>`).join("")}
  </tbody>
</table>

<button type="submit">Save</button>
<div class="saved" id="savedMsg">Saved.</div>
</form>
</main>

<script>
const STORAGE_KEY = "sanctuaryMembers";
const memberId = sessionStorage.getItem("memberId"); // ⚠️ adjust if named differently

if (!memberId) {
  alert("Member ID not found.");
}

function load() {
  const members = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  const residents = (members[memberId]?.residents) || [];

  document.querySelectorAll("input").forEach(inp => {
    const i = inp.dataset.idx;
    const f = inp.dataset.field;
    inp.value = residents[i]?.[f] || "";
  });
}

document.getElementById("infoForm").onsubmit = e => {
  e.preventDefault();

  const members = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  const residents = [];

  for (let i=0;i<4;i++) {
    const res = {};
    ["name","email","mobile","landline"].forEach(f => {
      const v = document.querySelector(`input[data-field="${f}"][data-idx="${i}"]`).value.trim();
      if (v) res[f] = v;
    });
    if (Object.keys(res).length) residents.push(res);
  }

  members[memberId] = { residents };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(members));

  document.getElementById("savedMsg").style.display = "block";
  setTimeout(()=>savedMsg.style.display="none",2000);
};

load();
</script>

</body>
</html>
