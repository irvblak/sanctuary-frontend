<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <!-- Gate-check: requires Admin Sign-in (memberId + PIN) first -->
  <script>
    (function(){
      const ok = sessionStorage.getItem("adminPrecheckOk") === "1";
      const t  = Number(sessionStorage.getItem("adminPrecheckTime") || "0");
      const ttlMs = 30 * 60 * 1000; // 30 minutes (must match admin-signin)
      if (!ok || !t || (Date.now() - t) > ttlMs){
        location.replace("admin-signin.html");
      }
    })();
  </script>

  <link rel="stylesheet" href="styles-main.css?v=ADMIN_LOGIN_2" />

  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: linear-gradient(180deg,#e8f2ff 0%, #f2f7fb 45%, #ffffff 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
      color:#1f2a37;
    }
    .card{
      width:min(520px, 100%);
      background:#fff;
      border-radius:18px;
      box-shadow:0 10px 26px rgba(0,0,0,0.08);
      border:1px solid rgba(219,230,243,0.85);
      padding:18px 18px 16px;
    }
    h1{ margin:0 0 6px; color:#003366; font-size:1.35rem; }
    p{ margin:0 0 14px; color:#667085; line-height:1.45; }

    label{
      display:block;
      font-weight:800;
      font-size:.9rem;
      color:#425466;
      margin:0 0 6px;
    }
    input{
      width:100%;
      padding:.62rem .72rem;
      border-radius:12px;
      border:1px solid #cfd8e3;
      font-size:1rem;
      box-sizing:border-box;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .field{ flex:1; min-width:220px; }

    button{
      width:100%;
      margin-top:14px;
      padding:.75rem .9rem;
      border:0;
      border-radius:12px;
      background:#005ea8;
      color:#fff;
      font-weight:900;
      font-size:1rem;
      cursor:pointer;
    }
    button:disabled{ opacity:.55; cursor:not-allowed; }

    .msg{
      display:none;
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      white-space:pre-wrap;
    }
    .warn{ background:#fff5f5; border:1px solid #f2b8b8; color:#7a0000; }
    .ok{ background:#f2fbf4; border:1px solid #bfe5c6; color:#145a2c; }

    .footer{
      margin-top:14px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      font-size:.95rem;
      color:#667085;
      align-items:center;
    }
    .footer a{
      color:#003366;
      text-decoration:none;
      font-weight:900;
      white-space:nowrap;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Admin Login</h1>
    <p>Enter your admin username and password.</p>

    <div class="row">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" />
      </div>
    </div>

    <div class="row" style="margin-top:10px;">
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
    </div>

    <button id="loginBtn" type="button" disabled>Sign in</button>

    <div id="warn" class="msg warn"></div>
    <div id="ok" class="msg ok"></div>

    <div class="footer">
      <a href="admin-signin.html">← Back</a>
      <span>Sanctuary Club</span>
    </div>
  </div>

<script>
  const API_BASE = "https://sanctuary-backend-8iqc.onrender.com";
  const TOKEN_KEY = "adminToken";

  const usernameEl = document.getElementById("username");
  const passwordEl = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const warnEl = document.getElementById("warn");
  const okEl = document.getElementById("ok");

  function show(el, msg){
    el.style.display = "block";
    el.textContent = msg;
  }
  function clear(el){
    el.style.display = "none";
    el.textContent = "";
  }

  function updateEnabled(){
    const u = (usernameEl.value || "").trim();
    const p = (passwordEl.value || "").trim();
    loginBtn.disabled = !(u && p);
  }

  async function adminLogin(){
    clear(warnEl); clear(okEl);

    const username = (usernameEl.value || "").trim();
    const password = (passwordEl.value || "").trim();

    loginBtn.disabled = true;

    try{
      const res = await fetch(API_BASE + "/auth/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      let body = null;
      try { body = await res.json(); } catch {}

      if (!res.ok || !body || body.success !== true || !body.token){
        const msg = body && (body.message || body.error)
          ? (body.message || body.error)
          : `Login failed (HTTP ${res.status})`;
        throw new Error(msg);
      }

      localStorage.setItem(TOKEN_KEY, body.token);

      show(okEl, "Signed in. Redirecting…");
      setTimeout(() => { location.href = "admin-dashboard.html"; }, 250);

    } catch(e){
      show(warnEl, String(e.message || e));
      loginBtn.disabled = false;
    }
  }

  usernameEl.addEventListener("input", updateEnabled);
  passwordEl.addEventListener("input", updateEnabled);
  passwordEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !loginBtn.disabled) adminLogin();
  });
  loginBtn.addEventListener("click", adminLogin);

  updateEnabled();
</script>
</body>
</html>
