<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Your Information</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
/* TEMP DIAGNOSTIC SAFETY NET */
if (!sessionStorage.getItem("memberId")) {
  sessionStorage.setItem("memberId", "SM55");

<!-- Session gate -->
<script src="access.js"></script>

<!-- Logout handler -->
<script src="logout.js"></script>






<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
  color: #222;
}

/* ---------- NAV ---------- */
nav {
  padding: 1rem 1.25rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav a {
  text-decoration: none;
  font-weight: 500;
  color: #005ea8;
  margin: 0 0.5rem;
}

/* ---------- MAIN ---------- */
main {
  max-width: 900px;
  margin: 0 auto 2rem;
  padding: 1rem;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

h1 {
  margin-top: 0;
}

.intro {
  margin-bottom: 1rem;
  color: #444;
}

/* ---------- TABLE ---------- */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 0.4rem;
  text-align: left;
}

th {
  font-size: 0.85rem;
  color: #555;
}

input {
  width: 100%;
  padding: 0.4rem;
  font-size: 0.9rem;
}

button {
  margin-top: 1rem;
  padding: 0.6rem 1.25rem;
  font-size: 1rem;
  cursor: pointer;
}

#savedMsg {
  margin-top: 0.75rem;
  color: #2a6f2a;
  display: none;
}

@media (max-width: 640px) {
  th, td { font-size: 0.85rem; }
  input { font-size: 16px; }
}
</style>
</head>

<body>

<nav>
  <div>
    <a href="index.html">Home</a> ·
    <a href="members-directory.html">Members</a>
  </div>
  <div>
    <span>Your Information</span> ·
    <a href="#" onclick="logout(); return false;">Logout</a>
  </div>
</nav>

<main>

<h1>Your Information</h1>

<p class="intro">
Enter any details you wish to share.  
Only households with data appear in the Members Directory.
</p>

<form id="infoForm">

<table>
<thead>
<tr>
  <th>Resident</th>
  <th>Name</th>
  <th>Email</th>
  <th>Mobile</th>
  <th>Landline</th>
</tr>
</thead>
<tbody>
<!-- Fixed 4-resident grid -->
<tr>
  <td>1</td>
  <td><input data-i="0" data-f="name"></td>
  <td><input data-i="0" data-f="email"></td>
  <td><input data-i="0" data-f="mobile"></td>
  <td><input data-i="0" data-f="landline"></td>
</tr>
<tr>
  <td>2</td>
  <td><input data-i="1" data-f="name"></td>
  <td><input data-i="1" data-f="email"></td>
  <td><input data-i="1" data-f="mobile"></td>
  <td></td>
</tr>
<tr>
  <td>3</td>
  <td><input data-i="2" data-f="name"></td>
  <td><input data-i="2" data-f="email"></td>
  <td><input data-i="2" data-f="mobile"></td>
  <td></td>
</tr>
<tr>
  <td>4</td>
  <td><input data-i="3" data-f="name"></td>
  <td><input data-i="3" data-f="email"></td>
  <td><input data-i="3" data-f="mobile"></td>
  <td></td>
</tr>
</tbody>
</table>

<button type="submit">Save information</button>
<div id="savedMsg">Saved ✔</div>

</form>

</main>

<script>
const STORAGE_KEY = "sanctuaryMembers";
const memberId = sessionStorage.getItem("memberId");

if (!memberId) {
  window.location.href = "index.html";
}

// ---- Load existing data
(function loadData() {
  const members = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  const residents = members[memberId]?.residents || [];

  document.querySelectorAll("input[data-i]").forEach(inp => {
    const i = inp.dataset.i;
    const f = inp.dataset.f;
    inp.value = residents[i]?.[f] || "";
  });
})();

// ---- Save
document.getElementById("infoForm").addEventListener("submit", e => {
  e.preventDefault();

  const members = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  const residents = [{},{},{},{}];

  document.querySelectorAll("input[data-i]").forEach(inp => {
    const i = inp.dataset.i;
    const f = inp.dataset.f;
    const v = inp.value.trim();
    if (v) residents[i][f] = v;
  });

  members[memberId] = { residents };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(members));

  const msg = document.getElementById("savedMsg");
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 2000);
});
</script>

</body>
</html>
