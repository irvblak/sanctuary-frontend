<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css?v=HOME_V6" />

  <style>
    #access-gate {
      display: none;
      margin-top: 1rem;
    }

    .hero-button {
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="hero-wrapper">

  <!-- LEFT PANEL -->
  <div class="hero-panel">
    <h3>Welcome to your club</h3>
    <p>
      <em>
        The Sanctuary Club is a residents’ club for
        Sanctuary Mews and Sanctuary Court.
      </em>
    </p>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-overlay">

      <h1 class="hero-title" style="margin-top:0.5rem;">
        The Sanctuary Club
      </h1>

      <div class="action-stack">

        <!-- ACCESS GATE -->
        <div id="access-gate">
          <div class="access-input-wrapper">
            <input
              type="password"
              id="access-code-input"
              placeholder="Access code"
              autocomplete="off"
            />
            <button type="button" id="access-eye">👁</button>
          </div>

          <button id="access-submit" class="hero-button">
            Continue
          </button>
        </div>

        <!-- BUTTONS -->
        <div class="hero-buttons">
          <button class="hero-button" data-target="events.html">
            What’s On
          </button>

          <button class="hero-button" data-target="your-info.html">
  Info
</button>

            
        </div>

      </div>

      <footer class="site-footer">
        <p>© The Sanctuary Club. All rights reserved.</p>
      </footer>

    </div>
  </section>

  <!-- RIGHT PANEL -->
  <div class="hero-panel" style="position:relative;">

    <a
      href="#"
      id="logout-link"
      style="
        position:absolute;
        top:0;
        right:0;
        font-size:0.85rem;
        text-decoration:underline;
        cursor:pointer;
        display:none;
      "
    >
      Logout
    </a>

    <p>
      <strong><em>
        For residents only.
        Access to events, information and the members’ directory.
      </em></strong>
    </p>

  </div>

</div>

<script>
  const ACCESS_KEY = "sanctuaryAccess";
  const TIME_KEY = "sanctuaryAccessTime";
  const SESSION_DURATION = 60 * 60 * 1000;

  const gate = document.getElementById("access-gate");
  const logoutLink = document.getElementById("logout-link");
  let pendingTarget = null;

  function hasValidSession() {
    const granted = sessionStorage.getItem(ACCESS_KEY) === "granted";
    const time = Number(sessionStorage.getItem(TIME_KEY));
    return granted && Date.now() - time < SESSION_DURATION;
  }

  document.querySelectorAll(".hero-button[data-target]").forEach(btn => {
    btn.onclick = () => {
      if (hasValidSession()) {
        location.href = btn.dataset.target;
      } else {
        pendingTarget = btn.dataset.target;
        gate.style.display = "block";
      }
    };
  });

  document.getElementById("access-submit").onclick = () => {
    const val = document.getElementById("access-code-input").value.trim();
    if (!val || !pendingTarget) return;

    sessionStorage.setItem(ACCESS_KEY, "granted");
    sessionStorage.setItem(TIME_KEY, Date.now());

    location.href = pendingTarget;
  };

  document.getElementById("access-eye").onclick = () => {
    const input = document.getElementById("access-code-input");
    input.type = input.type === "password" ? "text" : "password";
  };

  logoutLink.onclick = e => {
    e.preventDefault();
    sessionStorage.clear();
    gate.style.display = "none";
    logoutLink.style.display = "none";
  };

  // INIT
  if (hasValidSession()) {
    logoutLink.style.display = "inline";
  }
</script>

</body>
</html>
