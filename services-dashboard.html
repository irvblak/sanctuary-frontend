<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Service Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <link rel="stylesheet" href="styles-main.css?v=SERVICE_DASH_1" />

  <style>
    :root{
      --brand:#005ea8;
      --muted:#6b7280;
      --border: rgba(0,0,0,.08);
      --shadow: 0 12px 30px rgba(0,0,0,.10);
      --radius: 18px;
    }
    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
      color:#1f2a37;
    }

    nav{
      padding: 1rem 1.25rem;
      max-width: 1100px;
      margin: 0 auto;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      gap:.75rem;
      align-items:center;
    }
    .brand{ font-weight:800; color: var(--brand); text-align:center; }
    .left, .right{ display:flex; gap:.5rem; align-items:center; }
    .right{ justify-content:flex-end; }

    a.btn, button.btn{
      appearance:none;
      border:1px solid var(--border);
      background:#fff;
      color: var(--brand);
      padding: .55rem .85rem;
      border-radius: 999px;
      text-decoration:none;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.06);
    }
    button.btn.primary{
      background: var(--brand);
      color:#fff;
      border-color: transparent;
    }

    main{
      max-width:1100px;
      margin:0 auto;
      padding: 0 1.25rem 2.5rem;
    }

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      margin-top: 1rem;
    }

    h1{ margin:0; font-size:1.5rem; }
    .sub{ margin:.25rem 0 0; color: var(--muted); }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }
    @media (min-width: 900px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }

    label{ display:block; margin-top:.75rem; font-weight:700; }
    input, textarea, select{
      width:100%;
      box-sizing:border-box;
      margin-top:.35rem;
      padding:.65rem .75rem;
      border-radius: 12px;
      border:1px solid rgba(0,0,0,.14);
      font-size: 1rem;
      font-family: inherit;
    }
    textarea{ min-height: 90px; resize: vertical; }

    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:.8rem;
    }
    @media (max-width: 650px){
      .row2{ grid-template-columns: 1fr; }
    }

    .msg{
      margin-top:.85rem;
      padding:.75rem .85rem;
      border-radius: 14px;
      background: #f0f7ff;
      border: 1px solid rgba(0,94,168,.20);
      color:#0b3a66;
      display:none;
    }
    .err{
      background:#fff7ed;
      border-color: rgba(234,88,12,.25);
      color:#9a3412;
    }

    .list{
      margin: .75rem 0 0;
      padding:0;
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:.65rem;
    }
    .item{
      border:1px solid var(--border);
      border-radius: 14px;
      padding: .75rem .85rem;
      background:#fff;
    }
    .itemTop{
      display:flex;
      justify-content:space-between;
      gap:.75rem;
      align-items:flex-start;
    }
    .title{ font-weight:800; margin:0; }
    .meta{ margin:.25rem 0 0; color: var(--muted); line-height:1.35; }
    .pill{
      display:inline-block;
      padding:.22rem .55rem;
      border-radius:999px;
      border:1px solid var(--border);
      color: var(--muted);
      font-size:.82rem;
      white-space:nowrap;
      background: rgba(0,0,0,.02);
    }
    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:.5rem;
      margin-top:.65rem;
    }
    .danger{
      color:#b91c1c;
      border-color: rgba(185,28,28,.25) !important;
      background:#fff !important;
    }
  </style>
</head>
<body>
  <nav>
    <div class="left">
      <a class="btn" href="index.html">Home</a>
    </div>
    <div class="brand">Service Dashboard</div>
    <div class="right">
      <button class="btn" id="refreshBtn">Refresh</button>
      <button class="btn primary" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <main>
    <div class="card">
      <h1 id="hello">Welcome</h1>
      <p class="sub" id="who">You can publish and manage your own listings.</p>
      <div class="msg" id="msg"></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2 style="margin:0 0 .5rem;">Create / Update listing</h2>
        <p class="sub" style="margin-top:0;">These are “turn up” activities/visits (no sign-up, no payments).</p>

        <form id="itemForm">
          <label for="kind">Type</label>
          <select id="kind" required>
            <option value="activity">Club Activity (recurring or scheduled)</option>
            <option value="visit">Visitor / Service visit</option>
            <option value="advisory">Advisory (rare)</option>
          </select>

          <label for="title">Title</label>
          <input id="title" placeholder="e.g. Table Tennis in Clubhouse" required />

          <div class="row2">
            <div>
              <label for="date">Date</label>
              <input id="date" type="date" required />
            </div>
            <div>
              <label for="time">Time</label>
              <input id="time" type="time" required />
            </div>
          </div>

          <label for="location">Location</label>
          <input id="location" placeholder="e.g. Clubhouse" />

          <label for="summary">Short description (for Calendar/EV)</label>
          <textarea id="summary" placeholder="One or two lines is ideal."></textarea>

          <label for="noticeUrl">Optional: Link to poster/notice page (URL)</label>
          <input id="noticeUrl" placeholder="https://..." />

          <div class="actions">
            <button class="btn primary" type="submit">Publish</button>
            <button class="btn" type="button" id="clearFormBtn">Clear</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2 style="margin:0 0 .5rem;">My published listings</h2>
        <p class="sub" style="margin-top:0;" id="listHint">Only items owned by your ID are shown here.</p>

        <ul class="list" id="list">
          <li class="item">
            <p class="title">Loading…</p>
            <p class="meta">Fetching your listings.</p>
          </li>
        </ul>
      </div>
    </div>
  </main>

  <script src="service.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const list = document.getElementById("list");

    function showMessage(text, isError=false){
      msg.textContent = text;
      msg.style.display = "block";
      msg.classList.toggle("err", isError);
      setTimeout(() => { msg.style.display = "none"; }, 5000);
    }

    function esc(s){
      return String(s || "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function render(items){
      list.innerHTML = "";
      if (!Array.isArray(items) || items.length === 0){
        list.innerHTML = `
          <li class="item">
            <p class="title">No listings yet</p>
            <p class="meta">Use the form to publish your first activity/visit.</p>
          </li>`;
        return;
      }

      items
        .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time))
        .forEach(it => {
          const metaBits = [];
          metaBits.push(`${it.date || ""} ${it.time || ""}`.trim());
          if (it.location) metaBits.push(it.location);
          if (it.kind) metaBits.push(it.kind.toUpperCase());
          const meta = metaBits.filter(Boolean).join(" • ");

          list.insertAdjacentHTML("beforeend", `
            <li class="item">
              <div class="itemTop">
                <div>
                  <p class="title">${esc(it.title)}</p>
                  <p class="meta">${esc(meta)}</p>
                  ${it.summary ? `<p class="meta">${esc(it.summary)}</p>` : ``}
                  ${it.noticeUrl ? `<p class="meta">Notice: <a href="${esc(it.noticeUrl)}" target="_blank" rel="noopener">open</a></p>` : ``}
                </div>
                <span class="pill">${esc(it.id || "")}</span>
              </div>

              <div class="actions">
                <button class="btn" onclick="editItem('${esc(it.id)}')">Edit</button>
                <button class="btn danger" onclick="deleteItem('${esc(it.id)}')">Delete</button>
              </div>
            </li>
          `);
        });
    }

    async function loadList(){
      try{
        const items = await ServiceApi.listMyItems();
        render(items);
      }catch(e){
        render([]);
        showMessage(e.message || "Could not load listings.", true);
      }
    }

    window.editItem = async (id) => {
      try{
        const it = await ServiceApi.getItem(id);
        document.getElementById("kind").value = it.kind || "activity";
        document.getElementById("title").value = it.title || "";
        document.getElementById("date").value = it.date || "";
        document.getElementById("time").value = it.time || "";
        document.getElementById("location").value = it.location || "";
        document.getElementById("summary").value = it.summary || "";
        document.getElementById("noticeUrl").value = it.noticeUrl || "";
        document.getElementById("itemForm").dataset.editingId = id;
        showMessage("Loaded for editing. Press Publish to update.");
      }catch(e){
        showMessage(e.message || "Could not load item.", true);
      }
    };

    window.deleteItem = async (id) => {
      if (!confirm("Delete this listing?")) return;
      try{
        await ServiceApi.deleteItem(id);
        showMessage("Deleted.");
        await loadList();
      }catch(e){
        showMessage(e.message || "Could not delete.", true);
      }
    };

    document.getElementById("itemForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const editingId = e.currentTarget.dataset.editingId || "";

      const payload = {
        kind: document.getElementById("kind").value,
        title: document.getElementById("title").value.trim(),
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        location: document.getElementById("location").value.trim(),
        summary: document.getElementById("summary").value.trim(),
        noticeUrl: document.getElementById("noticeUrl").value.trim()
      };

      try{
        if (editingId){
          await ServiceApi.updateItem(editingId, payload);
          e.currentTarget.dataset.editingId = "";
          showMessage("Updated.");
        }else{
          await ServiceApi.createItem(payload);
          showMessage("Published.");
        }
        document.getElementById("clearFormBtn").click();
        await loadList();
      }catch(err){
        showMessage(err.message || "Publish failed.", true);
      }
    });

    document.getElementById("clearFormBtn").addEventListener("click", () => {
      document.getElementById("itemForm").dataset.editingId = "";
      document.getElementById("kind").value = "activity";
      document.getElementById("title").value = "";
      document.getElementById("date").value = "";
      document.getElementById("time").value = "";
      document.getElementById("location").value = "";
      document.getElementById("summary").value = "";
      document.getElementById("noticeUrl").value = "";
    });

    document.getElementById("refreshBtn").addEventListener("click", loadList);

    document.getElementById("logoutBtn").addEventListener("click", () => {
      ServiceAuth.logout();
      location.href = "service-access.html";
    });

    // Guard: must be logged in
    const session = ServiceAuth.getSession();
    if (!session){
      location.href = "service-access.html";
    }else{
      document.getElementById("hello").textContent = `Welcome, ${session.entity_id}`;
      document.getElementById("who").textContent = session.display_name
        ? `Signed in as ${session.display_name}. You can publish/manage your own listings.`
        : `You can publish/manage your own listings.`;
      loadList();
    }
  </script>
</body>
</html>
