<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member Information — The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css" />

  <style>
    body {
      background: linear-gradient(180deg, #e9f1fb, #f6f9fc);
      margin: 0;
    }

    /* TOP NAV */
    .top-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 1rem 1.25rem;
    }

    .nav-left {
      justify-self: start;
    }

    .nav-center {
      justify-self: center;
    }

    .nav-right {
      justify-self: end;
    }

    .top-nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    /* MAIN */
    .content-wrapper {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem 2rem;
    }

    h1 {
      color: #003366;
      margin-bottom: 0.4rem;
    }

    .intro {
      color: #445;
      margin-bottom: 1.6rem;
    }

    /* MENU */
    .menu-grid {
      display: grid;
      gap: 1rem;
    }

    .menu-item {
      display: block;
      max-width: 460px;
      padding: 0.9rem 1.1rem;
      background: #ffffff;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .menu-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .menu-item h3 {
      margin: 0 0 0.35rem 0;
      color: #003366;
      font-size: 1.05rem;
    }

    .menu-item p {
      margin: 0;
      color: #556;
      font-size: 0.95rem;
      line-height: 1.35;
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav class="top-nav">
    <div class="nav-left">
      <a href="index.html">Home</a>
    </div>

    <div class="nav-center">
      <a href="events-calendar.html">Calendar</a>
    </div>

    <div class="nav-right">
      <a href="#" id="logout-link">Logout</a>
    </div>
  </nav>

  <main class="content-wrapper">

    <h1>Member Information</h1>

    <p class="intro">
      Access member resources, update your details, or browse the directory.
    </p>

    <div class="menu-grid">

      <a href="your-info.html" class="menu-item">
        <h3>Your Information</h3>
        <p>Update household members and contact preferences.</p>
      </a>

      <a href="members-directory.html" class="menu-item">
        <h3>Members Directory</h3>
        <p>View contact details shared by residents.</p>
      </a>

      <!-- Future menu items go here -->

    </div>

  </main>

  <script src="logout.js"></script>

</body>
</html>
