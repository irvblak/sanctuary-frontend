<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Members Directory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Session gate -->
<script src="access.js"></script>

<!-- Directory logic -->
<script src="members-directory.js" defer></script>

<!-- Logout handler -->
<script src="logout.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
  color: #222;
}

/* ---------- NAV ---------- */
nav {
  padding: 1rem 1.25rem;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
}

nav a {
  text-decoration: none;
  font-weight: 500;
  color: #005ea8;
  margin: 0 0.5rem;
}

nav .center {
  text-align: center;
}

nav .right {
  text-align: right;
}

/* ---------- MAIN ---------- */
main {
  max-width: 1100px;
  margin: 0 auto 2rem;
  padding: 0 1rem;
}

h2 {
  margin-top: 1.5rem;
  font-size: 1.2rem;
}

/* ---------- BUTTON GRID ---------- */
.member-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.member-button {
  padding: 0.4rem 0.3rem;
  font-size: 0.85rem;
  cursor: pointer;
  border-radius: 6px;
  border: 1px solid #bbb;
  background: #f8f8f8;
}

.member-button.active {
  background: #005ea8;
  color: #fff;
}

.member-button.inactive {
  opacity: 0.4;
  cursor: default;
}

/* ---------- DETAIL ---------- */
#member-detail {
  margin-top: 1rem;
}

.member-detail-wrapper {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}

.resident-card {
  background: #fff;
  border-radius: 10px;
  padding: 0.75rem 1rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.resident-header {
  font-weight: 600;
  margin-bottom: 0.4rem;
}

.resident-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  margin: 0.2rem 0;
}

@media (max-width: 640px) {
  .member-grid {
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
  }
}
</style>
</head>

<body>

<nav>
  <!-- LEFT -->
  <div>
    <a href="index.html">Home</a>
  </div>

  <!-- CENTER -->
  <div class="center">
    <span>Calendar</span> ·
    <a href="your-info.html">Member Information</a>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <a href="#" onclick="logout()">Logout</a>
  </div>
</nav>

<main>

<h2>Sanctuary Mews</h2>
<div id="members-mews" class="member-grid"></div>

<h2>Sanctuary Court</h2>
<div id="members-court" class="member-grid"></div>

<div id="member-detail"></div>

</main>

</body>
</html>
