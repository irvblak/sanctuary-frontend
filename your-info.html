<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Information</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
      color: #222;
    }

    nav {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    .your-info-container {
      max-width: 720px;
      margin: 0 auto 2rem;
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .intro-text {
      margin-bottom: 1.25rem;
      font-size: 1rem;
    }

    .intro-text .subtle {
      color: #666;
      font-size: 0.9rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      font-size: 1rem;
      box-sizing: border-box;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.6rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }

    .saved {
      margin-top: 1rem;
      color: #2a6f2a;
      font-size: 0.95rem;
    }

    @media (max-width: 640px) {
      input, textarea {
        font-size: 16px; /* prevent iOS zoom */
      }

      .intro-text {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="members-directory.html">Members Directory →</a>
    <a href="logout.html">Log out</a>
  </nav>

  <main class="your-info-container">
    <h1>Your Information</h1>

    <div class="intro-text">
      <p>
        Enter as much information as you wish to share.<br>
        <span class="subtle">(You can change it at any time.)</span>
      </p>
      <p>
        See it in the
        <a href="members-directory.html">Members Directory →</a>
      </p>
    </div>

    <form id="yourInfoForm">
      <label>
        Name
        <input type="text" id="name" />
      </label>

      <label>
        Address
        <input type="text" id="address" />
      </label>

      <label>
        Phone
        <input type="text" id="phone" />
      </label>

      <label>
        Email
        <input type="email" id="email" />
      </label>

      <label>
        Notes / Interests
        <textarea id="notes"></textarea>
      </label>

      <button type="submit">Save</button>

      <div class="saved" id="savedMessage" style="display:none;">
        Your information has been saved.
      </div>
    </form>
  </main>

  <script>
    const STORAGE_KEY = "sanctuaryMembers";

    function loadMembers() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    }

    function saveMembers(members) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
    }

    function getCurrentMemberIndex() {
      // Trust-based model: single entry per browser/session
      // If one exists, edit it; otherwise create one
      return 0;
    }

    function loadForm() {
      const members = loadMembers();
      const member = members[0] || {};

      document.getElementById("name").value = member.name || "";
      document.getElementById("address").value = member.address || "";
      document.getElementById("phone").value = member.phone || "";
      document.getElementById("email").value = member.email || "";
      document.getElementById("notes").value = member.notes || "";
    }

    document.getElementById("yourInfoForm").addEventListener("submit", e => {
      e.preventDefault();

      const members = loadMembers();
      const idx = getCurrentMemberIndex();

      members[idx] = {
        name: document.getElementById("name").value.trim(),
        address: document.getElementById("address").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        notes: document.getElementById("notes").value.trim(),
        lastUpdated: new Date().toISOString()
      };

      saveMembers(members);

      const msg = document.getElementById("savedMessage");
      msg.style.display = "block";
      setTimeout(() => (msg.style.display = "none"), 3000);
    });

    loadForm();
  </script>

</body>
</html>
