<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Sign-in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <link rel="stylesheet" href="styles-main.css?v=ADMIN_SIGNIN_1" />

  <style>
    :root{
      --ink:#1f2a37;
      --muted:#667085;
      --brand:#005ea8;
      --bg1:#e8f2ff;
      --bg2:#ffffff;
      --card:#ffffff;
      --border:#dbe6f3;
      --danger:#b42318;
    }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background: linear-gradient(180deg, var(--bg1) 0%, #f2f7fb 45%, var(--bg2) 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
    }

    .card{
      width:min(520px, 100%);
      background:var(--card);
      border-radius:18px;
      box-shadow:0 10px 26px rgba(0,0,0,0.08);
      border:1px solid rgba(219,230,243,0.85);
      padding:18px 18px 16px;
    }

    h1{
      margin:0 0 6px 0;
      color:#003366;
      font-size:1.35rem;
    }

    .subtle{
      margin:0 0 14px 0;
      color:var(--muted);
      line-height:1.45;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-end;
    }

    .field{
      flex:1;
      min-width:170px;
    }

    label{
      display:block;
      font-weight:800;
      font-size:.9rem;
      color:#425466;
      margin:0 0 6px 0;
    }

    input{
      width:100%;
      padding:.62rem .72rem;
      border-radius:12px;
      border:1px solid #cfd8e3;
      font-size:1rem;
      box-sizing:border-box;
      background:#fff;
      color:var(--ink);
    }

    .pinField{ max-width:160px; }

    button{
      width:100%;
      margin-top:14px;
      padding:.75rem .9rem;
      border:0;
      border-radius:12px;
      background:var(--brand);
      color:#fff;
      font-weight:900;
      font-size:1rem;
      cursor:pointer;
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .msg{
      display:none;
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      white-space:pre-wrap;
    }

    .msg.warn{
      background:#fff5f5;
      border:1px solid #f2b8b8;
      color:#7a0000;
    }

    .footer{
      margin-top:14px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      font-size:.95rem;
      color:var(--muted);
      align-items:center;
    }

    .footer a{
      color:#003366;
      text-decoration:none;
      font-weight:900;
      white-space:nowrap;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Admin sign-in</h1>
    <p class="subtle">
      Enter your membership number and 4-digit PIN to continue to the Admin Login page.
    </p>

    <div class="row">
      <div class="field">
        <label for="memberId">Membership number</label>
        <input id="memberId" placeholder="SM01" autocomplete="off" />
      </div>

      <div class="field pinField">
        <label for="pin">4-digit PIN</label>
        <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234" autocomplete="off" />
      </div>
    </div>

    <button id="continueBtn" type="button" disabled>Continue</button>

    <div id="warn" class="msg warn"></div>

    <div class="footer">
      <a href="index.html">← Home</a>
      <span>Not an admin? Use the normal site.</span>
    </div>
  </div>

  <script>
    /************************************************************
     * CONFIG
     ************************************************************/
    const API_BASE = "https://sanctuary-backend-8iqc.onrender.com";

    // Gate flag (session-only, expires with browser close)
    const GATE_KEY = "adminGateOk";
    const GATE_TTL_MS = 10 * 60 * 1000; // 10 minutes

    /************************************************************
     * DOM
     ************************************************************/
    const memberIdEl = document.getElementById("memberId");
    const pinEl = document.getElementById("pin");
    const continueBtn = document.getElementById("continueBtn");
    const warnEl = document.getElementById("warn");

    function baseId(raw){
      return String(raw || "").trim().split("/")[0].toUpperCase();
    }
    function onlyDigits4(s){
      return /^[0-9]{4}$/.test(String(s || "").trim());
    }
    function showWarn(msg){
      warnEl.style.display = "block";
      warnEl.textContent = msg;
    }
    function clearWarn(){
      warnEl.style.display = "none";
      warnEl.textContent = "";
    }

    function setGateOk(){
      // Store the timestamp; admin-login checks freshness
      sessionStorage.setItem(GATE_KEY, String(Date.now()));
    }

    function updateEnabled(){
      const mid = baseId(memberIdEl.value);
      const pin = pinEl.value.trim();
      continueBtn.disabled = !(mid && onlyDigits4(pin));
    }

    async function proceed(){
      clearWarn();

      const mid = baseId(memberIdEl.value);
      const pin = pinEl.value.trim();

      if (!mid) return showWarn("Please enter your membership number.");
      if (!onlyDigits4(pin)) return showWarn("Please enter your 4-digit PIN.");

      continueBtn.disabled = true;

      try{
        const res = await fetch(API_BASE + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ memberId: mid, pin })
        });

        let body = null;
        try { body = await res.json(); } catch {}

        if (!res.ok || !body || body.success !== true){
          throw new Error((body && (body.message || body.error)) ? (body.message || body.error) : "Access not recognised.");
        }

        // IMPORTANT: This page does NOT store any token.
        // It only sets a short-lived session flag to allow reaching admin-login.
        setGateOk();

        // Optional: if you want an extra-hard TTL check here too:
        // sessionStorage.setItem("adminGateExp", String(Date.now() + GATE_TTL_MS));

        location.href = "admin-login.html";
      } catch (e){
        showWarn("Membership details not recognised.");
        continueBtn.disabled = false;
      }
    }

    memberIdEl.addEventListener("input", updateEnabled);
    pinEl.addEventListener("input", updateEnabled);
    pinEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !continueBtn.disabled) proceed();
    });
    continueBtn.addEventListener("click", proceed);

    // Init
    updateEnabled();
  </script>
</body>
</html>
