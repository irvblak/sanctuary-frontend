<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Information – The Sanctuary Club</title>
  <meta name="robots" content="noindex, nofollow" />

  <script src="access.js?v=AC_1"></script>
  <script src="logout.js?v=LO_3"></script>

  <style>
    :root{
      --bg1:#d9ecff;
      --bg2:#f2f7fb;
      --ink:#1b2733;
      --muted:#5d6a77;
      --card:#ffffff;
      --line:#dbe6f3;
      --brand:#005ea8;
      --brand-dark:#003366;
      --radius:16px;

      --cat-social:#2563eb;
      --cat-sport:#7c3aed;
      --cat-games:#0f766e;
      --cat-fitness:#16a34a;
      --cat-food:#ea580c;
      --cat-entertainment:#ca8a04;
      --cat-meeting:#111827;
      --cat-external-service:#c026d3;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, #ffffff 100%);
      color:var(--ink);
      min-height:100vh;
    }

    nav{
      padding:1rem 1.25rem;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:.75rem;
      max-width:1180px;
      margin:0 auto;
    }

    .nav-left,.nav-right{
      display:flex;
      gap:.6rem;
      align-items:center;
      flex-wrap:wrap;
    }

    .nav-right{ justify-content:flex-end; }

    .brand{
      justify-self:center;
      font-weight:900;
      color:var(--brand-dark);
      letter-spacing:.2px;
      white-space:nowrap;
      text-align:center;
    }

    a.btn, button.btn{
      appearance:none;
      text-decoration:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--brand-dark);
      padding:.55rem .85rem;
      border-radius:999px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(0,0,0,.05);
      font-size:.95rem;
    }

    a.btn.primary, button.btn.primary{
      background:var(--brand);
      color:#fff;
      border-color:transparent;
    }

    main{
      max-width:1180px;
      margin:0 auto 2rem;
      padding:0 1rem;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:0 2px 12px rgba(0,0,0,0.06);
      padding:1rem;
      border:1px solid rgba(219,230,243,0.7);
      margin-top:.8rem;
    }

    .hero{
      display:flex;
      gap:1rem;
      flex-wrap:wrap;
      align-items:flex-start;
      justify-content:space-between;
      margin-bottom:.9rem;
    }

    h1{
      margin:0;
      font-size:1.55rem;
      color:var(--brand-dark);
      line-height:1.2;
    }

    .subtle{
      color:var(--muted);
      line-height:1.45;
      font-size:.96rem;
      margin-top:.3rem;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      padding:.22rem .6rem;
      border-radius:999px;
      color:#fff;
      font-weight:900;
      font-size:.84rem;
      white-space:nowrap;
      margin-bottom:.45rem;
    }

    .statusRow{
      display:flex;
      gap:.75rem;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:.75rem;
    }

    .statusBox{
      display:none;
      padding:.72rem .88rem;
      border-radius:14px;
      font-weight:800;
      line-height:1.4;
    }

    .statusBox.show{ display:block; }

    .statusInfo{
      background:#eef6ff;
      color:#0b4d87;
      border:1px solid rgba(0,94,168,.18);
    }

    .statusWarn{
      background:#fff8ea;
      color:#8a5b00;
      border:1px solid rgba(138,91,0,.18);
    }

    .statusErr{
      background:#fff2f4;
      color:#b00020;
      border:1px solid rgba(176,0,32,.18);
    }

    .section{
      border:1px solid rgba(219,230,243,0.9);
      border-radius:14px;
      padding:.95rem;
      background:#fff;
      margin-bottom:1rem;
    }

    .section h2{
      margin:0 0 .65rem;
      color:var(--brand-dark);
      font-size:1.08rem;
    }

    .section p{
      margin:.45rem 0;
      line-height:1.6;
    }

    .detailGrid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:.8rem;
    }

    @media (max-width:760px){
      .detailGrid{ grid-template-columns:1fr; }
    }

    .detailBox{
      border:1px solid var(--line);
      border-radius:14px;
      padding:.8rem .85rem;
      background:#fbfdff;
    }

    .detailLabel{
      color:var(--muted);
      font-size:.84rem;
      font-weight:800;
      margin-bottom:.2rem;
    }

    .detailValue{
      color:var(--brand-dark);
      font-weight:900;
      line-height:1.35;
      word-break:break-word;
    }

    .noticeSummary{
      margin-bottom:.9rem;
      padding:.9rem 1rem;
      border-radius:14px;
      background:#f7fbff;
      border:1px solid rgba(0,94,168,.12);
      color:#23415f;
      line-height:1.55;
      font-weight:800;
    }

    .noticeBody{
      white-space:pre-wrap;
      line-height:1.7;
      color:#21303d;
      font-size:1rem;
    }

    .mediaList{
      display:grid;
      gap:.7rem;
      margin-top:.9rem;
    }

    .mediaBox{
      border:1px solid var(--line);
      border-radius:14px;
      background:#fbfdff;
      padding:.75rem;
    }

    .mediaBox img{
      display:block;
      max-width:100%;
      height:auto;
      border-radius:12px;
      margin:0 auto;
    }

    .mediaBox a{
      color:var(--brand);
      font-weight:800;
      text-decoration:none;
      word-break:break-all;
    }

    .inlineBadges{
      display:flex;
      gap:.45rem;
      flex-wrap:wrap;
      margin-top:.25rem;
    }

    .miniBadge{
      display:inline-flex;
      align-items:center;
      padding:.18rem .5rem;
      border-radius:999px;
      background:#eef6ff;
      color:#0b4d87;
      border:1px solid rgba(0,94,168,.15);
      font-weight:800;
      font-size:.82rem;
      white-space:nowrap;
    }

    .actionPanel{
      display:flex;
      gap:.8rem;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      padding:.95rem;
      border-radius:14px;
      background:linear-gradient(180deg, #eef6ff 0%, #f7fbff 100%);
      border:1px solid rgba(0,94,168,.16);
    }

    .actionPanelText{
      color:#0b4d87;
      line-height:1.5;
      font-weight:800;
    }

    .empty{
      color:var(--muted);
      font-weight:800;
    }

    .small{
      font-size:.92rem;
      color:var(--muted);
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-left">
      <a class="btn" href="events.html">← Events List</a>
      <a class="btn" href="events-calendar.html">Calendar</a>
    </div>

    <div class="brand">Sanctuary Club — Event Information</div>

    <div class="nav-right">
      <a class="btn" href="members-info.html">Members Hub</a>
      <button class="btn primary" id="logoutBtn" type="button">Logout</button>
    </div>
  </nav>

  <main>
    <div class="statusRow">
      <div class="statusBox statusInfo show" id="infoBox">Loading event…</div>
      <div class="statusBox statusWarn" id="warnBox"></div>
      <div class="statusBox statusErr" id="errBox"></div>
    </div>

    <div class="card">
      <div class="hero">
        <div>
          <div id="heroChipWrap"></div>
          <h1 id="eventTitle">Event</h1>
          <div class="subtle" id="eventSubtle">Details loading…</div>
        </div>
        <div class="actions">
          <a class="btn" href="events-calendar.html">Calendar</a>
          <a class="btn" href="events.html">Events List</a>
        </div>
      </div>

      <div class="section">
        <h2>Event summary</h2>
        <div class="detailGrid" id="detailsGrid"></div>
      </div>

      <div class="section">
        <h2>Host notice</h2>
        <div id="noticeSummaryWrap" class="noticeSummary" style="display:none;"></div>
        <div id="noticeBodyWrap" class="noticeBody empty">No notice details available.</div>
        <div id="noticeMediaWrap" class="mediaList"></div>
      </div>

      <div class="section">
        <h2>Availability</h2>
        <div class="detailGrid" id="trackingGrid"></div>
        <div class="inlineBadges" id="timingBadges"></div>
        <p class="small" id="bookingWindowText"></p>
      </div>

      <div class="section">
        <div class="actionPanel">
          <div class="actionPanelText">
            To proceed, open the booking page below.
          </div>
          <div class="actions" style="margin-top:0;">
            <a class="btn primary" id="bookingLink" href="#">Book or register your interest</a>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>Charges</h2>
        <div class="detailGrid" id="chargesGrid"></div>
      </div>
    </div>
  </main>

  <script>
    const BACKEND_URL = "https://sanctuary-backend-8iqc.onrender.com";

    const CATEGORY_DEFS = [
      { key: "social", label: "Social", colorVar: "--cat-social" },
      { key: "sport", label: "Sport", colorVar: "--cat-sport" },
      { key: "games", label: "Games", colorVar: "--cat-games" },
      { key: "fitness", label: "Fitness", colorVar: "--cat-fitness" },
      { key: "food", label: "Food", colorVar: "--cat-food" },
      { key: "entertainment", label: "Entertainment", colorVar: "--cat-entertainment" },
      { key: "meeting", label: "Meeting", colorVar: "--cat-meeting" },
      { key: "external-service", label: "External Service", colorVar: "--cat-external-service" }
    ];

    const params = new URLSearchParams(window.location.search);
    const EVENT_ID = (params.get("event_id") || "").trim();

    let eventData = null;

    const infoBox = document.getElementById("infoBox");
    const warnBox = document.getElementById("warnBox");
    const errBox = document.getElementById("errBox");

    const heroChipWrap = document.getElementById("heroChipWrap");
    const eventTitleEl = document.getElementById("eventTitle");
    const eventSubtleEl = document.getElementById("eventSubtle");

    const detailsGrid = document.getElementById("detailsGrid");
    const noticeSummaryWrap = document.getElementById("noticeSummaryWrap");
    const noticeBodyWrap = document.getElementById("noticeBodyWrap");
    const noticeMediaWrap = document.getElementById("noticeMediaWrap");
    const trackingGrid = document.getElementById("trackingGrid");
    const timingBadges = document.getElementById("timingBadges");
    const bookingWindowText = document.getElementById("bookingWindowText");
    const chargesGrid = document.getElementById("chargesGrid");
    const bookingLink = document.getElementById("bookingLink");
    const logoutBtn = document.getElementById("logoutBtn");

    function showInfo(msg){
      infoBox.textContent = msg;
      infoBox.classList.add("show");
    }

    function clearInfo(){
      infoBox.textContent = "";
      infoBox.classList.remove("show");
    }

    function showWarn(msg){
      warnBox.textContent = msg;
      warnBox.classList.add("show");
    }

    function clearWarn(){
      warnBox.textContent = "";
      warnBox.classList.remove("show");
    }

    function showErr(msg){
      errBox.textContent = msg;
      errBox.classList.add("show");
    }

    function clearErr(){
      errBox.textContent = "";
      errBox.classList.remove("show");
    }

    function parseDateAndTime(eventDate, startTime){
      if (!eventDate) return null;
      const time = startTime || "00:00";
      const d = new Date(`${eventDate}T${time}:00`);
      if (Number.isNaN(d.getTime())) return null;
      return d;
    }

    function parseIso(iso){
      if (!iso) return null;
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return null;
      return d;
    }

    function dateDisplay(d){
      if (!d) return "—";
      return d.toLocaleDateString("en-GB", {
        weekday:"long",
        day:"2-digit",
        month:"long",
        year:"numeric"
      });
    }

    function timeDisplay(d){
      if (!d) return "—";
      return d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
    }

    function money(v){
      return `£${Number(v || 0).toFixed(2)}`;
    }

    function categoryColor(key){
      const def = CATEGORY_DEFS.find(c => c.key === key);
      if (!def) return "#005ea8";
      const v = getComputedStyle(document.documentElement).getPropertyValue(def.colorVar).trim();
      return v || "#005ea8";
    }

    function toCategoryKey(rawKey, rawLabel){
      const key = String(rawKey || "").trim().toLowerCase();
      const label = String(rawLabel || "").trim().toLowerCase();

      if (key === "external service" || key === "external_service" || key === "external-service") return "external-service";
      if (label === "external service") return "external-service";

      const map = {
        social: "social",
        sport: "sport",
        games: "games",
        fitness: "fitness",
        food: "food",
        entertainment: "entertainment",
        meeting: "meeting"
      };

      if (map[key]) return map[key];
      if (map[label]) return map[label];
      return key || label || "social";
    }

    function makeDetailBox(label, value){
      return `
        <div class="detailBox">
          <div class="detailLabel">${label}</div>
          <div class="detailValue">${value || "—"}</div>
        </div>
      `;
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
    }

    async function getJson(url, options = {}){
      const res = await fetch(url, options);
      const text = await res.text();
      let data = {};
      try{
        data = text ? JSON.parse(text) : {};
      }catch{
        data = {};
      }
      if (!res.ok){
        throw new Error(data.message || `HTTP ${res.status}`);
      }
      return data;
    }

    function renderEvent(){
      if (!eventData) return;

      const eventDateObj = parseDateAndTime(eventData.event_date, eventData.start_time);
      const categoryKey = toCategoryKey(eventData.category_key, eventData.category_label);
      const categoryLabel = eventData.category_label || eventData.category_key || "";
      const tracking = eventData.tracking || {};

      heroChipWrap.innerHTML = `<span class="chip" style="background:${categoryColor(categoryKey)}">${categoryLabel || "Event"}</span>`;
      eventTitleEl.textContent = `${eventData.event_ref || eventData.event_id || "Event"} — ${eventData.title || "Untitled event"}`;
      eventSubtleEl.textContent = `${dateDisplay(eventDateObj)} · ${timeDisplay(eventDateObj)}${eventData.end_time ? ` to ${eventData.end_time}` : ""} · ${eventData.location || "Location TBC"}`;

      detailsGrid.innerHTML = [
        makeDetailBox("Reference", eventData.event_ref || eventData.event_id || "—"),
        makeDetailBox("Host", eventData.host_name || "Host"),
        makeDetailBox("Date", dateDisplay(eventDateObj)),
        makeDetailBox("Time", `${timeDisplay(eventDateObj)}${eventData.end_time ? ` to ${eventData.end_time}` : ""}`),
        makeDetailBox("Location", eventData.location || "TBC"),
        makeDetailBox("Category", categoryLabel || "—"),
        makeDetailBox("Member price", money(eventData.price_member)),
        makeDetailBox("Guest price", money(eventData.price_guest))
      ].join("");

      const summary = String(eventData.notice_summary || "").trim();
      if (summary){
        noticeSummaryWrap.style.display = "";
        noticeSummaryWrap.textContent = summary;
      } else {
        noticeSummaryWrap.style.display = "none";
        noticeSummaryWrap.textContent = "";
      }

      const fullNotice = String(eventData.notice_body || eventData.description || "").trim();
      if (fullNotice){
        noticeBodyWrap.className = "noticeBody";
        noticeBodyWrap.textContent = fullNotice;
      } else {
        noticeBodyWrap.className = "noticeBody empty";
        noticeBodyWrap.textContent = "No further notice wording yet.";
      }

      noticeMediaWrap.innerHTML = "";
      const media = Array.isArray(eventData.notice_media) ? eventData.notice_media : [];
      if (media.length){
        media.forEach((url) => {
          const lower = String(url).toLowerCase();
          const box = document.createElement("div");
          box.className = "mediaBox";

          if (/\.(gif|png|jpe?g|webp|svg)$/i.test(lower)) {
            box.innerHTML = `
              <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">
                <img src="${escapeHtml(url)}" alt="Notice media" loading="lazy" />
              </a>
            `;
          } else {
            box.innerHTML = `
              <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>
            `;
          }

          noticeMediaWrap.appendChild(box);
        });
      }

      trackingGrid.innerHTML = [
        makeDetailBox("Total capacity", Number(eventData.capacity_total || 0)),
        makeDetailBox("Booked places", Number(tracking.total_places_booked || 0)),
        makeDetailBox("Places remaining", Number(tracking.places_remaining || 0)),
        makeDetailBox("Waitlist records", Number(tracking.waitlist_count || 0)),
        makeDetailBox("Interest records", Number(tracking.interested_count || 0)),
        makeDetailBox("Status", eventData.status || "published")
      ].join("");

      timingBadges.innerHTML = `
        <span class="miniBadge">${eventData.member_booking_open ? "Members may book now" : "Member booking not yet open"}</span>
        <span class="miniBadge">${eventData.guest_booking_open ? "Guests permitted now" : "Guests not yet open"}</span>
        <span class="miniBadge">${eventData.cancellation_open ? "Cancellation window open" : "Cancellation window closed"}</span>
        <span class="miniBadge">${eventData.refund_window_open ? "Refund window open" : "Refund window closed"}</span>
      `;

      const lines = [];
      if (eventData.members_booking_open_at){
        const d = parseIso(eventData.members_booking_open_at);
        if (d) lines.push(`Member booking opens ${dateDisplay(d)} at ${timeDisplay(d)}.`);
      }
      if (eventData.guests_booking_open_at){
        const d = parseIso(eventData.guests_booking_open_at);
        if (d) lines.push(`Guest booking opens ${dateDisplay(d)} at ${timeDisplay(d)}.`);
      }
      if (eventData.booking_close_at){
        const d = parseIso(eventData.booking_close_at);
        if (d) lines.push(`Booking closes ${dateDisplay(d)} at ${timeDisplay(d)}.`);
      }
      if (eventData.cancellation_cutoff_at){
        const d = parseIso(eventData.cancellation_cutoff_at);
        if (d) lines.push(`Cancellation cut-off is ${dateDisplay(d)} at ${timeDisplay(d)}.`);
      }
      if (eventData.refund_cutoff_at){
        const d = parseIso(eventData.refund_cutoff_at);
        if (d) lines.push(`Refund cut-off is ${dateDisplay(d)} at ${timeDisplay(d)}.`);
      }
      bookingWindowText.textContent = lines.join(" ") || "Booking timing will appear here.";

      chargesGrid.innerHTML = [
        makeDetailBox("Member price", money(eventData.price_member)),
        makeDetailBox("Guest price", money(eventData.price_guest)),
        makeDetailBox("Max places per member", Number(eventData.max_places_per_member || 0))
      ].join("");

      bookingLink.href = `event-booking.html?event_id=${encodeURIComponent(eventData.event_id || EVENT_ID)}`;
    }

    async function loadEvent(){
      clearWarn();
      clearErr();
      showInfo("Loading event…");

      if (!EVENT_ID){
        clearInfo();
        showErr("No event_id supplied in the link.");
        return;
      }

      try{
        const data = await getJson(`${BACKEND_URL}/api/events/${encodeURIComponent(EVENT_ID)}`);
        eventData = data.event || null;
        if (!eventData){
          throw new Error("Event not found.");
        }
        renderEvent();
        showInfo("Event loaded.");
      }catch(err){
        clearInfo();
        showErr(err.message || "Could not load event.");
      }
    }

    logoutBtn.addEventListener("click", () => {
      if (typeof window.scLogout === "function"){
        window.scLogout();
        return;
      }
      try{ localStorage.clear(); }catch{}
      try{ sessionStorage.clear(); }catch{}
      window.location.href = "index.html";
    });

    loadEvent();
  </script>
</body>
</html>
