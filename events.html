<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events List – The Sanctuary Club</title>
  <meta name="robots" content="noindex, nofollow" />

  <script src="access.js?v=AC_1"></script>
  <script src="logout.js?v=LO_3"></script>

  <style>
    :root{
      --bg1:#d9ecff;
      --bg2:#f2f7fb;
      --ink:#1b2733;
      --muted:#5d6a77;
      --card:#ffffff;
      --line:#dbe6f3;
      --brand:#005ea8;
      --brand-dark:#003366;
      --radius:16px;

      --cat-social:#2563eb;
      --cat-sport:#7c3aed;
      --cat-games:#0f766e;
      --cat-fitness:#16a34a;
      --cat-food:#ea580c;
      --cat-entertainment:#ca8a04;
      --cat-meeting:#111827;
      --cat-external-service:#c026d3;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, #ffffff 100%);
      color:var(--ink);
      min-height:100vh;
    }

    nav{
      padding:1rem 1.25rem;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:.75rem;
      max-width:1180px;
      margin:0 auto;
    }

    .nav-left,.nav-right{
      display:flex;
      gap:.6rem;
      align-items:center;
      flex-wrap:wrap;
    }

    .nav-right{ justify-content:flex-end; }

    .brand{
      justify-self:center;
      font-weight:900;
      color:var(--brand-dark);
      letter-spacing:.2px;
      white-space:nowrap;
      text-align:center;
    }

    a.btn, button.btn{
      appearance:none;
      text-decoration:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--brand-dark);
      padding:.55rem .85rem;
      border-radius:999px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(0,0,0,.05);
      font-size:.95rem;
    }

    a.btn.primary, button.btn.primary{
      background:var(--brand);
      color:#fff;
      border-color:transparent;
    }

    main{
      max-width:1180px;
      margin:0 auto 2rem;
      padding:0 1rem;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:0 2px 12px rgba(0,0,0,0.06);
      padding:1rem;
      border:1px solid rgba(219,230,243,0.7);
      margin-top:.8rem;
    }

    .topbar{
      display:flex;
      gap:1rem;
      flex-wrap:wrap;
      align-items:flex-start;
      justify-content:space-between;
      margin-bottom:.8rem;
    }

    h1{
      margin:0;
      font-size:1.4rem;
      color:var(--brand-dark);
      letter-spacing:.2px;
    }

    .subtitle{
      margin-top:.25rem;
      color:var(--muted);
      font-size:.96rem;
      line-height:1.45;
    }

    .controls{
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }

    .statusRow{
      display:flex;
      gap:.75rem;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:.75rem;
    }

    .statusBox{
      display:none;
      padding:.72rem .88rem;
      border-radius:14px;
      font-weight:800;
      line-height:1.4;
    }

    .statusBox.show{ display:block; }

    .statusInfo{
      background:#eef6ff;
      color:#0b4d87;
      border:1px solid rgba(0,94,168,.18);
    }

    .statusWarn{
      background:#fff8ea;
      color:#8a5b00;
      border:1px solid rgba(138,91,0,.18);
    }

    .statusErr{
      background:#fff2f4;
      color:#b00020;
      border:1px solid rgba(176,0,32,.18);
    }

    .filters{
      display:flex;
      gap:.6rem 1rem;
      flex-wrap:wrap;
      align-items:center;
      margin:0 0 .75rem;
      color:var(--muted);
      font-size:.92rem;
    }

    .filterItem{
      display:flex;
      gap:.5rem;
      align-items:center;
      user-select:none;
      cursor:pointer;
    }

    .filterItem.off{ opacity:.35; }

    .swatch{
      width:14px;
      height:14px;
      border-radius:4px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    }

    .filterHelp{
      margin-left:auto;
      font-weight:700;
      color:var(--brand-dark);
      opacity:.85;
    }

    .tableWrap{
      overflow:auto;
      border:1px solid rgba(219,230,243,0.85);
      border-radius:14px;
      background:#fff;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:900px;
    }

    thead th{
      text-align:left;
      background:#f7fbff;
      color:var(--brand-dark);
      font-size:.92rem;
      font-weight:900;
      padding:.85rem .8rem;
      border-bottom:1px solid var(--line);
      white-space:nowrap;
    }

    tbody td{
      padding:.85rem .8rem;
      border-bottom:1px solid rgba(219,230,243,0.7);
      vertical-align:top;
      font-size:.95rem;
      line-height:1.4;
    }

    tbody tr:hover{
      background:#fbfdff;
    }

    tbody tr:last-child td{
      border-bottom:none;
    }

    .ref{
      font-weight:900;
      color:var(--brand-dark);
      margin-bottom:.18rem;
    }

    .muted{
      color:var(--muted);
      font-size:.9rem;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      padding:.2rem .58rem;
      border-radius:999px;
      color:#fff;
      font-weight:900;
      font-size:.82rem;
      white-space:nowrap;
    }

    .inlineList{
      display:flex;
      gap:.4rem;
      flex-wrap:wrap;
      align-items:center;
    }

    .miniBadge{
      display:inline-flex;
      align-items:center;
      padding:.18rem .5rem;
      border-radius:999px;
      background:#eef6ff;
      color:#0b4d87;
      border:1px solid rgba(0,94,168,.15);
      font-weight:800;
      font-size:.82rem;
      white-space:nowrap;
    }

    .actionCell{
      white-space:nowrap;
    }

    .empty{
      color:var(--muted);
      font-weight:800;
      padding:1rem;
    }

    .footNote{
      margin-top:.85rem;
      color:var(--muted);
      font-size:.93rem;
      line-height:1.45;
    }

    @media (max-width:760px){
      nav{
        grid-template-columns:1fr;
        row-gap:.65rem;
        text-align:center;
      }
      .nav-left,.nav-right{ justify-self:center; }
      .filterHelp{ margin-left:0; width:100%; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-left">
      <a class="btn" href="events-calendar.html">← Calendar</a>
      <a class="btn" href="members-info.html">Members Hub</a>
    </div>

    <div class="brand">Sanctuary Club — Events List</div>

    <div class="nav-right">
      <a class="btn" href="index.html">Home</a>
      <button class="btn primary" id="logoutBtn" type="button">Logout</button>
    </div>
  </nav>

  <main>
    <div class="card">
      <div class="topbar">
        <div>
          <h1>Events Diary – List View</h1>
          <div class="subtitle">
            All upcoming Sanctuary Club events in date order.
          </div>
        </div>

        <div class="controls">
          <a class="btn" href="events-calendar.html">View as calendar</a>
        </div>
      </div>

      <div class="statusRow">
        <div class="statusBox statusInfo show" id="infoBox">Loading events…</div>
        <div class="statusBox statusWarn" id="warnBox"></div>
        <div class="statusBox statusErr" id="errBox"></div>
      </div>

      <div class="filters" id="filters">
        <div class="filterHelp">Filter categories</div>
      </div>

      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Event</th>
              <th>Location</th>
              <th>Category</th>
              <th>Booking / Cost</th>
              <th>More Info</th>
            </tr>
          </thead>
          <tbody id="eventsBody">
          </tbody>
        </table>
      </div>

      <div class="footNote">
        More Info opens the Host Notice page for that event.
      </div>
    </div>
  </main>

  <script>
    const BACKEND_URL = "https://sanctuary-backend-8iqc.onrender.com";

    const CATEGORY_DEFS = [
      { key: "social", label: "Social", colorVar: "--cat-social" },
      { key: "sport", label: "Sport", colorVar: "--cat-sport" },
      { key: "games", label: "Games", colorVar: "--cat-games" },
      { key: "fitness", label: "Fitness", colorVar: "--cat-fitness" },
      { key: "food", label: "Food", colorVar: "--cat-food" },
      { key: "entertainment", label: "Entertainment", colorVar: "--cat-entertainment" },
      { key: "meeting", label: "Meeting", colorVar: "--cat-meeting" },
      { key: "external-service", label: "External Service", colorVar: "--cat-external-service" }
    ];

    const catOn = Object.fromEntries(CATEGORY_DEFS.map(c => [c.key, true]));
    let EVENTS = [];

    const filtersEl = document.getElementById("filters");
    const eventsBody = document.getElementById("eventsBody");
    const infoBox = document.getElementById("infoBox");
    const warnBox = document.getElementById("warnBox");
    const errBox = document.getElementById("errBox");
    const logoutBtn = document.getElementById("logoutBtn");

    function parseYMD(dateStr){
      const text = String(dateStr || "").trim();
      const match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!match) return null;

      const year = Number(match[1]);
      const monthIndex = Number(match[2]) - 1;
      const day = Number(match[3]);

      const d = new Date(year, monthIndex, day, 12, 0, 0, 0);
      if(
        d.getFullYear() !== year ||
        d.getMonth() !== monthIndex ||
        d.getDate() !== day
      ){
        return null;
      }

      return d;
    }

    function parseDateAndTime(eventDate, startTime){
      const baseDate = parseYMD(eventDate);
      if(!baseDate) return null;

      const timeText = String(startTime || "").trim();
      const timeMatch = timeText.match(/^(\d{1,2}):(\d{2})$/);

      if(!timeMatch){
        return new Date(
          baseDate.getFullYear(),
          baseDate.getMonth(),
          baseDate.getDate(),
          12, 0, 0, 0
        );
      }

      const hours = Number(timeMatch[1]);
      const minutes = Number(timeMatch[2]);

      return new Date(
        baseDate.getFullYear(),
        baseDate.getMonth(),
        baseDate.getDate(),
        hours, minutes, 0, 0
      );
    }

    function parseBackendIso(iso){
      if (!iso) return null;
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return null;
      return d;
    }

    function dateDisplay(d){
      return d.toLocaleDateString("en-GB", {
        weekday:"short",
        day:"2-digit",
        month:"short",
        year:"numeric"
      });
    }

    function longDateDisplay(d){
      return d.toLocaleDateString("en-GB", {
        weekday:"long",
        day:"2-digit",
        month:"long",
        year:"numeric"
      });
    }

    function timeHM(d){
      return d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
    }

    function categoryDef(key){
      return CATEGORY_DEFS.find(c => c.key === key) || null;
    }

    function categoryColor(key){
      const def = categoryDef(key);
      if (!def) return "#005ea8";
      const v = getComputedStyle(document.documentElement).getPropertyValue(def.colorVar).trim();
      return v || "#005ea8";
    }

    function toCategoryKey(rawKey, rawLabel){
      const key = String(rawKey || "").trim().toLowerCase();
      const label = String(rawLabel || "").trim().toLowerCase();

      if (key === "external service" || key === "external_service" || key === "external-service") return "external-service";
      if (label === "external service") return "external-service";

      const map = {
        social: "social",
        sport: "sport",
        games: "games",
        fitness: "fitness",
        food: "food",
        entertainment: "entertainment",
        meeting: "meeting"
      };

      if (map[key]) return map[key];
      if (map[label]) return map[label];

      return key || label || "social";
    }

    function showInfo(msg){
      infoBox.textContent = msg;
      infoBox.classList.add("show");
    }

    function clearInfo(){
      infoBox.textContent = "";
      infoBox.classList.remove("show");
    }

    function showWarn(msg){
      warnBox.textContent = msg;
      warnBox.classList.add("show");
    }

    function clearWarn(){
      warnBox.textContent = "";
      warnBox.classList.remove("show");
    }

    function showErr(msg){
      errBox.textContent = msg;
      errBox.classList.add("show");
    }

    function clearErr(){
      errBox.textContent = "";
      errBox.classList.remove("show");
    }

    async function getJson(url, options = {}){
      const res = await fetch(url, options);
      const text = await res.text();
      let data = {};
      try{
        data = text ? JSON.parse(text) : {};
      }catch{
        data = {};
      }
      if (!res.ok){
        throw new Error(data.message || `HTTP ${res.status}`);
      }
      return data;
    }

    function normalisedEvents(){
      return EVENTS
        .map(ev => {
          const dateObj = parseDateAndTime(ev.event_date, ev.start_time);
          if (!dateObj) return null;

          return {
            raw: ev,
            id: ev.event_ref || ev.event_id || "",
            backendId: ev.event_id || "",
            title: ev.title || "Untitled event",
            category: toCategoryKey(ev.category_key, ev.category_label),
            categoryLabel: ev.category_label || ev.category_key || "",
            dateObj,
            where: ev.location || "",
            hostName: ev.host_name || "",
            status: ev.status || "",
            endTime: ev.end_time || "",
            tracking: ev.tracking || {},
            priceMember: Number(ev.price_member || 0),
            priceGuest: Number(ev.price_guest || 0),
            capacityTotal: Number(ev.capacity_total || 0),
            bookingOpen: ev.member_booking_open === true,
            guestOpen: ev.guest_booking_open === true,
            cancellationOpen: ev.cancellation_open === true,
            refundWindowOpen: ev.refund_window_open === true,
            memberBookingOpensAt: parseBackendIso(ev.members_booking_open_at),
            guestBookingOpensAt: parseBackendIso(ev.guests_booking_open_at),
            bookingCloseAt: parseBackendIso(ev.booking_close_at)
          };
        })
        .filter(Boolean)
        .filter(ev => !!ev.backendId)
        .filter(ev => catOn[ev.category] !== false)
        .sort((a, b) => a.dateObj - b.dateObj);
    }

    function bookingSummaryText(ev){
      const tracked = ev.tracking || {};
      const booked = Number(tracked.total_places_booked || 0);
      const remaining = Number(tracked.places_remaining || 0);

      if (ev.bookingOpen){
        return `Open now · ${booked} booked · ${remaining} left`;
      }

      if (ev.memberBookingOpensAt){
        return `Opens ${longDateDisplay(ev.memberBookingOpensAt)} ${timeHM(ev.memberBookingOpensAt)}`;
      }

      return "Booking details on event page";
    }

    function costText(ev){
      const pm = Number(ev.priceMember || 0);
      const pg = Number(ev.priceGuest || 0);

      if (pm <= 0 && pg <= 0) return "Free";

      if (pm > 0 && pg > 0 && pm !== pg){
        return `£${pm.toFixed(2)} member · £${pg.toFixed(2)} guest`;
      }

      if (pm > 0) return `£${pm.toFixed(2)}`;
      return `£${pg.toFixed(2)}`;
    }

    function renderFilters(){
      [...filtersEl.querySelectorAll(".filterItem")].forEach(n => n.remove());

      for (const c of CATEGORY_DEFS){
        const item = document.createElement("div");
        item.className = "filterItem" + (catOn[c.key] ? "" : " off");
        item.title = "Click to toggle";
        item.innerHTML = `<div class="swatch"></div><div>${c.label}</div>`;
        item.querySelector(".swatch").style.background = categoryColor(c.key);
        item.onclick = () => {
          catOn[c.key] = !catOn[c.key];
          renderFilters();
          renderTable();
        };
        filtersEl.insertBefore(item, filtersEl.querySelector(".filterHelp"));
      }
    }

    function renderTable(){
      const rows = normalisedEvents();
      eventsBody.innerHTML = "";

      if (!rows.length){
        eventsBody.innerHTML = `
          <tr>
            <td colspan="6" class="empty">No events match your current filters.</td>
          </tr>
        `;
        return;
      }

      for (const ev of rows){
        const tr = document.createElement("tr");

        const chip = `<span class="chip" style="background:${categoryColor(ev.category)}">${ev.categoryLabel || ev.category}</span>`;
        const tracked = ev.tracking || {};

        tr.innerHTML = `
          <td>
            <div><strong>${dateDisplay(ev.dateObj)}</strong></div>
            <div class="muted">${timeHM(ev.dateObj)}${ev.endTime ? ` to ${ev.endTime}` : ""}</div>
          </td>
          <td>
            <div class="ref">${ev.id}</div>
            <div><strong>${ev.title}</strong></div>
            <div class="muted">Host: ${ev.hostName || "Host"}</div>
          </td>
          <td>
            <div>${ev.where || "TBC"}</div>
          </td>
          <td>${chip}</td>
          <td>
            <div class="inlineList">
              <span class="miniBadge">${costText(ev)}</span>
              <span class="miniBadge">${bookingSummaryText(ev)}</span>
            </div>
            <div class="muted" style="margin-top:.35rem;">
              ${Number(tracked.waitlist_count || 0)} waitlist · ${Number(tracked.interested_count || 0)} interested
            </div>
          </td>
          <td class="actionCell">
          <a class="btn primary" href="events-details.html?v=HN_2&event_id=${encodeURIComponent(ev.backendId)}">More Info</a>  
          </td>
        `;

        eventsBody.appendChild(tr);
      }
    }

    async function loadEvents(){
      clearWarn();
      clearErr();
      showInfo("Loading events…");

      try{
        const data = await getJson(`${BACKEND_URL}/api/events`);
        EVENTS = Array.isArray(data.events) ? data.events : [];
        showInfo(`${EVENTS.length} event${EVENTS.length === 1 ? "" : "s"} loaded.`);
        renderFilters();
        renderTable();

        if (!EVENTS.length){
          showWarn("There are no events yet.");
        }
      }catch(err){
        EVENTS = [];
        renderFilters();
        renderTable();
        clearInfo();
        showErr(err.message || "Could not load events.");
      }
    }

    logoutBtn.addEventListener("click", () => {
      if (typeof window.scLogout === "function"){
        window.scLogout();
        return;
      }
      try{ localStorage.clear(); }catch{}
      try{ sessionStorage.clear(); }catch{}
      window.location.href = "index.html";
    });

    renderFilters();
    renderTable();
    loadEvents();
  </script>
</body>
</html>
