<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Information – The Sanctuary Club</title>

  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="styles-main.css?v=FINAL" />

  <style>
    .page-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 6rem 1.5rem 3rem;
    }

    h1 {
      color: #003366;
      margin-bottom: 0.5rem;
    }

    .page-intro {
      font-size: 0.95rem;
      color: #4b5f78;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    form {
      background: #eef4fb;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #003366;
    }

    input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .resident-block {
      border-top: 1px solid #cbdcf0;
      padding-top: 1.5rem;
      margin-top: 1.5rem;
    }

    .save-btn {
      margin-top: 1.5rem;
      padding: 0.7rem 2rem;
      border: none;
      border-radius: 999px;
      background: #8b5a2b;
      color: white;
      font-size: 1.05rem;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #a06830;
    }

    .status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #003366;
      display: none;
    }

    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      z-index: 1000;
    }

    .top-nav a {
      text-decoration: none;
      font-weight: 600;
      color: #003366;
    }
  </style>
</head>

<body>

<!-- TOP NAV -->
<div class="top-nav">
  <a href="notices.html">← Member Information</a>
  <a href="#" onclick="logout(); return false;">Logout</a>
</div>

<div class="page-wrap">

  <h1>Your Information</h1>
  <p class="page-intro">
    Enter your optional details for up to four residents.<br />
    If you need to change your membership number or have any difficulties,
    please contact the Club Admin.
  </p>

  <form id="your-info-form">

    <!-- MEMBERSHIP -->
    <div class="form-group">
      <label for="membership">Membership Number</label>
      <input id="membership" required placeholder="e.g. SM55 or SC12" />
    </div>

    <!-- RESIDENTS -->
    <div id="residents"></div>

    <button type="submit" class="save-btn">Save information</button>
    <div class="status" id="status-msg">Saved ✔</div>

  </form>
</div>

<script src="access.js"></script>
<script src="logout.js"></script>

<script>
  const MAX_RESIDENTS = 4;
  const residentsWrap = document.getElementById("residents");
  const form = document.getElementById("your-info-form");
  const membershipInput = document.getElementById("membership");
  const statusMsg = document.getElementById("status-msg");

  function residentBlock(index, data = {}) {
    return `
      <div class="resident-block">
        <h3>Resident ${index}</h3>

        <div class="form-group">
          <label>Name (optional)</label>
          <input data-field="name" value="${data.name || ""}">
        </div>

        <div class="form-group">
          <label>Email (optional)</label>
          <input data-field="email" type="email" value="${data.email || ""}">
        </div>

        <div class="form-group">
          <label>Mobile (optional)</label>
          <input data-field="mobile" type="tel" value="${data.mobile || ""}">
        </div>

        <div class="form-group">
          <label>Phone (optional)</label>
          <input data-field="phone" type="tel" value="${data.phone || ""}">
        </div>
      </div>
    `;
  }

  function renderResidents(data = []) {
    residentsWrap.innerHTML = "";
    for (let i = 1; i <= MAX_RESIDENTS; i++) {
      residentsWrap.insertAdjacentHTML(
        "beforeend",
        residentBlock(i, data[i - 1] || {})
      );
    }
  }

  function loadData(member) {
    const stored = localStorage.getItem("member-" + member);
    if (!stored) {
      renderResidents();
      return;
    }
    const parsed = JSON.parse(stored);
    renderResidents(parsed.residents || []);
  }

  membershipInput.addEventListener("blur", () => {
    const member = membershipInput.value.trim();
    if (member) loadData(member);
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const member = membershipInput.value.trim();
    if (!member) return;

    const residents = [];
    document.querySelectorAll(".resident-block").forEach(block => {
      const data = {};
      block.querySelectorAll("input").forEach(input => {
        data[input.dataset.field] = input.value.trim();
      });
      residents.push(data);
    });

    localStorage.setItem(
      "member-" + member,
      JSON.stringify({ residents })
    );

    statusMsg.style.display = "block";
    setTimeout(() => statusMsg.style.display = "none", 2000);
  });

  renderResidents();
</script>

</body>
</html>
