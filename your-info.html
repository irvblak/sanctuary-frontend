<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Information</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
      color: #222;
    }

    nav {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    .your-info-container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .intro-text {
      margin-bottom: 1.25rem;
      font-size: 1rem;
    }

    .intro-text .subtle {
      color: #666;
      font-size: 0.9rem;
    }

    .intro-text a {
      font-weight: 500;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      font-size: 1rem;
    }

    button {
      margin-top: 1.25rem;
      padding: 0.6rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      input, textarea {
        font-size: 16px;
      }

      .intro-text {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="members-directory.html">Members Directory →</a>
    <a href="logout.html">Log out</a>
  </nav>

  <main class="your-info-container">
    <h1>Your Information</h1>

    <div class="intro-text">
      <p>
        Enter as much information as you wish to share.<br>
        <span class="subtle">(You can change it at any time.)</span>
      </p>
      <p>
        See it in the
        <a href="members-directory.html">Members Directory →</a>
      </p>
    </div>

    <!-- Your existing form fields + JS go here -->
    <!-- Intentionally open / trust-based -->

  </main>
</body>
</html>
