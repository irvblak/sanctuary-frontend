<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Your Information</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Session gate -->
<script src="access.js"></script>

<!-- Logout handler -->
<script src="logout.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
  color: #222;
}

/* ---------- NAV ---------- */
nav {
  padding: 1rem 1.25rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav a {
  text-decoration: none;
  font-weight: 500;
  color: #005ea8;
}

/* ---------- MAIN ---------- */
main {
  max-width: 900px;
  margin: 0 auto 2rem;
  background: #fff;
  border-radius: 12px;
  padding: 1.5rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

h1 {
  margin-top: 0;
}

.intro-text {
  margin-bottom: 1rem;
}

/* ---------- TABLE ---------- */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 0.4rem;
  font-size: 0.9rem;
}

th {
  text-align: left;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 0.3rem;
  font-size: 0.9rem;
}

button {
  margin-top: 1rem;
  padding: 0.6rem 1.25rem;
  font-size: 1rem;
  cursor: pointer;
}

#savedMsg {
  margin-top: 0.75rem;
  color: #2a6f2a;
  display: none;
}

@media (max-width: 640px) {
  input { font-size: 16px; }
}
</style>
</head>

<body>

<nav>
  <div>
    <a href="index.html">Home</a> ·
    <a href="members-directory.html">Members</a>
  </div>
  <div>
    <span>Calendar</span> ·
    <a href="#" onclick="logout()">Logout</a>
  </div>
</nav>

<main>

<h1>Your Information</h1>

<div class="intro-text">
  Enter as much information as you wish to share.<br>
  <span style="color:#666;">(You can change it at any time.)</span>
</div>

<form id="infoForm">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Email</th>
      <th>Mobile</th>
      <th>Landline</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>1</td>
      <td><input data-i="0" data-f="name"></td>
      <td><input data-i="0" data-f="email"></td>
      <td><input data-i="0" data-f="mobile"></td>
      <td><input data-i="0" data-f="landline"></td>
    </tr>
    <tr>
      <td>2</td>
      <td><input data-i="1" data-f="name"></td>
      <td><input data-i="1" data-f="email"></td>
      <td><input data-i="1" data-f="mobile"></td>
      <td><input data-i="1" data-f="landline"></td>
    </tr>
    <tr>
      <td>3</td>
      <td><input data-i="2" data-f="name"></td>
      <td><input data-i="2" data-f="email"></td>
      <td><input data-i="2" data-f="mobile"></td>
      <td><input data-i="2" data-f="landline"></td>
    </tr>
    <tr>
      <td>4</td>
      <td><input data-i="3" data-f="name"></td>
      <td><input data-i="3" data-f="email"></td>
      <td><input data-i="3" data-f="mobile"></td>
      <td><input data-i="3" data-f="landline"></td>
    </tr>
  </tbody>
</table>

<button type="submit">Save</button>
<div id="savedMsg">Saved.</div>
</form>

</main>

<script>
const STORAGE_KEY = "sanctuaryMembers";
const memberId = sessionStorage.getItem("memberId");

/* HARD FAIL SAFE:
   If this page is ever opened without a session,
   return calmly to Home instead of showing alerts */
if (!memberId) {
  window.location.href = "index.html";
}

function loadData() {
  const members = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  const residents = members[memberId]?.residents || [];

  document.querySelectorAll("input").forEach(inp => {
    const i = inp.dataset.i;
    const f = inp.dataset.f;
    inp.value = residents[i]?.[f] || "";
  });
}

document.getElementById("infoForm").addEventListener("submit", e => {
  e.preventDefault();

  const members = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  const residents = [];

  for (let i = 0; i < 4; i++) {
    const r = {};
    ["name","email","mobile","landline"].forEach(f => {
      const v = document.querySelector(`input[data-i="${i}"][data-f="${f}"]`).value.trim();
      if (v) r[f] = v;
    });
    if (Object.keys(r).length) residents.push(r);
  }

  members[memberId] = { residents };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(members));

  const msg = document.getElementById("savedMsg");
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 2000);
});

loadData();
</script>

</body>
</html>
