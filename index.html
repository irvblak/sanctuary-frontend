<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css" />
</head>

<body>

<div class="hero-wrapper">

  <!-- LEFT PANEL -->
  <div class="hero-panel hero-panel-left">
    <h3>Welcome to The Sanctuary Club</h3>
    <p>
      A residents’ club for Sanctuary Mews and Sanctuary Court.
    </p>
  </div>

  <!-- HERO (CENTRE) -->
  <section class="hero">
    <div class="hero-overlay">

      <h1 class="hero-title">The Sanctuary Club</h1>

      <!-- ACTION BUTTONS -->
      <div class="hero-buttons">
        <button class="hero-button" type="button">What’s On</button>
        <button class="hero-button" type="button">Info</button>
      </div>

      <!-- FOOTER -->
      <footer class="site-footer">
        <p>© The Sanctuary Club. All rights reserved.</p>
      </footer>

    </div>
  </section>

  <!-- RIGHT PANEL -->
  <div class="hero-panel hero-panel-right">
    <p>
      <strong><em>
        See what’s on, join activities, and optionally share contact details
        so neighbours can reach you — or so you can reach them.
      </em></strong>
    </p>
  </div>

</div>

</body>
</html>
