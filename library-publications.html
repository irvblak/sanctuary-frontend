<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Library Publication | Sanctuary Club</title>

  <script src="access.js?v=LIBRARY_PUBLICATIONS_1"></script>
  <script src="library-publications-data.js?v=LIBRARY_PUBLICATIONS_1"></script>

  <style>
    :root {
      --blue: #31506b;
      --blue-dark: #243f56;
      --text: #263746;
      --muted: #667784;
      --line: #dce5eb;
      --soft: #f4f8fa;
      --warm: #fffaf1;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f6f8;
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 17px;
      line-height: 1.65;
    }

    .page-shell {
      width: min(920px, calc(100% - 32px));
      margin: 28px auto 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      color: var(--blue);
      font-size: 1.15rem;
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid #b8c8d3;
      border-radius: 999px;
      background: var(--white);
      color: var(--blue);
      font: inherit;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover,
    .button:focus {
      background: #edf4f7;
    }

    .publication {
      padding: 34px 42px 40px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 8px 28px rgba(36, 63, 86, 0.08);
    }

    .publication-header {
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 26px;
    }

    .publication h1 {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: clamp(1.8rem, 4vw, 2.45rem);
      line-height: 1.18;
    }

    .summary {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .publication-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 18px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .publication-body {
      max-width: 760px;
      margin: 0 auto;
    }

    .publication-body p {
      margin: 0 0 1.15rem;
    }

    .publication-body .lead {
      margin-bottom: 1.4rem;
      color: #334f63;
      font-size: 1.12rem;
      font-weight: 650;
      line-height: 1.65;
    }

    .publication-body h2 {
      margin: 2rem 0 0.7rem;
      color: var(--blue);
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .publication-body h3 {
      margin: 1.55rem 0 0.55rem;
      color: var(--blue);
      font-size: 1.12rem;
      line-height: 1.35;
    }

    .publication-body ul,
    .publication-body ol {
      margin: 0.5rem 0 1.25rem;
      padding-left: 1.6rem;
    }

    .publication-body li {
      margin: 0.35rem 0;
    }

    .publication-body .tip {
      margin: 1.5rem 0;
      padding: 15px 18px;
      border: 1px solid #d8cfaa;
      border-radius: 13px;
      background: var(--warm);
    }

    .publication-body .motto {
      margin: 2.2rem 0 0;
      padding: 20px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--blue);
      text-align: center;
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.6;
    }

    .missing {
      padding: 35px;
      border: 1px solid #e0c9c9;
      border-radius: 16px;
      background: #fffafa;
      text-align: center;
    }

    .missing h1 {
      margin-top: 0;
      color: var(--blue);
    }

    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
    }

    @media (max-width: 650px) {
      body {
        font-size: 16px;
      }

      .page-shell {
        width: min(100% - 20px, 920px);
        margin-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .publication {
        padding: 25px 20px 30px;
        border-radius: 14px;
      }
    }

    @media print {
      body {
        background: #ffffff;
        font-size: 11.5pt;
      }

      .page-shell {
        width: 100%;
        margin: 0;
      }

      .topbar,
      .footer-actions {
        display: none !important;
      }

      .publication {
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .publication-header {
        margin-bottom: 18px;
      }

      .publication-body {
        max-width: none;
      }

      .publication-body h2,
      .publication-body h3 {
        break-after: avoid;
      }

      .publication-body p,
      .publication-body li {
        orphans: 3;
        widows: 3;
      }
    }
  </style>
</head>

<body>

  <main class="page-shell">

    <div class="topbar">

      <div class="brand">
        Sanctuary Club Library
      </div>

      <div class="top-actions">

        <a
          class="button"
          href="library.html"
        >
          ← Library
        </a>

        <button
          class="button"
          id="printButton"
          type="button"
        >
          Print
        </button>

      </div>

    </div>


    <article
      class="publication"
      id="publication"
      hidden
    >

      <header class="publication-header">

        <h1 id="publicationTitle"></h1>

        <p
          class="summary"
          id="publicationSummary"
        ></p>

        <div
          class="publication-meta"
          id="publicationMeta"
        ></div>

      </header>

      <div
        class="publication-body"
        id="publicationBody"
      ></div>

    </article>


    <section
      class="missing"
      id="missingPublication"
      hidden
    >

      <h1>We can’t find that Library item</h1>

      <p>
        It may have been withdrawn, moved or the Library link
        may need updating.
      </p>

      <div class="footer-actions">

        <a
          class="button"
          href="library.html"
        >
          Return to Library
        </a>

      </div>

    </section>

  </main>


  <script>
    (function () {
      "use strict";

      const params =
        new URLSearchParams(
          window.location.search
        );

      const publicationId =
        String(
          params.get("id") || ""
        )
          .trim()
          .toLowerCase();

      const publications =
        window.SANCTUARY_LIBRARY_PUBLICATIONS ||
        {};

      const publication =
        publications[publicationId];

      const publicationElement =
        document.getElementById(
          "publication"
        );

      const missingElement =
        document.getElementById(
          "missingPublication"
        );

      const titleElement =
        document.getElementById(
          "publicationTitle"
        );

      const summaryElement =
        document.getElementById(
          "publicationSummary"
        );

      const metaElement =
        document.getElementById(
          "publicationMeta"
        );

      const bodyElement =
        document.getElementById(
          "publicationBody"
        );

      const printButton =
        document.getElementById(
          "printButton"
        );


      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }


      function showMissingPublication() {
        publicationElement.hidden = true;
        missingElement.hidden = false;
        printButton.hidden = true;

        document.title =
          "Library | Sanctuary Club";
      }


      function renderPublication(item) {
        if (!item) {
          showMissingPublication();
          return;
        }

        titleElement.textContent =
          item.title ||
          "Library Item";

        summaryElement.textContent =
          item.summary ||
          "";

        summaryElement.hidden =
          !item.summary;

        const meta = [];

        if (item.owner) {
          meta.push(
            `<span><strong>From:</strong> ${
              escapeHtml(item.owner)
            }</span>`
          );
        }

        if (item.updated) {
          meta.push(
            `<span><strong>Updated:</strong> ${
              escapeHtml(item.updated)
            }</span>`
          );
        }

        metaElement.innerHTML =
          meta.join("");

        metaElement.hidden =
          meta.length === 0;

        bodyElement.innerHTML =
          item.body ||
          "";

        publicationElement.hidden =
          false;

        missingElement.hidden =
          true;

        printButton.hidden =
          false;

        document.title =
          `${item.title || "Library"} | Sanctuary Club`;
      }


      printButton.addEventListener(
        "click",
        () => {
          window.print();
        }
      );


      renderPublication(
        publication
      );

    })();
  </script>

</body>
</html>
