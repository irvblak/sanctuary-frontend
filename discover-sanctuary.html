<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Discover Your Sanctuary Club</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7f2;color:#243d32;font:18px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#20583b}header{padding:30px 0}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.15;margin:0}header p{font-size:1.3rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.topic{display:flex;align-items:center;gap:15px;background:white;border:1px solid #c8dbcd;border-radius:16px;padding:20px;text-decoration:none;font-weight:700;min-height:100px}.topic:hover,.topic:focus-visible{background:#e1f0e4;outline:2px solid #37764e}.symbol{font-size:2rem}.visual{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 24px}.visual span{flex:1;min-width:180px;background:#e3eee3;border-radius:16px;text-align:center;padding:20px;font-size:2.6rem}</style></head><body><main><nav><a href="members-info.html">Members Hub</a><a href="library.html">Library</a></nav><header><h1>Discover the possibilities</h1><p>For your own enjoyment and the enjoyment of others.</p></header><div class="visual" aria-hidden="true"><span>🎨 📓 🖌️</span><span>☕ 💻 🤝</span></div><div class="grid" id="topics"></div><p id="status" role="status">Loading the Discover collection…</p></main><script>const icons=['🎨','📅','🎟️','✒️','🖼️','✉️','📍','🤝','📖','👥','🏠','⚙️','🛡️'];const root=document.getElementById('topics');Promise.all(icons.map(async(icon,i)=>{const id='discover-sanctuary-'+(i+1);try{const r=await fetch('https://sanctuary-backend-8iqc.onrender.com/api/library-publications/'+id);const d=await r.json();if(!r.ok||!d.publication)throw Error();const a=document.createElement('a');a.className='topic';a.href='library-publications.html?id='+id;const s=document.createElement('span');s.className='symbol';s.setAttribute('aria-hidden','true');s.textContent=icon;const t=document.createElement('span');t.textContent=d.publication.title;a.append(s,t);return a}catch{return null}})).then(items=>{items.filter(Boolean).forEach(a=>root.append(a));document.getElementById('status').textContent=items.every(Boolean)?'':'Some introductions are temporarily unavailable. Please try again shortly.'});</script></body></html>
