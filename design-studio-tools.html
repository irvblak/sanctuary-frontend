<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Design Studio Tools | Sanctuary Club</title><script src="access.js?v=YDS_TOOLS_2"></script><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#d9ecff,#f7fafc);color:#203747;font:500 18px/1.5 system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #d5e1eb;border-radius:20px;padding:26px;box-shadow:0 8px 24px #0001}h1{margin:0;color:#123a78}.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.2rem}button{min-height:54px;border:1px solid #123a78;border-radius:12px;background:#123a78;color:#fff;font:inherit;font-weight:800}.secondary{background:#fff;color:#123a78}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>Tools</h1><p>Choose what you want to do with the work currently open on your Canvas.</p><div class="grid"><button data-action="save-work">Save editable work</button><button data-action="open-work">Open editable work</button><button data-action="save-view">Save viewable copy</button><button data-action="print">Print</button><button class="secondary" id="backBtn">Back to Canvas</button></div></section></main><script>(()=>{const r=sessionStorage.getItem("sanctuaryYdsToolsReturnV1")||"design-studio-canvas.html";function go(a=""){if(a)sessionStorage.setItem("sanctuaryYdsToolsActionV1",a);else sessionStorage.removeItem("sanctuaryYdsToolsActionV1");if(window.opener&&!window.opener.closed){window.opener.location.href=r;window.close()}else location.replace(r)}document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>go(b.dataset.action));backBtn.onclick=()=>go()})();</script></body></html>
