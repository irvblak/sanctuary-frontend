<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events Calendar – The Sanctuary Club</title>

  <meta name="robots" content="noindex, nofollow">

  <!-- 🔒 ACCESS PROTECTION -->
  <script>
    (function () {
      if (sessionStorage.getItem("sanctuaryAccess") !== "granted") {
        window.location.replace("index.html");
      }
    })();
  </script>

  <style>
    /* ================================
       BASE
    ================================= */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f9ff;
      color: #003366;
    }

    /* ================================
       TOP NAV
    ================================= */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #f5f9ff;
      z-index: 10;
    }

    .top-nav a {
      text-decoration: none;
      font-weight: 600;
      color: #003366;
      margin-left: 1rem;
    }

    .nav-center {
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* ================================
       CALENDAR CONTAINER
    ================================= */
    .calendar-container {
      max-width: 900px;
      margin: 6rem auto 3rem;
      padding: 1rem;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .calendar-month-label {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .calendar-links {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin: 0.25rem 0 1rem;
      flex-wrap: wrap;
    }

    button,
    .link-button {
      background: #8b5a2b;
      color: white;
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: none;
      display: inline-block;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* ================================
       CALENDAR GRID
    ================================= */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid #cfd8e3;
      border-left: 1px solid #cfd8e3;
    }

    .weekday,
    .day {
      border-right: 1px solid #cfd8e3;
      border-bottom: 1px solid #cfd8e3;
      min-height: 90px;
      padding: 6px;
      box-sizing: border-box;
      position: relative;
    }

    .weekday {
      min-height: auto;
      font-weight: 700;
      text-align: center;
      background: #eef4fb;
      padding: 8px 0;
    }

    .day.empty {
      background: #fafcff;
    }

    .day-number {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }
