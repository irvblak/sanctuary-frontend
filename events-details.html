<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Notice | Sanctuary Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="access.js?v=PIN_GATE_1"></script>

  <style>
    :root{
      --ink:#24332d;
      --muted:#5f6f66;
      --line:#d8e2dc;
      --soft:#f4f8f5;
      --cream:#fffdf7;
      --accent:#2f6f4e;
      --warn:#8a5a00;
      --danger:#8a2e2e;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      background:#eef4f0;
      color:var(--ink);
      font-size:17px;
      line-height:1.55;
      font-weight:500;
    }

    .page-wrap{
      max-width:960px;
      margin:24px auto;
      padding:0 14px;
    }

    .notice-sheet{
      background:var(--cream);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      padding:22px 28px 20px;
    }

    .topline{
      text-align:center;
      letter-spacing:.08em;
      font-size:.86rem;
      font-weight:800;
      color:var(--accent);
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .notice-header{
      border-top:2px solid var(--accent);
      border-bottom:2px solid var(--accent);
      padding:14px 0 12px;
      margin-bottom:14px;
    }

    .header-grid{
      display:grid;
      grid-template-columns:1fr auto;
      gap:18px;
      align-items:center;
    }

    h1{
      margin:0;
      font-size:2rem;
      line-height:1.12;
      font-weight:800;
      color:var(--ink);
    }

    .event-ref-box{
      border:1px solid var(--accent);
      border-radius:10px;
      padding:8px 12px;
      min-width:130px;
      text-align:center;
      background:#f7fbf8;
    }

    .event-ref-label{
      display:block;
      font-size:.72rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:800;
      margin-bottom:2px;
    }

    .event-ref{
      display:block;
      font-size:1.18rem;
      font-weight:900;
      color:var(--accent);
    }

    .facts-row{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:8px;
      margin:12px 0 10px;
    }

    .fact{
      border:1px solid var(--line);
      background:var(--soft);
      border-radius:10px;
      padding:8px 10px;
      min-height:58px;
    }

    .fact-label{
      display:block;
      font-size:.74rem;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:var(--muted);
      font-weight:800;
      margin-bottom:2px;
    }

    .fact-value{
      font-size:.98rem;
      font-weight:800;
      color:var(--ink);
    }

    .status-strip{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      padding:9px 12px;
      margin:10px 0 14px;
      font-weight:800;
    }

    .status{
      color:var(--accent);
    }

    .status.closed{ color:var(--danger); }
    .status.warning{ color:var(--warn); }

    .poster-wrap{
      margin:12px 0 14px;
      text-align:center;
    }

    .poster-wrap img{
      max-width:100%;
      max-height:330px;
      object-fit:contain;
      border-radius:10px;
      border:1px solid var(--line);
      background:#fff;
    }

    .section{
      margin-top:12px;
      padding-top:10px;
      border-top:1px solid var(--line);
    }

    .section h2{
      margin:0 0 5px;
      font-size:1.08rem;
      color:var(--accent);
      font-weight:900;
    }

    .section p{
      margin:0 0 8px;
    }

    .notice-body{
      white-space:pre-wrap;
    }

    .booking-panel{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:8px;
      margin-top:8px;
    }

    .booking-item{
      background:#fff;
      border:1px solid var(--line);
      border-radius:10px;
      padding:7px 9px;
    }

    .booking-item span{
      display:block;
      font-size:.72rem;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:var(--muted);
      font-weight:800;
    }

    .booking-item strong{
      display:block;
      font-size:.95rem;
      color:var(--ink);
      margin-top:1px;
    }

    .button-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin-top:18px;
    }

    button,
    .button-link{
      appearance:none;
      border:0;
      border-radius:999px;
      background:var(--accent);
      color:#fff;
      padding:10px 18px;
      font-size:1rem;
      font-weight:800;
      text-decoration:none;
      cursor:pointer;
      font-family:inherit;
    }

    .secondary{
      background:#66756c;
    }

    .quiet{
      background:#dfe8e2;
      color:var(--ink);
    }

    .message{
      text-align:center;
      padding:28px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      font-weight:800;
    }

    @media (max-width:760px){
      .notice-sheet{
        padding:18px 16px;
      }

      .header-grid{
        grid-template-columns:1fr;
        text-align:center;
      }

      .facts-row,
      .booking-panel{
        grid-template-columns:1fr 1fr;
      }

      h1{
        font-size:1.65rem;
      }
    }

    @media print{
      @page{
        size:A4;
        margin:11mm;
      }

      body{
        background:#fff;
        font-size:12.2pt;
        line-height:1.35;
      }

      .page-wrap{
        max-width:none;
        margin:0;
        padding:0;
      }

      .notice-sheet{
        box-shadow:none;
        border:0;
        border-radius:0;
        padding:0;
      }

      .topline{
        font-size:9pt;
        margin-bottom:5px;
      }

      .notice-header{
        padding:8px 0 7px;
        margin-bottom:8px;
      }

      h1{
        font-size:21pt;
      }

      .event-ref-box{
        padding:5px 8px;
        min-width:105px;
      }

      .event-ref-label{
        font-size:7pt;
      }

      .event-ref{
        font-size:13pt;
      }

      .facts-row{
        gap:5px;
        margin:7px 0;
      }

      .fact{
        padding:5px 7px;
        min-height:0;
        border-radius:6px;
      }

      .fact-label{
        font-size:7pt;
      }

      .fact-value{
        font-size:10pt;
      }

      .status-strip{
        padding:6px 8px;
        margin:7px 0 8px;
        border-radius:6px;
      }

      .poster-wrap{
        margin:7px 0 8px;
      }

      .poster-wrap img{
        max-height:245px;
        border-radius:4px;
      }

      .section{
        margin-top:7px;
        padding-top:6px;
      }

      .section h2{
        font-size:12.5pt;
        margin-bottom:2px;
      }

      .section p{
        margin-bottom:5px;
      }

      .booking-panel{
        gap:5px;
      }

      .booking-item{
        padding:5px 6px;
        border-radius:6px;
      }

      .booking-item span{
        font-size:7pt;
      }

      .booking-item strong{
        font-size:10pt;
      }

      .button-row{
        display:none;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrap">
    <div id="loading" class="message">Loading notice…</div>

    <article id="notice" class="notice-sheet" hidden>
      <div class="topline">Sanctuary Club Notice</div>

      <header class="notice-header">
        <div class="header-grid">
          <div>
            <h1 id="eventTitle">Event title</h1>
          </div>

          <div class="event-ref-box">
            <span class="event-ref-label">Event Reference</span>
            <span id="eventRef" class="event-ref">EVT-0000</span>
          </div>
        </div>
      </header>

      <section class="facts-row">
        <div class="fact">
          <span class="fact-label">Date</span>
          <span id="eventDate" class="fact-value">—</span>
        </div>

        <div class="fact">
          <span class="fact-label">Time</span>
          <span id="eventTime" class="fact-value">—</span>
        </div>

        <div class="fact">
          <span class="fact-label">Venue</span>
          <span id="eventVenue" class="fact-value">—</span>
        </div>

        <div class="fact">
          <span class="fact-label">Host</span>
          <span id="eventHost" class="fact-value">—</span>
        </div>
      </section>

      <section class="status-strip">
        <span id="bookingStatus" class="status">Booking status</span>
        <span id="placesInfo">—</span>
      </section>

      <section id="posterWrap" class="poster-wrap" hidden>
        <img id="posterImg" alt="Event poster" />
      </section>

      <section id="summarySection" class="section" hidden>
        <h2>Summary</h2>
        <p id="eventSummary"></p>
      </section>

      <section id="bodySection" class="section" hidden>
        <h2>Notice</h2>
        <div id="eventBody" class="notice-body"></div>
      </section>

      <section class="section">
        <h2>Booking Information</h2>

        <div class="booking-panel">
          <div class="booking-item">
            <span>Members</span>
            <strong id="membersOpen">—</strong>
          </div>

          <div class="booking-item">
            <span>Guests</span>
            <strong id="guestsOpen">—</strong>
          </div>

          <div class="booking-item">
            <span>Booking closes</span>
            <strong id="bookingClose">—</strong>
          </div>

          <div class="booking-item">
            <span>Price</span>
            <strong id="eventPrice">—</strong>
          </div>
        </div>
      </section>

      <nav class="button-row">
        <a id="bookBtn" class="button-link" href="#">Book Now</a>
        <a class="button-link secondary" href="events.html">Back to Events Diary</a>
        <button class="quiet" type="button" onclick="window.print()">Print Notice</button>
      </nav>
    </article>
  </div>

  <script>
    const API_BASE = "https://sanctuary-backend-8iqc.onrender.com";

    const $ = id => document.getElementById(id);

    function getEventId(){
      const params = new URLSearchParams(window.location.search);
      return (
        params.get("event_id") ||
        params.get("id") ||
        params.get("ref") ||
        ""
      ).trim();
    }

    function clean(value, fallback = "—"){
      if(value === null || value === undefined) return fallback;
      const text = String(value).trim();
      return text || fallback;
    }

    function boolText(value){
      if(value === true || value === "true" || value === 1 || value === "1") return "Yes";
      if(value === false || value === "false" || value === 0 || value === "0") return "No";
      return "—";
    }

    function formatDate(value){
      if(!value) return "—";

      const d = new Date(value + "T00:00:00");
      if(Number.isNaN(d.getTime())) return clean(value);

      return d.toLocaleDateString("en-GB", {
        weekday:"short",
        day:"numeric",
        month:"short",
        year:"numeric"
      });
    }

    function formatShortDate(value){
      if(!value) return "—";

      const d = new Date(value);
      if(Number.isNaN(d.getTime())) return clean(value);

      return d.toLocaleDateString("en-GB", {
        day:"numeric",
        month:"short",
        year:"numeric"
      });
    }

    function formatTime(value){
      if(!value) return "";
      const parts = String(value).split(":");
      if(parts.length < 2) return value;

      let h = Number(parts[0]);
      const m = parts[1];
      if(Number.isNaN(h)) return value;

      const suffix = h >= 12 ? "pm" : "am";
      h = h % 12 || 12;
      return `${h}:${m} ${suffix}`;
    }

    function formatTimeRange(start, end){
      const s = formatTime(start);
      const e = formatTime(end);

      if(s && e) return `${s} – ${e}`;
      if(s) return s;
      return "—";
    }

    function money(value){
      if(value === null || value === undefined || value === "") return "Free / N/A";

      const n = Number(value);
      if(Number.isNaN(n)) return clean(value);
      if(n === 0) return "Free";

      return `£${n.toFixed(2)}`;
    }

    function pick(event, names, fallback = ""){
      for(const name of names){
        if(event[name] !== undefined && event[name] !== null && String(event[name]).trim() !== ""){
          return event[name];
        }
      }
      return fallback;
    }

    function calculateBookingStatus(event){
      const mode = clean(pick(event, ["booking_mode", "bookingMode"], ""), "");
      const closeValue = pick(event, ["booking_close", "bookingClose"], "");
      const capacity = Number(pick(event, ["capacity_total", "capacityTotal"], 0));
      const remaining = Number(pick(event, ["places_remaining", "placesRemaining", "remaining"], NaN));

      if(mode && mode.toLowerCase() === "none"){
        return { text:"No booking required", className:"warning" };
      }

      if(closeValue){
        const closeDate = new Date(closeValue);
        const now = new Date();
        if(!Number.isNaN(closeDate.getTime()) && now > closeDate){
          return { text:"Booking closed", className:"closed" };
        }
      }

      if(!Number.isNaN(remaining) && capacity > 0 && remaining <= 0){
        return { text:"Waiting list / full", className:"warning" };
      }

      return { text:"Booking open", className:"" };
    }

    async function fetchJson(url){
      const res = await fetch(url, { cache:"no-store" });
      if(!res.ok){
        throw new Error(`Request failed: ${res.status}`);
      }
      return await res.json();
    }

    async function loadNotice(){
      const eventId = getEventId();

      if(!eventId){
        $("loading").textContent = "No event reference was supplied.";
        return;
      }

      try{
        const event = await fetchJson(`${API_BASE}/api/events/${encodeURIComponent(eventId)}`);

        const title = pick(event, ["title", "event_title", "name"], "Untitled Event");
        const ref = pick(event, ["event_id", "id", "reference"], eventId);
        const poster = pick(event, ["poster_url", "posterUrl", "image_url", "imageUrl"], "");
        const summary = pick(event, ["summary", "short_description", "description"], "");
        const body = pick(event, ["body", "notice_body", "noticeBody", "details", "full_description"], "");

        $("eventTitle").textContent = clean(title, "Untitled Event");
        $("eventRef").textContent = clean(ref, eventId);

        $("eventDate").textContent = formatDate(pick(event, ["event_date", "eventDate", "date"], ""));
        $("eventTime").textContent = formatTimeRange(
          pick(event, ["start_time", "startTime"], ""),
          pick(event, ["end_time", "endTime"], "")
        );
        $("eventVenue").textContent = clean(pick(event, ["venue", "location"], ""));
        $("eventHost").textContent = clean(
          pick(event, ["host_name", "hostName", "host_resident_id", "hostResidentId", "host"], "")
        );

        const status = calculateBookingStatus(event);
        $("bookingStatus").textContent = status.text;
        $("bookingStatus").className = `status ${status.className}`;

        const remaining = pick(event, ["places_remaining", "placesRemaining", "remaining"], "");
        const capacity = pick(event, ["capacity_total", "capacityTotal"], "");

        if(remaining !== "" && capacity !== ""){
          $("placesInfo").textContent = `${remaining} of ${capacity} places remaining`;
        }else if(capacity !== ""){
          $("placesInfo").textContent = `${capacity} places`;
        }else{
          $("placesInfo").textContent = "";
        }

        if(poster){
          $("posterImg").src = poster;
          $("posterWrap").hidden = false;
        }

        if(summary){
          $("eventSummary").textContent = summary;
          $("summarySection").hidden = false;
        }

        if(body){
          $("eventBody").textContent = body;
          $("bodySection").hidden = false;
        }

        $("membersOpen").textContent = boolText(pick(event, ["members_open", "membersOpen"], ""));
        $("guestsOpen").textContent = boolText(pick(event, ["guests_open", "guestsOpen"], ""));
        $("bookingClose").textContent = formatShortDate(pick(event, ["booking_close", "bookingClose"], ""));
        $("eventPrice").textContent = money(pick(event, ["price", "cost", "member_price", "memberPrice"], ""));

        $("bookBtn").href = `event-booking.html?event_id=${encodeURIComponent(ref)}`;

        $("loading").hidden = true;
        $("notice").hidden = false;

      }catch(err){
        console.error(err);
        $("loading").textContent = "Sorry, this notice could not be loaded.";
      }
    }

    loadNotice();
  </script>
</body>
</html>
