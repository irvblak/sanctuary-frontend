<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Information – The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css" />
</head>

<body>

<div class="top-nav">
  <a href="index.html">Home</a>
  <span>Your Information</span>
  <a href="#" onclick="logout(); return false;">Logout</a>
</div>

<main style="max-width:720px;margin:0 auto;padding:2.5rem 1.5rem;">

  <h1>Your Information</h1>

  <p>
    Enter optional contact details for up to four residents.
    These details will appear in the Members Directory.
  </p>

  <form id="info-form">

    <div class="form-group">
      <label>Membership number (SMxx or SCxx)</label>
      <input id="membership" required placeholder="SM55" />
    </div>

    <hr />

    <div id="residents"></div>

    <button type="submit">Save information</button>

    <p id="status" style="margin-top:1rem;"></p>

  </form>

</main>

<script src="access.js"></script>
<script src="logout.js"></script>

<script>
const STORAGE_KEY = "sanctuaryMembers";
const residentsDiv = document.getElementById("residents");

// build resident fields
for (let i = 0; i < 4; i++) {
  residentsDiv.insertAdjacentHTML("beforeend", `
    <fieldset style="margin-bottom:1rem;">
      <legend>Resident ${i + 1}</legend>
      <input data-r="${i}" data-f="name" placeholder="Name" />
      <input data-r="${i}" data-f="email" placeholder="Email" />
      <input data-r="${i}" data-f="mobile" placeholder="Mobile" />
      ${i === 0 ? `<input data-r="${i}" data-f="landline" placeholder="Landline" />` : ""}
    </fieldset>
  `);
}

// load existing
document.getElementById("membership").addEventListener("blur", () => {
  const key = document.getElementById("membership").value.trim().toUpperCase();
  if (!key) return;

  const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  const data = all[key];
  if (!data) return;

  document.querySelectorAll("input[data-r]").forEach(inp => {
    const r = inp.dataset.r;
    const f = inp.dataset.f;
    inp.value = data.residents?.[r]?.[f] || "";
  });
});

// save
document.getElementById("info-form").addEventListener("submit", e => {
  e.preventDefault();

  const membership = document.getElementById("membership").value.trim().toUpperCase();
  if (!membership) return;

  const residents = [];
  document.querySelectorAll("input[data-r]").forEach(inp => {
    const r = inp.dataset.r;
    const f = inp.dataset.f;
    residents[r] ??= {};
    if (inp.value.trim()) residents[r][f] = inp.value.trim();
  });

  const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  all[membership] = { residents };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));

  document.getElementById("status").textContent = "Saved ✔";
});
</script>

</body>
</html>
