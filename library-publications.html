<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Library Publication | Sanctuary Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />

  <script src="access.js?v=LIB_1"></script>
  <script src="library-publications-data.js"></script>

  <style>
    :root{
      --bg1:#d9ecff;
      --bg2:#f4f8fc;
      --ink:#1f2a37;
      --muted:#52606f;
      --blue:#123a78;
      --blue-hover:#0f3166;
      --line:#d8e1ec;
      --soft:#f7fbff;
      --panel:#fff;
      --shadow:0 8px 24px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:18px;
      font-weight:500;
      line-height:1.55;
      color:var(--ink);
      background:linear-gradient(180deg,var(--bg1),var(--bg2) 45%,#fff 100%);
    }

    .topbar{
      max-width:940px;
      margin:0 auto;
      padding:1rem 1rem .45rem;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:.75rem;
      flex-wrap:wrap;
    }

    .brand{
      color:var(--blue);
      font-size:1.75rem;
      font-weight:850;
    }

    .actions{
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:.6rem .9rem;
      border:1px solid var(--blue);
      border-radius:12px;
      color:#fff;
      background:var(--blue);
      text-decoration:none;
      font:inherit;
      font-weight:800;
      cursor:pointer;
    }

    .btn.secondary{
      color:var(--blue);
      background:#fff;
      border-color:var(--line);
    }

    .btn:hover{
      background:var(--blue-hover);
      color:#fff;
    }

    .shell{
      max-width:940px;
      margin:0 auto;
      padding:0 1rem 2rem;
    }

    article{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:1.5rem 1.7rem;
    }

    .doc-kicker{
      display:flex;
      align-items:center;
      gap:.55rem;
      flex-wrap:wrap;
      margin-bottom:.45rem;
    }

    .np-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:2rem;
      height:2rem;
      padding:0 .5rem;
      border-radius:999px;
      font-size:.8rem;
      font-weight:900;
      color:#174f68;
      background:#e9f4f8;
      border:1px solid #bfdce7;
    }

    .doc-label{
      color:var(--muted);
      font-size:.85rem;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    h1{
      margin:.1rem 0 .35rem;
      color:var(--blue);
      font-size:2rem;
      line-height:1.15;
    }

    h2{
      margin:1.35rem 0 .4rem;
      color:var(--blue);
      font-size:1.25rem;
    }

    h3{
      margin:1rem 0 .25rem;
      color:#244962;
      font-size:1.03rem;
    }

    p{margin:.35rem 0 .7rem}

    ul,ol{
      margin:.35rem 0 .75rem 1.4rem;
      padding:0;
    }

    .summary{
      margin:.2rem 0 .65rem;
      color:var(--muted);
      font-size:1.04rem;
      line-height:1.5;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:.4rem 1rem;
      padding:.65rem 0 .9rem;
      margin-bottom:.9rem;
      border-bottom:1px solid var(--line);
      color:var(--muted);
      font-size:.84rem;
    }

    .lead{
      color:#344054;
      font-size:1.03rem;
    }

    .tip{
      margin:.9rem 0 1rem;
      padding:.75rem .9rem;
      border:1px solid #cfe0ed;
      border-radius:13px;
      background:var(--soft);
      color:#244962;
    }

    .motto{
      margin-top:1.4rem;
      padding-top:1rem;
      border-top:1px solid var(--line);
      color:var(--blue);
      font-weight:900;
      text-align:center;
    }

    .missing{
      padding:1rem;
      border:1px solid #ead49a;
      border-radius:13px;
      background:#fff8e6;
      color:#7a4c00;
      font-weight:750;
    }

    @media(max-width:620px){
      body{font-size:17px}
      article{padding:1.1rem 1rem}
      h1{font-size:1.7rem}
    }

    @media print{
      @page{size:A4 portrait;margin:15mm}

      body{
        background:#fff;
        font-size:12pt;
      }

      .topbar{
        display:none!important;
      }

      .shell{
        max-width:none;
        padding:0;
      }

      article{
        border:0;
        box-shadow:none;
        border-radius:0;
        padding:0;
      }

      h1{font-size:21pt}
      h2{font-size:14pt;break-after:avoid}
      h3{font-size:12pt;break-after:avoid}
      .tip{background:#fff}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brand">News &amp; Publications</div>

    <div class="actions">
      <a class="btn secondary" href="library.html">← Library</a>
      <button class="btn" id="printBtn" type="button">Print</button>
    </div>
  </div>

  <main class="shell">
    <article id="publication">
      <div class="missing">Loading publication…</div>
    </article>
  </main>

  <script>
    (function protectPublication(){
      const ttl = 8 * 60 * 60 * 1000;
      const granted = sessionStorage.getItem("sanctuaryAccess");
      const accessTime = Number(sessionStorage.getItem("sanctuaryAccessTime") || 0);

      const active =
        Boolean(granted) &&
        accessTime > 0 &&
        (Date.now() - accessTime) < ttl;

      if(!active){
        window.location.replace("members-info.html");
      }
    })();

    const params = new URLSearchParams(location.search);
    const id = params.get("id") || "";
    const item = window.SANCTUARY_LIBRARY_PUBLICATIONS?.[id];
    const root = document.getElementById("publication");

    if(!item){
      root.innerHTML = `
        <div class="missing">
          This Library publication could not be found.
        </div>
      `;
      document.getElementById("printBtn").disabled = true;
    }else{
      document.title = `${item.title} | Sanctuary Club`;

      root.innerHTML = `
        <div class="doc-kicker">
          <span class="np-badge">${item.type || "P"}</span>
          <span class="doc-label">${item.type === "N" ? "Notice" : "Publication"}</span>
        </div>

        <h1>${item.title}</h1>

        ${item.summary ? `<p class="summary">${item.summary}</p>` : ""}

        <div class="meta">
          ${item.updated ? `<span><strong>Last updated:</strong> ${item.updated}</span>` : ""}
          ${item.owner ? `<span><strong>Maintained by:</strong> ${item.owner}</span>` : ""}
        </div>

        <div class="publication-body">
          ${item.body || ""}
        </div>
      `;
    }

    document.getElementById("printBtn").addEventListener("click",()=>window.print());
  </script>
</body>
</html>
