<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <!-- NOTE:
       - DO NOT include admin-guard.js on this page.
       - DO NOT include access.js on this page.
       - This page performs BOTH checks:
         1) MemberId + PIN  (via /auth/login)
         2) Admin username + password (via /auth/admin-login)
  -->

  <link rel="stylesheet" href="styles-main.css?v=ADMIN_LOGIN_4" />

  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: linear-gradient(180deg,#e8f2ff 0%, #f2f7fb 45%, #ffffff 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
      color:#1f2a37;
    }
    .card{
      width:min(560px, 100%);
      background:#fff;
      border-radius:18px;
      box-shadow:0 10px 26px rgba(0,0,0,0.08);
      border:1px solid rgba(219,230,243,0.85);
      padding:18px 18px 16px;
    }
    h1{ margin:0 0 6px; color:#003366; font-size:1.35rem; }
    p{ margin:0 0 14px; color:#667085; line-height:1.45; }

    label{
      display:block;
      font-weight:800;
      font-size:.9rem;
      color:#425466;
      margin:0 0 6px;
    }
    input{
      width:100%;
      padding:.62rem .72rem;
      border-radius:12px;
      border:1px solid #cfd8e3;
      font-size:1rem;
      box-sizing:border-box;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .field{ flex:1; min-width:220px; }
    .hint{
      margin-top:8px;
      font-size:.9rem;
      color:#667085;
    }

    button{
      width:100%;
      margin-top:14px;
      padding:.75rem .9rem;
      border:0;
      border-radius:12px;
      background:#005ea8;
      color:#fff;
      font-weight:900;
      font-size:1rem;
      cursor:pointer;
    }
    button:disabled{ opacity:.55; cursor:not-allowed; }

    .msg{
      display:none;
      margin:10px 0 0;
      padding:10px 12px;
      border-radius:12px;
      font-weight:650;
      font-size:.95rem;
      line-height:1.35;
      border:1px solid transparent;
    }
    .warn{ background:#fff7ed; border-color:#fed7aa; color:#9a3412; }
    .ok{ background:#ecfdf3; border-color:#bbf7d0; color:#166534; }

    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:12px;
      font-size:.95rem;
      color:#6b7280;
    }
    .footer a{
      color:#005ea8;
      text-decoration:none;
      font-weight:700;
    }
    .footer a:hover{ text-decoration:underline; }
    .sep{
      margin:14px 0 10px;
      border-top:1px dashed rgba(0,0,0,0.12);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Admin Access</h1>
    <p>Step 1: Confirm you’re a resident (Member ID + PIN). Step 2: Sign in with your admin credentials.</p>

    <div id="warn" class="msg warn"></div>
    <div id="ok" class="msg ok"></div>

    <form id="form" autocomplete="off">
      <div class="row">
        <div class="field">
          <label for="memberId">Member ID</label>
          <input id="memberId" name="memberId" inputmode="text" placeholder="e.g. SM55" required />
        </div>
        <div class="field">
          <label for="pin">PIN</label>
          <input id="pin" name="pin" type="password" placeholder="Your members’ PIN" required />
        </div>
      </div>

      <div class="sep"></div>

      <div class="row">
        <div class="field">
          <label for="username">Admin username</label>
          <input id="username" name="username" inputmode="text" placeholder="e.g. primary" required />
        </div>
        <div class="field">
          <label for="password">Admin password</label>
          <input id="password" name="password" type="password" placeholder="Admin password" required />
        </div>
      </div>

      <button id="btn" type="submit">Sign in</button>
      <div class="hint">Tip: if sign-in fails repeatedly, wait a minute and try again (backend throttles repeated attempts).</div>
    </form>

    <div class="footer">
      <a href="index.html" aria-label="Back to Home">← Back</a>
      <span>Sanctuary Club</span>
    </div>
  </div>

  <script>
    (function(){
      const BACKEND = "https://sanctuary-backend-8iqc.onrender.com";
      const TOKEN_KEY = "adminToken";   // localStorage
      const MEMBER_TOKEN_KEY = "token"; // optional; you may already use this for member sessions

      const warnEl = document.getElementById("warn");
      const okEl = document.getElementById("ok");
      const btn = document.getElementById("btn");
      const form = document.getElementById("form");

      function show(el, msg){
        warnEl.style.display = "none";
        okEl.style.display = "none";
        if (!el) return;
        el.textContent = msg;
        el.style.display = "block";
      }

      function setBusy(isBusy){
        btn.disabled = isBusy;
        btn.textContent = isBusy ? "Signing in…" : "Sign in";
      }

      async function postJson(url, payload){
        const res = await fetch(url, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(payload)
        });
        const body = await res.json().catch(() => ({}));
        return {res, body};
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        show(null, "");
        setBusy(true);

        const memberId = (document.getElementById("memberId").value || "").trim();
        const pin      = (document.getElementById("pin").value || "").trim();
        const username = (document.getElementById("username").value || "").trim();
        const password = (document.getElementById("password").value || "");

        if (!memberId || !pin || !username || !password){
          setBusy(false);
          show(warnEl, "Please complete all fields.");
          return;
        }

        try{
          // 1) Member check (MemberId + PIN)
          const step1 = await postJson(`${BACKEND}/auth/login`, { memberId, pin });
          if (!step1.res.ok || !step1.body || step1.body.success !== true){
            setBusy(false);
            const msg = (step1.body && step1.body.message) ? step1.body.message : "Member check failed.";
            show(warnEl, `Member check failed: ${msg}`);
            return;
          }

          // Optional: store member token if you want to treat admin pages as also "member authenticated"
          if (step1.body.token){
            try { localStorage.setItem(MEMBER_TOKEN_KEY, step1.body.token); } catch(e){}
          }

          // 2) Admin check (username + password)
          const step2 = await postJson(`${BACKEND}/auth/admin-login`, { username, password });
          if (!step2.res.ok || !step2.body || step2.body.success !== true){
            setBusy(false);
            const msg = (step2.body && step2.body.message) ? step2.body.message : "Admin login failed.";
            show(warnEl, `Admin login failed: ${msg}`);
            return;
          }

          if (!step2.body.token){
            setBusy(false);
            show(warnEl, "Admin login failed: token missing from response.");
            return;
          }

          localStorage.setItem(TOKEN_KEY, step2.body.token);

          show(okEl, "Signed in. Redirecting…");
          setTimeout(() => { location.href = "admin-dashboard.html"; }, 250);

        } catch(err){
          console.error(err);
          setBusy(false);
          show(warnEl, "Network error. Please try again.");
        }
      });

      // If already signed in as admin, you may choose to go straight to dashboard.
      // Comment out if you prefer always entering credentials.
      try{
        const existing = localStorage.getItem(TOKEN_KEY);
        if (existing){
          // lightweight: just go to dashboard; admin-guard.js will verify token there
          // setTimeout(() => { location.href = "admin-dashboard.html"; }, 50);
        }
      } catch(e){}
    })();
  </script>
</body>
</html>
