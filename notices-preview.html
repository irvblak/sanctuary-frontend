
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notices & Publications | Sanctuary Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <script src="access.js?v=AC_1"></script>

  <style>
    :root{
      --bg1:#eaf4ff;
      --bg2:#f8fbff;
      --card:#ffffff;
      --ink:#1f2937;
      --muted:#526474;
      --line:#dbe6f0;
      --brand:#0f4c81;
      --brand2:#1d6ca8;
      --club:#6d28d9;
      --association:#8a5a00;
      --shadow:0 12px 28px rgba(15,76,129,.08);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,var(--bg1),var(--bg2) 42%,#fff 100%);
    }

    a{color:inherit;text-decoration:none}

    .page{
      max-width:1120px;
      margin:0 auto;
      padding:20px 16px 48px;
    }

    .topbar{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
    }

    .crumbs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      color:var(--muted);
      font-weight:650;
    }

    .crumbs a,.back-link{color:var(--brand);font-weight:800}

    .hero,.panel{
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
    }

    .hero{
      padding:24px 22px;
      margin-bottom:18px;
      background:linear-gradient(135deg,rgba(15,76,129,.10),rgba(255,255,255,.98));
    }

    .hero h1{
      margin:0 0 10px;
      color:var(--brand);
      font-size:clamp(2rem,3vw,2.55rem);
      line-height:1.12;
    }

    .hero p{
      margin:.45rem 0 0;
      color:#334155;
      font-size:1.06rem;
      font-weight:650;
      line-height:1.65;
    }

    .chooser{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      margin-bottom:18px;
    }

    .choice{
      border:1px solid #c9dced;
      background:#fff;
      color:var(--brand);
      border-radius:16px;
      padding:16px 18px;
      font:inherit;
      font-size:1.08rem;
      font-weight:850;
      cursor:pointer;
      text-align:left;
      box-shadow:0 6px 16px rgba(0,0,0,.05);
    }

    .choice small{
      display:block;
      margin-top:.25rem;
      color:var(--muted);
      font-size:.86rem;
      font-weight:650;
      line-height:1.45;
    }

    .choice.active{
      background:var(--brand);
      color:#fff;
      border-color:var(--brand);
    }

    .choice.active small{color:#e9f3fb}

    .panel{padding:22px}

    .section[hidden]{display:none}

    .section h2{
      margin:0 0 .4rem;
      color:var(--brand);
      font-size:1.5rem;
    }

    .section-intro{
      margin:0 0 1rem;
      color:#475b6c;
      font-size:1.03rem;
      font-weight:650;
      line-height:1.6;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:16px;
    }

    .card{
      border:1px solid var(--line);
      border-radius:17px;
      background:#fff;
      box-shadow:0 8px 18px rgba(15,76,129,.06);
      overflow:hidden;
    }

    .card-body{padding:18px}

    .badge{
      display:inline-flex;
      padding:6px 10px;
      border-radius:999px;
      font-size:.86rem;
      font-weight:850;
      margin-bottom:.7rem;
    }

    .badge.club{background:#f3e8ff;color:var(--club)}
    .badge.association{background:#fff4df;color:var(--association)}

    .card h3{
      margin:.15rem 0 .45rem;
      color:#123b62;
      font-size:1.2rem;
      line-height:1.3;
    }

    .card p{
      margin:.35rem 0;
      color:#334155;
      line-height:1.6;
      white-space:pre-wrap;
    }

    .meta{
      margin-top:.7rem;
      color:var(--muted);
      font-size:.92rem;
      font-weight:650;
    }

    .status{
      margin-top:1rem;
      padding:.75rem .85rem;
      border-radius:12px;
      background:#eef6ff;
      color:#0b4d87;
      border:1px solid rgba(15,76,129,.14);
      font-weight:700;
    }

    .status[hidden]{display:none}

    @media(max-width:680px){
      .chooser{grid-template-columns:1fr}
      .hero,.panel{padding:18px 15px}
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <div class="crumbs">
        <a href="members-info.html">Members Hub</a>
        <span>›</span>
        <a href="library.html">Library</a>
        <span>›</span>
        <span>Notices &amp; Publications</span>
      </div>
      <a class="back-link" href="library.html">← Back to Library</a>
    </div>

    <section class="hero">
      <h1>Notices &amp; Publications</h1>
      
    </section>

    <div class="chooser">
      <button class="choice active" id="clubBtn" type="button">
        Club Notices &amp; News
        <small>Useful Information, Guides &amp; Help, notices and Club news.</small>
      </button>

      <button class="choice" id="associationBtn" type="button">
        Residents Association
        <small>Residents Association information and publications.</small>
      </button>
    </div>

    <section class="panel">
      <div class="section" id="clubSection">
            <div class="cards" id="clubCards">
          <article class="card">
            <div class="card-body">
              <span class="badge club">Useful Information</span>
              <h3>Useful Information</h3>
            </div>
          </article>

          <article class="card">
            <div class="card-body">
              <span class="badge club">Guides &amp; Help</span>
          </div>
          </article>

          <article class="card">
            <div class="card-body">
              <span class="badge club">Notices &amp; News</span>
          </div>
          </article>
        </div>
      </div>

      <div class="section" id="associationSection" hidden>
        
        <div class="cards" id="associationCards">
          <article class="card">
            <div class="card-body">
              <span class="badge association">Residents Association</span>
              <h3>Residents Association</h3>
              <p>Residents Association publications will appear here.</p>
            </div>
          </article>
        </div>
      </div>

      <div class="status" id="statusBox" hidden></div>
    </section>
  </div>

  <script>
    (function(){
      "use strict";

      var clubBtn=document.getElementById("clubBtn");
      var associationBtn=document.getElementById("associationBtn");
      var clubSection=document.getElementById("clubSection");
      var associationSection=document.getElementById("associationSection");
      var clubCards=document.getElementById("clubCards");
      var associationCards=document.getElementById("associationCards");
      var statusBox=document.getElementById("statusBox");

      function escapeHtml(value){
        return String(value == null ? "" : value)
          .replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")
          .replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;")
          .replace(/'/g,"&#39;");
      }

      function showSection(which){
        var club=which==="club";
        clubSection.hidden=!club;
        associationSection.hidden=club;
        clubBtn.classList.toggle("active",club);
        associationBtn.classList.toggle("active",!club);
      }

      clubBtn.addEventListener("click",function(){showSection("club");});
      associationBtn.addEventListener("click",function(){showSection("association");});

      function renderCards(items,category,target){
        var filtered=items.filter(function(item){
          return item && item.category===category;
        });

        if(!filtered.length){return;}

        target.innerHTML=filtered.map(function(item){
          var badgeClass=category==="association" ? "association" : "club";
          var badgeText=category==="association"
            ? "Residents Association"
            : (item.section || "Club Notices & News");

          var author=item.author
            ? '<div class="meta">From: '+escapeHtml(item.author)+'</div>'
            : '';

          return '<article class="card"><div class="card-body">' +
            '<span class="badge '+badgeClass+'">'+escapeHtml(badgeText)+'</span>' +
            '<h3>'+escapeHtml(item.title || "Untitled publication")+'</h3>' +
            '<p>'+escapeHtml(item.body || "")+'</p>' +
            author +
            '</div></article>';
        }).join("");
      }

      fetch("notices-preview.json",{cache:"no-store"})
        .then(function(response){
          if(!response.ok){throw new Error("HTTP "+response.status);}
          return response.json();
        })
        .then(function(data){
          var items=(data && Array.isArray(data.notices)) ? data.notices : [];
          renderCards(items,"club",clubCards);
          renderCards(items,"association",associationCards);
        })
        .catch(function(error){
          console.error("Preview data could not be loaded:",error);
          statusBox.hidden=false;
          statusBox.textContent="The preview data could not be loaded, but the Notices & Publications sections are available.";
        });
    })();
  </script>
</body>
</html>
