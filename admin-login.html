<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <!-- NOTE:
       - DO NOT include admin-guard.js on this page.
       - DO NOT include access.js on this page.
       - Admin sign-in is admin-credential only.
  -->

  <link rel="stylesheet" href="styles-main.css?v=ADMIN_LOGIN_6" />

  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: linear-gradient(180deg,#e8f2ff 0%, #f2f7fb 45%, #ffffff 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
      color:#1f2a37;
    }
    .card{
      width:min(560px, 100%);
      background:#fff;
      border-radius:18px;
      box-shadow:0 10px 26px rgba(0,0,0,0.08);
      border:1px solid rgba(219,230,243,0.85);
      padding:18px 18px 16px;
    }
    h1{ margin:0 0 6px; color:#003366; font-size:1.35rem; }
    p{ margin:0 0 14px; color:#667085; line-height:1.45; }

    label{
      display:block;
      font-weight:800;
      font-size:.9rem;
      color:#425466;
      margin:0 0 6px;
    }
    input{
      width:100%;
      padding:.62rem .72rem;
      border-radius:12px;
      border:1px solid #cfd8e3;
      font-size:1rem;
      box-sizing:border-box;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .field{ flex:1; min-width:220px; }

    .password-wrap{
      position:relative;
    }
    .password-wrap input{
      padding-right:3rem;
    }
    .toggle-eye{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:transparent;
      cursor:pointer;
      padding:4px 6px;
      margin:0;
      width:auto;
      color:#5b6b7b;
      font-size:1.1rem;
      line-height:1;
    }
    .toggle-eye:hover{
      color:#003366;
    }
    .toggle-eye:focus{
      outline:2px solid #93c5fd;
      outline-offset:2px;
      border-radius:8px;
    }

    button{
      width:100%;
      margin-top:14px;
      padding:.75rem .9rem;
      border:0;
      border-radius:12px;
      background:#005ea8;
      color:#fff;
      font-weight:900;
      font-size:1rem;
      cursor:pointer;
    }
    button:disabled{ opacity:.55; cursor:not-allowed; }

    .msg{
      display:none;
      margin:10px 0 0;
      padding:10px 12px;
      border-radius:12px;
      font-weight:650;
      font-size:.95rem;
      line-height:1.35;
      border:1px solid transparent;
    }
    .warn{ background:#fff7ed; border-color:#fed7aa; color:#9a3412; }
    .ok{ background:#ecfdf3; border-color:#bbf7d0; color:#166534; }

    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:12px;
      font-size:.95rem;
      color:#6b7280;
    }
    .footer a{
      color:#005ea8;
      text-decoration:none;
      font-weight:700;
    }
    .footer a:hover{ text-decoration:underline; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Admin Access</h1>
    <p>Sign in with your admin username and password.</p>

    <div id="warn" class="msg warn"></div>
    <div id="ok" class="msg ok"></div>

    <form id="form" autocomplete="off">
      <div class="row">
        <div class="field">
          <label for="username">Admin username</label>
          <input id="username" name="username" inputmode="text" placeholder="e.g. primary" required />
        </div>

        <div class="field">
          <label for="password">Admin password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="Admin password" required />
            <button
              id="togglePassword"
              class="toggle-eye"
              type="button"
              aria-label="Show password"
              aria-pressed="false"
              title="Show password"
            >👁</button>
          </div>
        </div>
      </div>

      <button id="btn" type="submit">Sign in</button>
    </form>

    <div class="footer">
      <a href="index.html" aria-label="Back to Home">← Back</a>
      <span>Sanctuary Club</span>
    </div>
  </div>

  <script>
    (function(){
      const BACKEND = "https://sanctuary-backend-8iqc.onrender.com";
      const TOKEN_KEY = "adminToken";

      const warnEl = document.getElementById("warn");
      const okEl = document.getElementById("ok");
      const btn = document.getElementById("btn");
      const form = document.getElementById("form");
      const passwordEl = document.getElementById("password");
      const togglePasswordBtn = document.getElementById("togglePassword");

      function show(el, msg){
        warnEl.style.display = "none";
        okEl.style.display = "none";
        if (!el) return;
        el.textContent = msg;
        el.style.display = "block";
      }

      function setBusy(isBusy){
        btn.disabled = isBusy;
        btn.textContent = isBusy ? "Signing in…" : "Sign in";
      }

      function setPasswordVisibility(showPassword){
        passwordEl.type = showPassword ? "text" : "password";
        togglePasswordBtn.textContent = showPassword ? "🙈" : "👁";
        togglePasswordBtn.setAttribute("aria-label", showPassword ? "Hide password" : "Show password");
        togglePasswordBtn.setAttribute("title", showPassword ? "Hide password" : "Show password");
        togglePasswordBtn.setAttribute("aria-pressed", showPassword ? "true" : "false");
      }

      async function postJson(url, payload){
        const res = await fetch(url, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(payload)
        });
        const body = await res.json().catch(() => ({}));
        return {res, body};
      }

      togglePasswordBtn.addEventListener("click", () => {
        const showing = passwordEl.type === "text";
        setPasswordVisibility(!showing);
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        show(null, "");
        setBusy(true);

        const username = (document.getElementById("username").value || "").trim();
        const password = (passwordEl.value || "");

        if (!username || !password){
          setBusy(false);
          show(warnEl, "Please complete all fields.");
          return;
        }

        try{
          const step = await postJson(`${BACKEND}/auth/admin-login`, { username, password });

          if (!step.res.ok || !step.body || step.body.success !== true){
            setBusy(false);
            const msg = (step.body && step.body.message) ? step.body.message : "Admin login failed.";
            show(warnEl, `Admin login failed: ${msg}`);
            return;
          }

          if (!step.body.token){
            setBusy(false);
            show(warnEl, "Admin login failed: token missing from response.");
            return;
          }

          localStorage.setItem(TOKEN_KEY, step.body.token);
          show(okEl, "Signed in. Redirecting…");
          setTimeout(() => { location.href = "admin-dashboard.html"; }, 250);

        } catch(err){
          console.error(err);
          setBusy(false);
          show(warnEl, "Network error. Please try again.");
        }
      });

      setPasswordVisibility(false);
    })();
  </script>
</body>
</html>
