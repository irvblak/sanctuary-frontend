<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css?v=TRUST_GATE" />
</head>

<body>

<div class="hero-wrapper">

  <!-- LEFT PANEL -->
  <div class="hero-panel">
    <h3>Welcome to The Sanctuary Club</h3>
    <p>A residents’ club for Sanctuary Mews and Sanctuary Court.</p>
  </div>

  <!-- HERO (CENTRE) -->
  <section class="hero">
    <div class="hero-overlay">

      <h1 class="hero-title">The Sanctuary Club</h1>

      <div class="action-stack">

        <!-- ACCESS GATE -->
        <div id="access-gate">
          <div class="access-input-wrapper">
            <input
              type="password"
              id="access-code-input"
              placeholder="Access code"
              autocomplete="off"
            />
            <button
              type="button"
              id="access-eye"
              class="toggle-visibility"
              aria-label="Show access code"
            >👁</button>
          </div>

          <button id="access-submit" class="hero-button">
            Continue
          </button>
        </div>

        <!-- MEMBER ACTIONS -->
        <div class="hero-buttons" id="member-actions" style="display:none;">
          <button
            class="hero-button"
            onclick="location.href='events.html'"
          >
            What’s On
          </button>

          <button
            class="hero-button"
            onclick="location.href='members-directory.html'"
          >
            Member Information
          </button>
        </div>

      </div>

      <footer class="site-footer">
        <p>© The Sanctuary Club. All rights reserved.</p>
      </footer>

    </div>
  </section>

  <!-- RIGHT PANEL -->
  <div class="hero-panel" style="position: relative;">

    <a
      href="#"
      id="logout-link"
      style="
        position: absolute;
        top: 0;
        right: 0;
        font-size: 0.85rem;
        text-decoration: underline;
        cursor: pointer;
        display: none;
      "
    >
      Logout
    </a>

    <p>
      <strong><em>
        See what’s on, join activities, and optionally share contact details
        so neighbours can reach you — or so you can reach them.
      </em></strong>
    </p>

  </div>

</div>

<script>
  const ACCESS_KEY = "sanctuaryAccess";
  const TIME_KEY = "sanctuaryAccessTime";
  const SESSION_DURATION = 60 * 60 * 1000;

  const gate = document.getElementById("access-gate");
  const actions = document.getElementById("member-actions");
  const logoutLink = document.getElementById("logout-link");

  function showMembers() {
    gate.style.display = "none";
    actions.style.display = "flex";
    logoutLink.style.display = "inline";
  }

  function showGate() {
    gate.style.display = "block";
    actions.style.display = "none";
    logoutLink.style.display = "none";
  }

  function hasValidSession() {
    const granted = sessionStorage.getItem(ACCESS_KEY) === "granted";
    const time = Number(sessionStorage.getItem(TIME_KEY));
    return granted && Date.now() - time < SESSION_DURATION;
  }

  // Initial state
  if (hasValidSession()) {
    showMembers();
  } else {
    showGate();
  }

  // Continue (trust-based: any input grants access)
  document.getElementById("access-submit").onclick = () => {
    const value = document.getElementById("access-code-input").value.trim();
    if (!value) return;

    sessionStorage.setItem(ACCESS_KEY, "granted");
    sessionStorage.setItem(TIME_KEY, Date.now());
    showMembers();
  };

  // Eye toggle
  document.getElementById("access-eye").onclick = () => {
    const input = document.getElementById("access-code-input");
    input.type = input.type === "password" ? "text" : "password";
  };

  // Logout
  logoutLink.onclick = () => {
    sessionStorage.clear();
    showGate();
  };
</script>

</body>
</html>
