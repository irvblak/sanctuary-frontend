<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Information – The Sanctuary Club</title>

  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="styles-main.css" />

  <style>
    /* =========================================================
       TOP NAV (FIXED LAYOUT)
       ========================================================= */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #ffffff;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 0 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      z-index: 1000;
    }

    .top-nav a {
      text-decoration: none;
      font-weight: 600;
      color: #003366;
    }

    .top-nav .nav-center {
      text-align: center;
      font-weight: 700;
      color: #003366;
    }

    /* =========================================================
       MEMBER INFO PAGE
       ========================================================= */
    .member-info-page {
      min-height: 100vh;
      background: linear-gradient(
        to bottom,
        #8bbce8 0%,
        #cfe6fb 35%,
        #ffffff 75%
      );
      padding-top: 5.5rem;
    }

    .member-info-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
      text-align: center;
    }

    .member-info-container h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #003366;
    }

    .member-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .member-menu a {
      display: block;
      width: 9cm;
      max-width: 90%;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      background: white;
      text-decoration: none;
      color: #003366;
      font-size: 1.05rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      text-align: center;
    }

    .member-menu a:hover {
      background: #eef4fb;
    }

    .menu-note {
      width: 9cm;
      max-width: 90%;
      font-size: 0.85rem;
      color: #4b5f78;
      margin-top: -0.3rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- Top navigation -->
  <div class="top-nav">
    <a href="index.html">Home</a>

    <div class="nav-center">
      <a href="events-calendar.html">Calendar</a>
    </div>

    <a href="#" id="logout-link">Logout</a>
  </div>

  <main class="member-info-page">
    <div class="member-info-container">
      <h1>Member Information</h1>

      <div class="member-menu">

        <a href="your-info.html">👤 Your Info</a>
        <div class="menu-note">
          Add or update your contact details (optional but helpful)
        </div>

        <a href="members-info.html">👥 Members Info</a>
        <div class="menu-note">
          View shared contact details of other members
        </div>

        <a href="notices-board.html">📣 Notices</a>
        <div class="menu-note">
          Important updates and announcements
        </div>

        <a href="events.html">📅 Host an Event</a>
        <div class="menu-note">
          Create and manage your own activities or events
        </div>

        <a href="payments.html">💷 Payments</a>

      </div>
    </div>
  </main>

  <script src="access.js"></script>
<a href="#" onclick="logout(); return false;">Logout</a>
</body>
</html>
