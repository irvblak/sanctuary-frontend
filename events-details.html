<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Host Notice | Sanctuary Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />

  <script src="access.js?v=AC_1"></script>

  <style>
    :root{
      --bg1:#eef6ff;
      --bg2:#f8fbff;
      --card:#ffffff;
      --ink:#1f2937;
      --muted:#667085;
      --line:#d9e5f0;
      --brand:#0f4c81;
      --brand2:#1d6ca8;
      --shadow:0 14px 34px rgba(15,76,129,0.10);
      --radius:24px;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      padding:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, #ffffff 100%);
      min-height:100%;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .page{
      max-width:1220px;
      margin:0 auto;
      padding:20px 16px 52px;
    }

    .topbar{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }

    .crumbs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      color:var(--muted);
      font-size:0.96rem;
    }

    .crumbs a{
      color:var(--brand);
      font-weight:700;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--brand);
      font-weight:700;
      font-size:0.95rem;
    }

    .status{
      margin:0 0 14px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid #deebf5;
      background:#f7fbff;
      color:#466074;
      font-size:0.95rem;
      font-weight:700;
    }

    .hidden{ display:none !important; }

    .poster{
      width:100%;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:30px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .poster-image-wrap{
      background:#edf4fa;
      min-height:220px;
      position:relative;
    }

    .poster-image{
      width:100%;
      display:block;
      object-fit:cover;
      max-height:420px;
      background:#edf4fa;
    }

    .poster-main{
      padding:24px 22px 24px;
      background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,251,255,0.98));
    }

    .poster-head{
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      gap:18px;
      align-items:start;
      margin-bottom:18px;
    }

    .badge-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      margin-bottom:12px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:6px 11px;
      border-radius:999px;
      font-size:0.82rem;
      font-weight:800;
      letter-spacing:0.01em;
    }

    .badge.notice{
      background:#e8f2fb;
      color:#0f4c81;
    }

    .badge.category{
      background:#eefaf3;
      color:#117a46;
    }

    .poster-title{
      margin:0;
      font-size:clamp(2rem, 4vw, 3.2rem);
      line-height:1.04;
      color:var(--brand);
      letter-spacing:-0.02em;
      word-break:break-word;
    }

    .booking-btn{
      appearance:none;
      border:none;
      border-radius:18px;
      background:var(--brand);
      color:#fff;
      font:inherit;
      font-weight:800;
      font-size:1.02rem;
      min-height:58px;
      padding:14px 22px;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(15,76,129,0.20);
      white-space:nowrap;
      align-self:start;
    }

    .booking-btn:hover{
      background:var(--brand2);
    }

    .facts-strip{
      display:grid;
      grid-template-columns:repeat(5, minmax(0, 1fr));
      gap:10px;
      margin-bottom:22px;
    }

    .fact{
      padding:12px 13px;
      border:1px solid #e1ebf3;
      border-radius:16px;
      background:#fbfdff;
      min-width:0;
    }

    .fact-label{
      margin:0 0 4px;
      color:var(--muted);
      font-size:0.78rem;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.03em;
    }

    .fact-value{
      margin:0;
      color:#213547;
      font-size:0.98rem;
      line-height:1.4;
      font-weight:600;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .notice-wrap{
      min-height:260px;
      padding:20px 18px;
      border:1px solid #e1ebf3;
      border-radius:22px;
      background:#ffffff;
    }

    .notice-summary{
      margin:0 0 16px;
      color:#334155;
      font-size:1.08rem;
      line-height:1.7;
      white-space:pre-wrap;
    }

    .notice-body{
      color:#2b3d4f;
      font-size:1rem;
      line-height:1.82;
    }

    .notice-body p{
      margin:0 0 1em;
    }

    .notice-body p:last-child{
      margin-bottom:0;
    }

    .notice-body ul,
    .notice-body ol{
      margin:0 0 1em 1.25em;
      padding:0;
    }

    .notice-body li{
      margin:0 0 .45em;
    }

    .poster-footer{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:18px;
    }

    .footer-links{
      display:flex;
      flex-wrap:wrap;
      gap:10px 14px;
      align-items:center;
    }

    .footer-link{
      color:var(--brand);
      font-weight:700;
      font-size:0.95rem;
    }

    .empty-state{
      padding:18px;
      border:1px dashed #c8d9e7;
      border-radius:16px;
      background:#fbfdff;
      color:#526474;
      line-height:1.55;
    }

    @media (max-width: 980px){
      .poster-head{
        grid-template-columns:1fr;
      }

      .booking-btn{
        width:100%;
      }

      .facts-strip{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px){
      .page{
        padding:16px 12px 36px;
      }

      .poster-main{
        padding:16px 14px 18px;
      }

      .facts-strip{
        grid-template-columns:1fr;
      }

      .poster-title{
        font-size:clamp(1.8rem, 8vw, 2.4rem);
      }

      .notice-wrap{
        padding:16px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="crumbs">
        <a href="events.html">Events Diary</a>
        <span>›</span>
        <span>Host Notice</span>
      </div>

      <a class="back-link" href="events.html">← Back to Events Diary</a>
    </div>

    <div id="status" class="status">Loading Host Notice...</div>

    <main id="app" class="hidden">
      <section class="poster">
        <div id="posterImageWrap" class="poster-image-wrap hidden">
          <img id="posterImage" class="poster-image" src="" alt="" />
        </div>

        <div class="poster-main">
          <div class="poster-head">
            <div>
              <div class="badge-row">
                <span class="badge notice">Host Notice</span>
                <span id="categoryBadge" class="badge category hidden"></span>
              </div>

              <h1 id="title" class="poster-title">Event</h1>
            </div>

            <button id="bookingBtn" class="booking-btn" type="button">
              Book or register your interest
            </button>
          </div>

          <div class="facts-strip">
            <div class="fact">
              <p class="fact-label">Date</p>
              <p id="dateValue" class="fact-value">—</p>
            </div>

            <div class="fact">
              <p class="fact-label">Time</p>
              <p id="timeValue" class="fact-value">—</p>
            </div>

            <div class="fact">
              <p class="fact-label">Location</p>
              <p id="locationValue" class="fact-value">—</p>
            </div>

            <div class="fact">
              <p class="fact-label">Host</p>
              <p id="hostValue" class="fact-value">—</p>
            </div>

            <div class="fact">
              <p class="fact-label">Availability</p>
              <p id="availabilityValue" class="fact-value">—</p>
            </div>
          </div>

          <div class="notice-wrap">
            <p id="summary" class="notice-summary hidden"></p>
            <div id="body" class="notice-body"></div>
          </div>

          <div class="poster-footer">
            <div class="footer-links">
              <a class="footer-link" href="events-calendar.html">View Calendar</a>
              <a class="footer-link" href="events.html">Return to Events Diary</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="errorBox" class="empty-state hidden"></div>
  </div>

  <script>
    (function(){
      const CONFIG = {
        BACKEND_URL:
          (window.SanctuaryConfig && window.SanctuaryConfig.BACKEND_URL) ||
          "https://sanctuary-backend-8iqc.onrender.com"
      };

      const statusEl = document.getElementById("status");
      const appEl = document.getElementById("app");
      const errorBox = document.getElementById("errorBox");

      const posterImageWrap = document.getElementById("posterImageWrap");
      const posterImage = document.getElementById("posterImage");
      const categoryBadge = document.getElementById("categoryBadge");

      const titleEl = document.getElementById("title");
      const summaryEl = document.getElementById("summary");
      const bodyEl = document.getElementById("body");

      const dateValueEl = document.getElementById("dateValue");
      const timeValueEl = document.getElementById("timeValue");
      const locationValueEl = document.getElementById("locationValue");
      const hostValueEl = document.getElementById("hostValue");
      const availabilityValueEl = document.getElementById("availabilityValue");

      const bookingBtn = document.getElementById("bookingBtn");

      function getQueryParam(name){
        const params = new URLSearchParams(window.location.search);
        return params.get(name) || "";
      }

      function escapeHtml(value){
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function nl2p(text){
        const cleaned = String(text || "").trim();
        if(!cleaned) return "";
        const safe = escapeHtml(cleaned);
        return safe
          .split(/\n{2,}/)
          .map(block => `<p>${block.replace(/\n/g, "<br>")}</p>`)
          .join("");
      }

      function maybeHtmlContent(value){
        const raw = String(value || "").trim();
        if(!raw) return "";
        const looksLikeHtml = /<\/?[a-z][\s\S]*>/i.test(raw);
        if(looksLikeHtml) return raw;
        return nl2p(raw);
      }

      function normalisePayload(payload){
        if(payload && typeof payload === "object"){
          if(payload.event && typeof payload.event === "object") return payload.event;
          if(payload.data && typeof payload.data === "object") return payload.data;
        }
        return payload || {};
      }

      function isScalarUsable(value){
        if(value === undefined || value === null) return false;
        if(Array.isArray(value)) return value.length > 0;
        if(typeof value === "object") return false;
        return String(value).trim() !== "";
      }

      function getField(obj, names, fallback=""){
        for(const name of names){
          if(obj && isScalarUsable(obj[name])){
            return obj[name];
          }
        }
        return fallback;
      }

      function getNumberField(obj, names, fallback=null){
        for(const name of names){
          if(!obj) continue;
          const value = obj[name];
          if(value === undefined || value === null || value === "") continue;
          const n = Number(value);
          if(Number.isFinite(n)) return n;
        }
        return fallback;
      }

      function formatDate(value){
        if(!value) return "To be confirmed";
        const text = String(value).trim();
        const match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if(match){
          const d = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12, 0, 0, 0);
          if(!Number.isNaN(d.getTime())){
            return d.toLocaleDateString("en-GB", {
              weekday:"long",
              day:"numeric",
              month:"long",
              year:"numeric"
            });
          }
        }
        try{
          const d = new Date(text);
          if(!Number.isNaN(d.getTime())){
            return d.toLocaleDateString("en-GB", {
              weekday:"long",
              day:"numeric",
              month:"long",
              year:"numeric"
            });
          }
        }catch{}
        return text;
      }

      function formatTime(value, dateTimeValue, endTimeValue){
        const startText = String(value || "").trim();
        const endText = String(endTimeValue || "").trim();

        if(startText){
          return endText ? `${startText} – ${endText}` : startText;
        }

        if(dateTimeValue){
          try{
            const d = new Date(String(dateTimeValue));
            if(!Number.isNaN(d.getTime())){
              const t = d.toLocaleTimeString("en-GB", {
                hour:"2-digit",
                minute:"2-digit"
              });
              return endText ? `${t} – ${endText}` : t;
            }
          }catch{}
        }

        return "To be confirmed";
      }

      function getAvailabilityText(evt){
        const tracking = evt.tracking || {};
        const remaining = getNumberField(tracking, ["places_remaining"], null);
        const capacity = getNumberField(evt, ["capacity_total", "capacity", "max_places", "max_attendees"], null);
        const bookingMode = String(getField(evt, ["booking_mode", "response_mode"], "")).toLowerCase();

        if(remaining !== null){
          if(remaining <= 0){
            return bookingMode.includes("interest")
              ? "Register interest only"
              : "Currently full";
          }
          return `${remaining} place${remaining === 1 ? "" : "s"} remaining`;
        }

        if(capacity !== null){
          return `${capacity} place${capacity === 1 ? "" : "s"}`;
        }

        if(bookingMode === "interest") return "Register interest";
        if(bookingMode === "booking_or_interest") return "Book or register interest";

        return "See booking form";
      }

      function setText(el, value, fallback){
        el.textContent = String(value || "").trim() || fallback;
      }

      function normaliseMedia(value){
        const candidates = [];

        if(Array.isArray(value)){
          for(const item of value){
            candidates.push(String(item || "").trim());
          }
        }else if(typeof value === "string"){
          candidates.push(value.trim());
        }

        for(const raw of candidates){
          if(!raw) continue;

          const directValue = raw.trim();

          if(
            /^(https?:\/\/\S+)$/i.test(directValue) ||
            /^images\/banners\/[^\s]+$/i.test(directValue) ||
            /^\.\.\/images\/banners\/[^\s]+$/i.test(directValue) ||
            /^\/images\/banners\/[^\s]+$/i.test(directValue)
          ){
            if(/\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(directValue) || /image/i.test(directValue)){
              return directValue;
            }
          }

          const match = directValue.match(/https?:\/\/\S+/i);
          const url = match ? match[0] : "";
          if(!url) continue;

          if(/\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(url) || /image/i.test(url)){
            return url;
          }

          return url;
        }

        return "";
      }

      function cleanSummaryText(value){
        const text = String(value || "").trim();
        if(!text) return "";
        return text;
      }

      async function loadEvent(){
        const eventId = getQueryParam("event_id");

        if(!eventId){
          showError("No event reference was provided.");
          return;
        }

        bookingBtn.onclick = function(){
          window.location.href = `event-booking.html?event_id=${encodeURIComponent(eventId)}`;
        };

        try{
          const res = await fetch(`${CONFIG.BACKEND_URL}/api/events/${encodeURIComponent(eventId)}`, {
            method: "GET",
            headers: { "Accept": "application/json" }
          });

          if(!res.ok){
            throw new Error(`HTTP ${res.status}`);
          }

          const payload = await res.json();
          const evt = normalisePayload(payload);

          renderEvent(evt, eventId);
        }catch(err){
          console.error("Failed to load Host Notice:", err);
          showError("Sorry, this Host Notice could not be loaded just now.");
        }
      }

      function renderEvent(evt, eventId){
        const title = getField(evt, ["title", "event_title", "name"], "Event");
        const summary = cleanSummaryText(getField(evt, ["notice_summary", "summary", "short_description"], ""));
        const body = getField(evt, ["notice_body", "body", "description", "details"], "");
        const media = normaliseMedia(getField(evt, ["notice_media", "image", "image_url", "media"], ""));
        const category = getField(evt, ["category_label", "category", "event_category", "type"], "");
        const dateRaw = getField(evt, ["event_date", "date", "start_date"], "");
        const dateTimeRaw = getField(evt, ["start_datetime", "start"], "");
        const timeRaw = getField(evt, ["start_time", "time", "event_time"], "");
        const endTimeRaw = getField(evt, ["end_time"], "");
        const location = getField(evt, ["location", "venue", "place"], "");
        const hostName = getField(evt, ["host_name", "host", "organiser_name"], "");
        const hostMemberId = getField(evt, ["host_member_id", "host_id", "host_membership_number"], "");

        document.title = `${title} | Host Notice | Sanctuary Club`;

        titleEl.textContent = title;

        if(summary){
          summaryEl.textContent = summary;
          summaryEl.classList.remove("hidden");
        }else{
          summaryEl.textContent = "";
          summaryEl.classList.add("hidden");
        }

        const bodyText = String(body || "").trim();
        bodyEl.innerHTML = bodyText ? maybeHtmlContent(bodyText) : "<p>No notice text has been added yet.</p>";

        setText(dateValueEl, formatDate(dateRaw || dateTimeRaw), "To be confirmed");
        setText(timeValueEl, formatTime(timeRaw, dateTimeRaw, endTimeRaw), "To be confirmed");
        setText(locationValueEl, location, "To be confirmed");

        const hostDisplay = [hostName, hostMemberId ? `(${hostMemberId})` : ""]
          .filter(Boolean)
          .join(" ")
          .trim();
        setText(hostValueEl, hostDisplay, "To be confirmed");

        setText(availabilityValueEl, getAvailabilityText(evt), "See booking form");

        if(category){
          categoryBadge.textContent = String(category);
          categoryBadge.classList.remove("hidden");
        }else{
          categoryBadge.classList.add("hidden");
        }

        if(media){
          posterImage.src = media;
          posterImage.alt = title;
          posterImageWrap.classList.remove("hidden");
        }else{
          posterImage.removeAttribute("src");
          posterImageWrap.classList.add("hidden");
        }

        statusEl.classList.add("hidden");
        appEl.classList.remove("hidden");
        errorBox.classList.add("hidden");

        bookingBtn.onclick = function(){
          window.location.href = `event-booking.html?event_id=${encodeURIComponent(eventId)}`;
        };
      }

      function showError(message){
        statusEl.classList.add("hidden");
        appEl.classList.add("hidden");
        errorBox.textContent = message;
        errorBox.classList.remove("hidden");
      }

      loadEvent();
    })();
  </script>
</body>
</html>
