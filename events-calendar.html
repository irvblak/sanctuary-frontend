<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events Calendar – The Sanctuary Club</title>

  <meta name="robots" content="noindex, nofollow">

  <style>
    /* ================================```


       BASE
    ================================= */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f9ff;
      color: #003366;
    }

    /* ================================
       TOP NAV
    ================================= */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #f5f9ff;
      z-index: 10;
      border-bottom: 1px solid #d9e4f2;
    }

    .top-nav a {
      text-decoration: none;
      font-weight: 600;
      color: #003366;
      margin-left: 1rem;
    }

    .nav-center {
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* ================================
       CALENDAR CONTAINER
    ================================= */
    .calendar-container {
      max-width: 900px;
      margin: 6rem auto 3rem;
      padding: 1rem;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .calendar-month-label {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .calendar-links {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin: 0.25rem 0 1rem;
      flex-wrap: wrap;
    }

    button,
    .link-button {
      background: #8b5a2b;
      color: white;
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: none;
      display: inline-block;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* ================================
       CALENDAR GRID
    ================================= */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid #cfd8e3;
      border-left: 1px solid #cfd8e3;
    }

    .weekday,
    .day {
      border-right: 1px solid #cfd8e3;
      border-bottom: 1px solid #cfd8e3;
      min-height: 90px;
      padding: 6px;
      box-sizing: border-box;
      position: relative;
    }

    .weekday {
      min-height: auto;
      font-weight: 700;
      text-align: center;
      background: #eef4fb;
      padding: 8px 0;
    }

    .day.empty {
      background: #fafcff;
    }

    .day-number {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .day.past {
      background: #f0f0f0;
      color: #9aa3ad;
    }

    .day.past .day-number {
      color: #9aa3ad;
    }
  </style>
</head>

<body>

  <!-- Top navigation -->
  <div class="top-nav">
    <div>
      <a href="index.html">Home</a>
      <a href="#" id="logout-link">Logout</a>
    </div>
    <div class="nav-center">Calendar</div>
    <a href="members-info.html">Members Hub</a>
  </div>

  <div class="calendar-container">
    <div class="calendar-header">
      <button id="prev-month">← Prev</button>
      <div id="month-label" class="calendar-month-label"></div>
      <button id="next-month">Next →</button>
    </div>

    <div class="calendar-links">
      <a class="link-button" href="events.html">Events Diary – List View</a>
    </div>

    <div id="calendar-grid" class="calendar-grid"></div>
  </div>

  <!-- 🔓 LOGOUT -->
  <script>
    document.getElementById("logout-link").addEventListener("click", (e) => {
      e.preventDefault();
      
      
    });
  </script>

  <!-- 📅 CALENDAR LOGIC -->
  <script>
    const grid = document.getElementById("calendar-grid");
    const monthLabel = document.getElementById("month-label");
    const prevBtn = document.getElementById("prev-month");
    const nextBtn = document.getElementById("next-month");

    let offset = 0;
    const weekdays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

    function buildCalendar(monthOffset) {
      grid.innerHTML = "";

      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + monthOffset;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      monthLabel.textContent =
        firstDay.toLocaleString("default", { month: "long", year: "numeric" });

      weekdays.forEach(d => {
        const el = document.createElement("div");
        el.className = "weekday";
        el.textContent = d;
        grid.appendChild(el);
      });

      const start = (firstDay.getDay() + 6) % 7;
      for (let i = 0; i < start; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        grid.appendChild(empty);
      }

      const today = new Date();
      today.setHours(0,0,0,0);

      for (let day = 1; day <= lastDay.getDate(); day++) {
        const cell = document.createElement("div");
        cell.className = "day";

        const cellDate = new Date(year, month, day);
        cellDate.setHours(0,0,0,0);

        if (cellDate < today) cell.classList.add("past");

        const num = document.createElement("span");
        num.className = "day-number";
        num.textContent = day;

        cell.appendChild(num);
        grid.appendChild(cell);
      }
    }

    prevBtn.addEventListener("click", () => {
      offset--;
      buildCalendar(offset);
    });

    nextBtn.addEventListener("click", () => {
      offset++;
      buildCalendar(offset);
    });

    buildCalendar(0);
  </script>

</body>
</html>
