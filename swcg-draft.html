<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sanctuary Website Custody and Operating Guide | Sanctuary Club</title>
  <script src="access.js?v=SWCG_1"></script>
  <style>
    :root{--ink:#243746;--blue:#123a78;--line:#d5e1eb;--soft:#f4f8fc;--muted:#607382}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#d9ecff,#f7fafc 24rem,#fff);color:var(--ink);font:500 18px/1.58 system-ui,-apple-system,"Segoe UI",sans-serif}
    .topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1rem;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
    .topbar strong{color:var(--blue)}
    .actions{display:flex;flex-wrap:wrap;gap:.45rem}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:.5rem .8rem;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;cursor:pointer}
    .button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    main{max-width:980px;margin:1.5rem auto 3rem;padding:1.5rem 2.2rem;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
    h1,h2,h3{color:var(--blue);line-height:1.25}h1{font-size:2rem}h2{margin-top:2rem;padding-top:.5rem;border-top:1px solid var(--line);font-size:1.45rem}h3{font-size:1.15rem}
    table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.94rem}th,td{padding:.62rem;vertical-align:top;border:1px solid var(--line);text-align:left}th{background:var(--soft);color:var(--blue)}
    blockquote{margin:1rem 0;padding:.8rem 1rem;border-left:5px solid var(--blue);background:var(--soft)}
    ul,ol{padding-left:1.45rem}a{color:var(--blue)}
    .loading{color:var(--muted)}
    @media(max-width:700px){body{font-size:17px}.topbar{position:static;display:block}.actions{margin-top:.6rem}main{margin:.7rem;padding:1rem;border-radius:12px;overflow-x:auto}}
    @media print{body{background:#fff}.topbar{display:none}main{max-width:none;margin:0;padding:0;border:0;box-shadow:none}h2{break-after:avoid}table{font-size:10pt}}
  </style>
</head>
<body>
  <header class="topbar">
    <strong>Residents Association News &amp; Information · Info</strong>
    <nav class="actions" aria-label="Page actions">
      <a class="button" href="library.html">← Library</a>
      <button class="button primary" type="button" onclick="window.print()">Print</button>
    </nav>
  </header>
  <main id="document"><p class="loading">Loading the draft…</p></main>
  <script>
    fetch("swcg-draft-body.html",{cache:"no-store"})
      .then(response=>{if(!response.ok)throw new Error("Draft unavailable");return response.text()})
      .then(html=>{document.getElementById("document").innerHTML=html})
      .catch(error=>{console.error(error);document.getElementById("document").innerHTML="<h1>Draft temporarily unavailable</h1><p>Please return to the Library and try again shortly.</p>"});
  </script>
</body>
</html>
