<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events Calendar – The Sanctuary Club</title>

  <meta name="robots" content="noindex, nofollow">

  <!-- 🔒 ACCESS PROTECTION -->
  <script>
    (function () {
      if (sessionStorage.getItem("sanctuaryAccess") !== "granted") {
        window.location.replace("index.html");
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f9ff;
      color: #003366;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #f5f9ff;
      z-index: 10;
    }

    .top-nav a {
      text-decoration: none;
      font-weight: 600;
      color: #003366;
      margin-left: 1rem;
    }

    .nav-center {
      font-weight: 700;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

  <!-- Top navigation -->
  <div class="top-nav">
    <div>
      <a href="index.html">Home</a>
      <a href="#" id="logout-link">Logout</a>
    </div>
    <div class="nav-center">Calendar</div>
    <a href="notices.html">Info</a>
  </div>

  <div class="calendar-container">

    <div class="calendar-header">
      <button id="prev-month">← Prev</button>
      <div id="month-label" class="calendar-month-label"></div>
      <button id="next-month">Next →</button>
    </div>

    <div id="calendar-grid" class="calendar-grid"></div>

  </div>

  <script>
    // Logout logic
    document.getElementById("logout-link").addEventListener("click", (e) => {
      e.preventDefault();
      sessionStorage.removeItem("sanctuaryAccess");
      window.location.replace("index.html");
    });
  </script>

  <!-- Calendar logic -->
  <script>
    const grid = document.getElementById("calendar-grid");
    const monthLabel = document.getElementById("month-label");
    const prevBtn = document.getElementById("prev-month");
    const nextBtn = document.getElementById("next-month");

    let offset = 0;
    const weekdays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

    function buildCalendar(monthOffset) {
      grid.innerHTML = "";

      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + monthOffset;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      monthLabel.textContent =
        firstDay.toLocaleString("default", { month: "long", year: "numeric" });

      weekdays.forEach(d => {
        const el = document.createElement("div");
        el.className = "weekday";
        el.textContent = d;
        grid.appendChild(el);
      });

      const start = (firstDay.getDay() + 6) % 7;
      for (let i = 0; i < start; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        grid.appendChild(empty);
      }

      const today = new Date();
      today.setHours(0,0,0,0);

      for (let day = 1; day <= lastDay.getDate(); day++) {
        const cell = document.createElement("div");
        cell.className = "day";

        const cellDate = new Date(year, month, day);
        cellDate.setHours(0,0,0,0);

        if (cellDate < today) {
          cell.classList.add("past");
        }

        const num = document.createElement("span");
        num.className = "day-number";
        num.textContent = day;

        cell.appendChild(num);
        grid.appendChild(cell);
      }
    }

    prevBtn.addEventListener("click", () => {
      offset--;
      buildCalendar(offset);
    });

    nextBtn.addEventListener("click", () => {
      offset++;
      buildCalendar(offset);
    });

    buildCalendar(0);
  </script>

</body>
</html>
