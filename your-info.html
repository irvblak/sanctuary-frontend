<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Information — The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #e9f2fb 0%, #ffffff 65%);
      color: #222;
    }

    nav {
      padding: 1rem 1.25rem;
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 1rem;
    }

    h1 {
      margin-top: 0.5rem;
      font-size: 1.5rem;
    }

    .intro {
      margin-bottom: 1.25rem;
      font-size: 1rem;
    }

    .subtle {
      color: #666;
      font-size: 0.9rem;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    label {
      display: block;
      margin-top: 0.9rem;
      font-weight: 500;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 0.45rem;
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }

    .resident {
      margin-top: 1.2rem;
      padding-top: 0.8rem;
      border-top: 1px solid #e6eaf0;
    }

    .resident h3 {
      margin: 0 0 0.4rem 0;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.6rem 0.8rem;
    }

    button {
      margin-top: 1.4rem;
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      input {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="events-calendar.html">Calendar</a>
    <a href="members-directory.html">Members Directory</a>
    <a href="logout.html">Logout</a>
  </nav>

  <main class="container">

    <h1>Your Information</h1>

    <p class="intro">
      Enter as much information as you wish to share.<br>
      <span class="subtle">(You can change it at any time.)</span>
    </p>

    <div class="panel">

      <label for="memberId">Your home</label>
      <input id="memberId" placeholder="e.g. SM14 or SC03">

      <div id="residents"></div>

      <button id="saveBtn">Save information</button>

    </div>

  </main>

  <script>
    const STORAGE_KEY = "sanctuaryMembers";
    const memberInput = document.getElementById("memberId");
    const residentsDiv = document.getElementById("residents");
    const saveBtn = document.getElementById("saveBtn");

    function loadMembers() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveMembers(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function renderResidents(existing = []) {
      residentsDiv.innerHTML = "";
      for (let i = 0; i < 4; i++) {
        const r = existing[i] || {};
        const div = document.createElement("div");
        div.className = "resident";
        div.innerHTML = `
          <h3>Resident ${i + 1}</h3>
          <div class="grid">
            <div>
              <label>Name</label>
              <input data-field="name" value="${r.name || ""}">
            </div>
            <div>
              <label>Email</label>
              <input data-field="email" value="${r.email || ""}">
            </div>
            <div>
              <label>Mobile</label>
              <input data-field="mobile" value="${r.mobile || ""}">
            </div>
            ${i === 0 ? `
            <div>
              <label>Landline</label>
              <input data-field="landline" value="${r.landline || ""}">
            </div>` : ``}
          </div>
        `;
        residentsDiv.appendChild(div);
      }
    }

    memberInput.addEventListener("blur", () =>
