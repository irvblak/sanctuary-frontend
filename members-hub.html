<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members Hub</title>

  <link rel="stylesheet" href="styles-main.css?v=HUB_1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f2f7fb 0%, #ffffff 60%);
      color: #222;
    }

    nav {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .hub-links {
      margin-top: 1.5rem;
      display: grid;
      gap: 1rem;
    }

    .hub-links a {
      display: block;
      padding: 1rem;
      border-radius: 8px;
      background: #f3f7fb;
      text-decoration: none;
      font-weight: 600;
      color: #003c6d;
      border: 1px solid #d9e6f2;
    }

    .hub-links a:hover {
      background: #e6f0f8;
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <div>
    <a href="calendar.html">What’s On</a>
    &nbsp;|&nbsp;
    <a href="#" id="logout-link">Logout</a>
  </div>
</nav>

<main>
  <h1>Members Hub</h1>

  <p>
    Access resident services and information below.
  </p>

  <div class="hub-links">
    <a href="your-info.html">Your Information</a>
    <a href="members-directory.html">Members Directory</a>
  </div>
</main>

<script>
  const ACCESS_KEY = "sanctuaryAccess";
  const TIME_KEY = "sanctuaryAccessTime";

  document.getElementById("logout-link").onclick = e => {
    e.preventDefault();
    sessionStorage.removeItem(ACCESS_KEY);
    sessionStorage.removeItem(TIME_KEY);
    location.href = "index.html";
  };
</script>

</body>
</html>
