<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Sign-in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <link rel="stylesheet" href="styles-main.css?v=ADMIN_SIGNIN_1" />

  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: linear-gradient(180deg,#e8f2ff 0%, #f2f7fb 45%, #ffffff 100%);
      color:#1f2a37;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px;
    }
    .card{
      width:min(520px, 100%);
      background:#fff;
      border-radius:16px;
      box-shadow:0 8px 22px rgba(0,0,0,0.08);
      border:1px solid rgba(219,230,243,0.8);
      padding: 18px 18px 16px;
    }
    h1{ margin:0 0 6px 0; font-size:1.35rem; color:#003366; }
    p{ margin:0 0 14px 0; color:#667085; line-height:1.45; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .field{ flex:1; min-width:160px; }
    label{ display:block; font-weight:700; font-size:.9rem; margin:0 0 6px; color:#425466; }
    input{
      width:100%;
      padding:.6rem .7rem;
      border-radius:12px;
      border:1px solid #cfd8e3;
      font-size:1rem;
      box-sizing:border-box;
    }
    button{
      margin-top: 12px;
      width:100%;
      padding:.7rem .9rem;
      border:0;
      border-radius:12px;
      background:#005ea8;
      color:#fff;
      font-weight:900;
      font-size:1rem;
      cursor:pointer;
    }
    button:disabled{ opacity:.55; cursor:not-allowed; }
    .msg{
      display:none;
      margin-top:12px;
      padding: 10px 12px;
      border-radius:12px;
      white-space:pre-wrap;
    }
    .msg.warn{ background:#fff5f5; border:1px solid #f2b8b8; color:#7a0000; }
    .msg.ok{ background:#f2fbf4; border:1px solid #bfe5c6; color:#145a2c; }
    .footer{
      margin-top: 12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      font-size:.95rem;
    }
    .footer a{ color:#003366; text-decoration:none; font-weight:800; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Admin sign-in</h1>
    <p>Enter your membership number and 4-digit PIN to proceed to the Admin Login page.</p>

    <div class="row">
      <div class="field">
        <label for="memberId">Membership number</label>
        <input id="memberId" placeholder="SM01" autocomplete="off" />
      </div>

      <div class="field" style="max-width:180px;">
        <label for="pin">4-digit PIN</label>
        <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234" autocomplete="off" />
      </div>
    </div>

    <button id="continueBtn" type="button" disabled>Continue to Admin Login</button>

    <div id="warn" class="msg warn"></div>
    <div id="ok" class="msg ok"></div>

    <div class="footer">
      <a href="index.html">← Home</a>
      <span style="color:#667085;">Not an admin? Use the normal site.</span>
    </div>
  </div>

<script>
  const API_BASE = "https://sanctuary-backend-8iqc.onrender.com";

  const memberIdEl = document.getElementById("memberId");
  const pinEl = document.getElementById("pin");
  const continueBtn = document.getElementById("continueBtn");
  const warnEl = document.getElementById("warn");
  const okEl = document.getElementById("ok");

  const GATE_KEY = "adminGateOk";
  const GATE_TTL_MS = 10 * 60 * 1000; // 10 minutes

  function baseId(raw){
    return String(raw || "").trim().split("/")[0].toUpperCase();
  }
  function onlyDigits4(s){ return /^[0-9]{4}$/.test(s); }

  function show(el, msg){
    el.style.display = "block";
    el.textContent = msg;
  }
  function clear(el){
    el.style.display = "none";
    el.textContent = "";
  }

  function setGateOk(){
    sessionStorage.setItem(GATE_KEY, String(Date.now()));
  }

  async function apiLogin(memberId, pin){
    const res = await fetch(API_BASE + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ memberId, pin })
    });

    let body = null;
    try { body = await res.json(); } catch {}
    if (!res.ok){
      const msg = body && (body.message || body.error) ? (body.message || body.error) : `HTTP ${res.status}`;
      throw new Error(msg);
    }
    return body;
  }

  async function proceed(){
    clear(warnEl);
    clear(okEl);

    const mid = baseId(memberIdEl.value);
    const pin = pinEl.value.trim();

    if (!mid) return show(warnEl, "Please enter your membership number.");
    if (!onlyDigits4(pin)) return show(warnEl, "Please enter your 4-digit PIN.");

    continueBtn.disabled = true;

    try{
      const resp = await apiLogin(mid, pin);

      // We do NOT store token here. This is only a gate.
      if (!resp || !resp.success){
        throw new Error(resp && resp.message ? resp.message : "Login failed.");
      }

      setGateOk();
      show(okEl, "OK. Redirecting to Admin Login…");

      // Small pause so the user sees confirmation
      setTimeout(() => {
        location.href = "admin-login.html";
      }, 400);

    } catch(e){
      show(warnEl, "Could not proceed.\n\n" + String(e.message || e));
      continueBtn.disabled = false;
    }
  }

  function updateEnabled(){
    const mid = baseId(memberIdEl.value);
    const pin = pinEl.value.trim();
    continueBtn.disabled = !(mid && onlyDigits4(pin));
  }

  memberIdEl.addEventListener("input", updateEnabled);
  pinEl.addEventListener("input", updateEnabled);
  pinEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !continueBtn.disabled) proceed();
  });
  continueBtn.addEventListener("click", proceed);

  updateEnabled();
</script>
</body>
</html>
