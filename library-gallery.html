<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gallery | Sanctuary Club</title><script src="access.js?v=GALLERY_2"></script><style>
:root{--ink:#203747;--muted:#607383;--blue:#123a78;--line:#d3e0ea;--soft:#f5f9fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#d9ecff,#f6fafe 45%,#fff);color:var(--ink);font:500 18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.topbar,main{max-width:1180px;margin:auto}.topbar{padding:1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}.brand{color:var(--blue);font-size:2rem;font-weight:850}.actions,.controls{display:flex;flex-wrap:wrap;gap:.5rem}.btn{display:inline-flex;align-items:center;justify-content:center;padding:.58rem .88rem;border:1px solid var(--blue);border-radius:12px;background:#fff;color:var(--blue);font-weight:850;text-decoration:none;cursor:pointer}.btn.active,.btn.primary,.btn:hover{background:var(--blue);color:#fff}main{padding:0 1rem 2.5rem}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:1.25rem;box-shadow:0 8px 24px rgba(0,0,0,.08)}h1{margin:0;color:var(--blue)}.intro{margin:.2rem 0 1rem;color:var(--muted)}.group{margin:1.2rem 0}.group h2{margin:0 0 .55rem;padding-bottom:.3rem;border-bottom:1px solid var(--line);color:var(--blue);font-size:1.25rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.75rem}.thumb{border:1px solid var(--line);border-radius:13px;padding:.5rem;background:#fff;color:var(--ink);text-align:left;cursor:pointer}.thumb:hover{border-color:var(--blue);box-shadow:0 5px 15px rgba(18,58,120,.12)}.preview{height:150px;overflow:hidden;border-radius:9px;background:#edf3f8;position:relative}.mini-page{position:absolute;left:50%;top:0;width:794px;min-height:1123px;background:#fff;transform:translateX(-50%) scale(.19);transform-origin:top center;box-shadow:0 3px 10px rgba(0,0,0,.15)}.mini-page .canvas-item,.viewer-page .canvas-item{position:absolute}.thumb strong,.thumb small{display:block;margin-top:.28rem}.thumb strong{color:var(--blue)}.thumb small,.status{color:var(--muted)}.viewer{position:fixed;inset:0;display:none;place-items:center;padding:1rem;background:rgba(13,31,48,.75);z-index:30}.viewer.open{display:grid}.viewer-card{width:min(820px,96vw);max-height:94vh;overflow:auto;padding:1rem;border-radius:18px;background:#fff}.viewer-card.full{width:min(1180px,98vw)}.viewer-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.viewer-head h2{margin:0;color:var(--blue)}.artboard{margin-top:.8rem;overflow:auto;max-height:68vh;padding:1rem;border-radius:12px;background:#edf2f6}.viewer-page{position:relative;margin:auto;width:794px;min-height:1123px;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.2);transform-origin:top center}.viewer-card:not(.full) .viewer-page{transform:scale(.62);margin-bottom:-427px}.viewer-actions{display:flex;justify-content:space-between;gap:.5rem;margin-top:.8rem}@media(max-width:650px){.topbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:.8rem}}
</style></head><body><header class="topbar"><div class="brand">Gallery</div><nav class="actions"><a class="btn" href="library.html">Library</a><a class="btn primary" href="members-info.html">Members Hub</a></nav></header><main><section class="panel"><h1>Gallery</h1><p class="intro">Choose how you would like to browse.</p><div class="controls"><button class="btn active" data-view="type">By type</button><button class="btn" data-view="artist">By artist</button><button class="btn" data-view="all">Entire Gallery</button></div><p class="status" id="status">Loading artwork…</p><div id="content"></div></section></main><div class="viewer" id="viewer"><div class="viewer-card" id="viewerCard"><div class="viewer-head"><div><h2 id="viewTitle"></h2><p id="viewMeta" class="status"></p></div></div><div class="artboard" id="artboard"></div><div class="viewer-actions"><button class="btn" id="closeViewer">Close</button><button class="btn primary" id="fullSize">Full size</button></div></div></div><script>
(()=>{"use strict";const API="https://sanctuary-backend-8iqc.onrender.com";let items=[],view="type";const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const date=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleDateString("en-GB")};function state(item){let data=item?.canvas_data?.state||{};if(typeof data==="string")try{data=JSON.parse(data)}catch(_){data={}}return data}function type(item){return item.tertiary_category||item.canvas_data?.tertiary_category||"Other"}function preview(item,large=false){const s=state(item);return `<div class="${large?'viewer-page':'mini-page'}">${s.html||'<div class="status" style="padding:2rem">Preview unavailable</div>'}</div>`}function thumb(item){return `<button class="thumb" data-id="${esc(item.publication_id)}"><div class="preview">${preview(item)}</div><strong>${esc(item.title||"Untitled")}</strong><small>${esc(item.creator_name||"Member")} · ${esc(date(item.published_at))}</small></button>`}function groups(){if(view==="type")return ["Photo","Modern","Traditional"].map(name=>[name,items.filter(item=>type(item).toLowerCase()===name.toLowerCase())]);if(view==="artist")return [...new Set(items.map(item=>item.creator_name||"Member"))].map(name=>[name,items.filter(item=>(item.creator_name||"Member")===name)]);return [["All artists",items]]}function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('content').innerHTML=groups().map(([name,list])=>`<section class="group"><h2>${esc(name)}</h2>${list.length?`<div class="grid">${list.map(thumb).join('')}</div>`:'<p class="status">No artwork yet.</p>'}</section>`).join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>open(items.find(item=>item.publication_id===b.dataset.id)));document.getElementById('status').hidden=items.length>0}function open(item){if(!item)return;document.getElementById('viewTitle').textContent=item.title||"Untitled";document.getElementById('viewMeta').textContent=[item.creator_name,type(item),date(item.published_at)].filter(Boolean).join(' · ');document.getElementById('artboard').innerHTML=preview(item,true);document.getElementById('viewerCard').classList.remove('full');document.getElementById('fullSize').textContent='Full size';document.getElementById('viewer').classList.add('open')}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('closeViewer').onclick=()=>document.getElementById('viewer').classList.remove('open');document.getElementById('fullSize').onclick=()=>{const card=document.getElementById('viewerCard');card.classList.toggle('full');document.getElementById('fullSize').textContent=card.classList.contains('full')?'Medium size':'Full size'};document.getElementById('viewer').onclick=e=>{if(e.target.id==='viewer')e.currentTarget.classList.remove('open')};fetch(`${API}/api/library-publications?category=gallery`,{cache:'no-store',headers:{Accept:'application/json'}}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||'Gallery could not be loaded');items=(d.publications||[]).filter(item=>(item.collection||item.canvas_data?.collection||'library')==='library');render()}).catch(e=>{document.getElementById('status').textContent=e.message||'Gallery could not be loaded'})})();
</script></body></html>
