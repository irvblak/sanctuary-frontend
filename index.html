<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css?v=1012" />
</head>

<body>

<div class="hero-wrapper">

  <!-- LEFT PANEL -->
  <div class="hero-panel hero-panel-left">
    <h3>Welcome to The Sanctuary Club</h3>
    <p>
      A residents’ club for Sanctuary Mews and Sanctuary Court.
    </p>
  </div>

  <!-- HERO (CENTRE) -->
  <section class="hero">
    <div class="hero-overlay">

      <h1 class="hero-title">The Sanctuary Club</h1>

      <!-- ACTION BUTTONS -->
      <div class="hero-buttons">
        <button
          type="button"
          class="hero-button"
          onclick="openGate('events-calendar.html')"
        >
          What’s On
        </button>

        <button
          type="button"
          class="hero-button"
          onclick="openGate('notices.html')"
        >
          Info
        </button>
      </div>

      <!-- ACCESS GATE (NOW UNDER BUTTONS) -->
      <div id="access-gate" style="display:none; margin-top: 2rem; text-align: center;">

        <div class="access-input-wrapper" style="justify-content: center;">
          <input
            type="password"
            id="access-code-input"
            placeholder="Access code"
            autocomplete="off"
          />

          <button
            type="button"
            class="toggle-visibility"
            aria-label="Show access code"
          >👁</button>
        </div>

        <button id="access-submit" class="hero-button" style="margin-top: 0.75rem;">
          Continue
        </button>

        <div
          id="access-error"
          class="access-error"
          style="display:none; margin-top: 0.5rem;"
        >
          Invalid access code
        </div>

      </div>

      <footer class="site-footer">
        <p>© The Sanctuary Club. All rights reserved.</p>
      </footer>

    </div>
  </section>

  <!-- RIGHT PANEL -->
  <div class="hero-panel hero-panel-right">
    <p>
      <strong><em>
        See what’s on, join activities, and optionally share contact details
        so neighbours can reach you — or so you can reach them.
      </em></strong>
    </p>
  </div>

</div>

<!-- Gate opener (explicit, simple, reliable) -->
<script>
  function openGate(dest) {
    if (localStorage.getItem("sanctuaryAccessGranted") === "true") {
      window.location.href = dest;
      return;
    }
    window.pendingDestination = dest;
    document.getElementById("access-gate").style.display = "block";
    document.getElementById("access-code-input").focus();
  }
</script>

<script src="script.js?v=1017"></script>

</body>
</html>
