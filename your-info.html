<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Information — The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css" />

  <style>
    /* ---- HARD ISOLATION FROM GLOBAL CSS ---- */
    body.yi-page {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #e9f2fb 0%, #ffffff 65%);
      color: #222;
    }

    .yi-root * {
      box-sizing: border-box;
    }

    .yi-nav {
      padding: 1rem 1.25rem;
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }

    .yi-nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
    }

    .yi-container {
      max-width: 760px;
      margin: 0 auto;
      padding: 1rem;
    }

    .yi-panel {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .yi-panel label {
      display: block;
      margin-top: 0.9rem;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .yi-panel input {
      width: 100%;
      padding: 0.45rem;
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }

    .resident {
      margin-top: 1.2rem;
      padding-top: 0.8rem;
      border-top: 1px solid #e6eaf0;
    }

    .resident h3 {
      margin: 0 0 0.4rem 0;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.6rem 0.8rem;
    }

    .yi-save {
      margin-top: 1.4rem;
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .yi-panel input {
        font-size: 16px;
      }
    }
  </style>
</head>

<body class="yi-page">
<div style="background:red;color:white;padding:10px;font-weight:bold;">
TEST MARKER — edited directly on GitHub
</div>
  

<div class="yi-root">

  <!-- NAV -->
  <nav class="yi-nav">
    <a href="index.html">Home</a>
    <a href="events-calendar.html">Calendar</a>
    <a href="members-directory.html">Members Directory</a>
    <a href="#" id="logout-link">Logout</a>
  </nav>

  <main class="yi-container">

    <h1>Your Information</h1>

    <p>
      Enter as much information as you wish to share.<br>
      <span style="color:#666;font-size:0.9rem;">(You can change it at any time.)</span>
    </p>

    <div class="yi-panel">

      <label>Your home</label>
      <input id="memberId" placeholder="e.g. SM14 or SC03">

      <div id="residents"></div>

      <button class="yi-save" id="saveBtn">Save information</button>

    </div>

  </main>

</div>

<script src="logout.js"></script>

<script>
  const STORAGE_KEY = "sanctuaryMembers";
  const memberInput = document.getElementById("memberId");
  const residentsDiv = document.getElementById("residents");

  function loadMembers() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function renderResidents(existing = []) {
    residentsDiv.innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const r = existing[i] || {};
      const div = document.createElement("div");
      div.className = "resident";
      div.innerHTML = `
        <h3>Resident ${i + 1}</h3>
        <div class="grid">
          <div><label>Name</label><input data-field="name" value="${r.name || ""}"></div>
          <div><label>Email</label><input data-field="email" value="${r.email || ""}"></div>
          <div><label>Mobile</label><input data-field="mobile" value="${r.mobile || ""}"></div>
          ${i === 0 ? `<div><label>Landline</label><input data-field="landline" value="${r.landline || ""}"></div>` : ""}
        </div>
      `;
      residentsDiv.appendChild(div);
    }
  }

  memberInput.addEventListener("blur", () => {
    const id = memberInput.value.trim().toUpperCase();
    if (!id) return;
    const members = loadMembers();
    renderResidents(members[id]?.residents || []);
    localStorage.setItem("sanctuaryLastMemberId", id);
  });

  document.getElementById("saveBtn").onclick = () => {
    const id = memberInput.value.trim().toUpperCase();
    if (!id) return alert("Please enter your home.");

    const residents = [];
    residentsDiv.querySelectorAll(".resident").forEach(div => {
      const r = {};
      div.querySelectorAll("input").forEach(i => r[i.dataset.field] = i.value.trim());
      if (Object.values(r).some(v => v)) residents.push(r);
    });

    const members = loadMembers();
    members[id] = { residents };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
    alert("Your information has been saved.");
  };

  const last = localStorage.getItem("sanctuaryLastMemberId");
  if (last) {
    memberInput.value = last;
    renderResidents(loadMembers()[last]?.residents || []);
  }
</script>

</body>
</html>
