<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member Information — The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css?v=MI_V3" />

  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #e9f1fb, #f6f9fc);
      color: #003366;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* --- TOP NAV --- */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: transparent;
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-nav a {
      text-decoration: none;
      font-weight: 500;
      color: #005ea8;
      margin-right: 1rem;
    }

    .top-nav-right a {
      margin-right: 0;
    }

    /* --- PAGE WRAPPER --- */
    .content-wrapper {
      max-width: 720px;
      margin: 3.5rem auto 3rem; /* lifted */
      padding: 0 1rem;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .intro {
      color: #445;
      margin-bottom: 1.6rem;
    }

    /* --- MENU GRID --- */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .info-card {
      display: block;
      padding: 1.1rem 1.2rem;
      background: #ffffff;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      max-width: 520px;
    }

    .info-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(0,0,0,0.12);
    }

    .info-card h3 {
      margin: 0 0 0.3rem 0;
      color: #003366;
    }

    .info-card p {
      margin: 0;
      color: #556;
      font-size: 0.95rem;
    }

    @media (min-width: 700px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- TOP NAV -->
  <nav class="top-nav">
    <div>
      <a href="index.html">Home</a>
      <a href="events-calendar.html">Calendar</a>
    </div>

    <div class="top-nav-right">
      <a href="#" id="logout-link">Logout</a>
    </div>
  </nav>

  <main class="content-wrapper">

    <h1>Member Information</h1>

    <p class="intro">
      Access member resources, update your details, or browse the directory.
    </p>

    <div class="card-grid">

      <a href="your-info.html" class="info-card">
        <h3>Your Information</h3>
        <p>Update household members and contact preferences.</p>
      </a>

      <a href="members-directory.html" class="info-card">
        <h3>Members Directory</h3>
        <p>View contact details shared by residents.</p>
      </a>

      <!-- Space intentionally left for future items -->
      <!-- Host • Payments • Notices -->

    </div>

  </main>

  <script>
    document.getElementById("logout-link").onclick = e => {
      e.preventDefault();
      sessionStorage.clear();
      window.location.href = "index.html";
    };
  </script>

</body>
</html>
