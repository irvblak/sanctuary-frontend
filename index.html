<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sanctuary Club</title>

  <link rel="stylesheet" href="styles-main.css?v=HOME_RESTORE_2" />

  <style>
    #access-gate { display:none; margin-top:1rem; }
    .hero-button { cursor:pointer; }
  </style>
</head>

<body>
  <div class="hero-wrapper">

    <!-- LEFT PANEL -->
    <div class="hero-panel">
      <h3>Welcome to your club</h3>
      <p><em>The Sanctuary Club is a residents’ club for Sanctuary Mews and Sanctuary Court.</em></p>
    </div>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-overlay">
        <h1 class="hero-title" style="margin-top:0.5rem;">The Sanctuary Club</h1>

        <div class="action-stack">

          <!-- ACCESS GATE (deferred) -->
          <div id="access-gate">
            <div class="access-input-wrapper">
              <input
                type="password"
                id="access-code-input"
                placeholder="Access code"
                autocomplete="off"
              />
              <button type="button" id="access-eye">👁</button>
            </div>
            <button id="access-submit" class="hero-button" type="button">Continue</button>
          </div>

          <!-- HOME BUTTONS -->
          <div class="hero-buttons">
            <button class="hero-button" data-target="events-calendar.html" type="button">What’s On</button>
            <button class="hero-button" data-target="members-info.html" type="button">Info</button>
          </div>

        </div>

        <footer class="site-footer">
          <p>© The Sanctuary Club. All rights reserved.</p>
        </footer>
      </div>
    </section>

    <!-- RIGHT PANEL -->
    <div class="hero-panel" style="position:relative;">
      <a
        href="#"
        id="logout-link"
        style="
          position:absolute;
          top:0;
          right:0;
          font-size:0.85rem;
          text-decoration:underline;
          cursor:pointer;
          display:none;
        "
      >Logout</a>

      <p><strong><em>
        For residents only.
        Access to events, information and the members’ directory.
      </em></strong></p>
    </div>

  </div>

  <script>
    // 🔑 CHANGE THIS to your real access code (e.g. WXYZ)
    const ACCESS_CODE = "WXYZ";

    // 8-hour access model
    const ACCESS_UNTIL_KEY = "sanctuaryAccessUntil";
    const ACCESS_TTL_MS = 8 * 60 * 60 * 1000; // 8 hours

    const gate = document.getElementById("access-gate");
    const logoutLink = document.getElementById("logout-link");
    const input = document.getElementById("access-code-input");
    let pendingTarget = null;

    function hasValidAccess() {
      const until = Number(localStorage.getItem(ACCESS_UNTIL_KEY) || "0");
      return until && Date.now() < until;
    }

    function grantAccess() {
      const until = Date.now() + ACCESS_TTL_MS;

      // Remember for 8 hours (survives a tab close)
      localStorage.setItem(ACCESS_UNTIL_KEY, String(until));

      // ALSO satisfy pages that check sessionStorage (Calendar / Hub etc.)
      sessionStorage.setItem("sanctuaryAccess", "granted");
      sessionStorage.setItem("sanctuaryAccessTime", String(Date.now()));
    }

    function showGateFor(target) {
      pendingTarget = target;
      gate.style.display = "block";
      input.focus();
    }

    // Buttons: if already granted -> go; else show gate
    document.querySelectorAll(".hero-button[data-target]").forEach(btn => {
      btn.addEventListener("click", () => {
        const target = btn.dataset.target;
        if (hasValidAccess()) {
          location.href = target;
        } else {
          showGateFor(target);
        }
      });
    });

    // Submit code
    document.getElementById("access-submit").addEventListener("click", () => {
      const val = (input.value || "").trim().toUpperCase();
      if (val !== ACCESS_CODE) return;

      grantAccess();
      logoutLink.style.display = "inline";
      gate.style.display = "none";

      if (pendingTarget) location.href = pendingTarget;
    });

    // Eye toggle
    document.getElementById("access-eye").addEventListener("click", () => {
      input.type = input.type === "password" ? "text" : "password";
    });

    // Enter key submits
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("access-submit").click();
    });

    // Logout (clears both local and session)
    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem(ACCESS_UNTIL_KEY);
      sessionStorage.removeItem("sanctuaryAccess");
      sessionStorage.removeItem("sanctuaryAccessTime");

      gate.style.display = "none";
      logoutLink.style.display = "none";
      pendingTarget = null;
      input.value = "";
    });

    // INIT: show logout if already granted
    if (hasValidAccess()) {
      logoutLink.style.display = "inline";
      // refresh sessionStorage for this tab so gated pages work immediately
      sessionStorage.setItem("sanctuaryAccess", "granted");
      sessionStorage.setItem("sanctuaryAccessTime", String(Date.now()));
    }
  </script>

  <footer style="
    padding:16px 22px;
    font-size:0.85rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#666;
    border-top:1px solid #e6edf5;
    margin-top:40px;
  ">
    <span>© Sanctuary Club</span>

    <a href="admin-signin.html"
       style="
         text-decoration:none;
         color:#666;
         opacity:0.6;
         font-weight:500;
       "
       onmouseover="this.style.opacity='1'"
       onmouseout="this.style.opacity='0.6'">
       Admin
    </a>
  </footer>

  <!-- Discreet Admin + Service entry -->
<div
  style="
    position:fixed;
    right:12px;
    bottom:10px;
    display:flex;
    gap:8px;
    align-items:center;
    z-index:9999;
  "
>
  <a href="service-access.html"
     aria-label="Service access"
     style="
       font-size:0.82rem;
       text-decoration:none;
       color:#666;
       opacity:0.55;
       padding:6px 10px;
       border-radius:999px;
       background:rgba(255,255,255,0.85);
       border:1px solid rgba(230,237,245,0.9);
     "
     onmouseover="this.style.opacity='1'"
     onmouseout="this.style.opacity='0.55'">
    Service Access
  </a>

  <a href="admin-login.html"
     aria-label="Admin access"
     style="
       font-size:0.82rem;
       text-decoration:none;
       color:#666;
       opacity:0.55;
       padding:6px 10px;
       border-radius:999px;
       background:rgba(255,255,255,0.85);
       border:1px solid rgba(230,237,245,0.9);
     "
     onmouseover="this.style.opacity='1'"
     onmouseout="this.style.opacity='0.55'">
    Admin
  </a>
</div>

</body>
</html>
