<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events Calendar – The Sanctuary Club</title>

  <meta name="robots" content="noindex, nofollow" />

  <script src="access.js?v=AC_1"></script>

  <style>
    :root{
      --bg1:#d9ecff;
      --bg2:#f2f7fb;
      --ink:#1b2733;
      --muted:#5d6a77;
      --card:#ffffff;
      --line:#dbe6f3;
      --brand:#005ea8;
      --brand-dark:#003366;
      --radius:16px;

      --cat-social:#2563eb;
      --cat-sport:#7c3aed;
      --cat-games:#0f766e;
      --cat-fitness:#16a34a;
      --cat-food:#ea580c;
      --cat-entertainment:#ca8a04;
      --cat-meeting:#111827;
      --cat-external-service:#c026d3;

      --pillText:#ffffff;
      --past-bg:#e5e7eb;
      --past-text:#374151;
      --past-border:#cbd5e1;
      --past-day-bg:#f3f4f6;
      --past-day-line:#d1d5db;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, #ffffff 100%);
      color:var(--ink);
      min-height:100vh;
    }

    nav{
      padding:1rem 1.25rem;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:.75rem;
      max-width:1140px;
      margin:0 auto;
    }

    .nav-left,.nav-right{
      display:flex;
      gap:.6rem;
      align-items:center;
      flex-wrap:wrap;
    }

    .nav-right{ justify-content:flex-end; }

    .brand{
      justify-self:center;
      font-weight:900;
      color:var(--brand-dark);
      letter-spacing:0.2px;
      white-space:nowrap;
      text-align:center;
    }

    a.btn, button.btn{
      appearance:none;
      text-decoration:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--brand-dark);
      padding:.55rem .85rem;
      border-radius:999px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(0,0,0,.05);
      font-size:.95rem;
    }

    a.btn.primary, button.btn.primary{
      background:var(--brand);
      color:#fff;
      border-color:transparent;
    }

    a.btn.ghost, button.btn.ghost{
      background:transparent;
    }

    button:disabled{ opacity:.5; cursor:default; }

    main{
      max-width:1140px;
      margin:0 auto 2rem;
      padding:0 1rem;
    }

    .card{
      background:var(--card);
      border-radius: var(--radius);
      box-shadow:0 2px 12px rgba(0,0,0,0.06);
      padding:1rem;
      border:1px solid rgba(219,230,243,0.7);
      margin-top:.8rem;
    }

    .topbar{
      display:flex;
      gap:.75rem;
      flex-wrap:wrap;
      align-items:flex-start;
      justify-content:space-between;
      margin-bottom:.75rem;
    }

    h1{
      margin:0;
      font-size:1.35rem;
      color:var(--brand-dark);
      letter-spacing:0.2px;
    }

    .subtitle{
      margin-top:.25rem;
      color:var(--muted);
      font-size:.95rem;
      line-height:1.4;
    }

    .controls{
      display:flex;
      gap:0.5rem;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .monthTitle{
      font-size:1.05rem;
      font-weight:900;
      color:var(--brand-dark);
      margin:.5rem 0 .5rem;
    }

    .statusRow{
      display:flex;
      gap:.75rem;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:.75rem;
    }

    .statusBox{
      display:none;
      padding:.72rem .88rem;
      border-radius:14px;
      font-weight:800;
      line-height:1.4;
    }

    .statusBox.show{ display:block; }

    .statusInfo{
      background:#eef6ff;
      color:#0b4d87;
      border:1px solid rgba(0,94,168,.18);
    }

    .statusWarn{
      background:#fff8ea;
      color:#8a5b00;
      border:1px solid rgba(138,91,0,.18);
    }

    .statusErr{
      background:#fff2f4;
      color:#b00020;
      border:1px solid rgba(176,0,32,.18);
    }

    .legend{
      display:flex;
      gap:.6rem 1rem;
      flex-wrap:wrap;
      align-items:center;
      margin:0.75rem 0 0.35rem;
      color:var(--muted);
      font-size:0.92rem;
    }

    .legendItem{
      display:flex;
      gap:0.5rem;
      align-items:center;
      user-select:none;
      cursor:pointer;
    }

    .swatch{
      width:14px;
      height:14px;
      border-radius:4px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    }

    .legendItem.off{ opacity:0.35; }

    .legendHelp{
      margin-left:auto;
      font-weight:700;
      color:var(--brand-dark);
      opacity:0.85;
      user-select:none;
    }

    .dow{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:0.5rem;
      margin-bottom:0.35rem;
      color:var(--muted);
      font-weight:900;
      font-size:0.88rem;
      letter-spacing:0.2px;
    }

    .dow div{ padding:0 0.35rem; }

    .grid{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:0.5rem;
    }

    .day{
      border:1px solid var(--line);
      border-radius:14px;
      background:#ffffff;
      min-height:120px;
      padding:0.5rem 0.45rem 0.55rem;
      position:relative;
    }

    .day.out{
      background:#fbfdff;
      opacity:0.55;
    }

    .day.today{
      box-shadow:0 0 0 2px rgba(0,94,168,.18) inset;
    }

    .day.has-past-events{
      background:var(--past-day-bg);
      border-color:var(--past-day-line);
    }

    .dayHeader{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:0.5rem;
      margin-bottom:0.35rem;
    }

    .dayNum{
      font-weight:900;
      color:var(--brand-dark);
    }

    .dayBadge{
      font-size:0.78rem;
      color:var(--muted);
      font-weight:800;
    }

 .events{
  display:grid;
  justify-items:start;
  align-content:start;
  gap:0.35rem;
}   
.pill{
  display:inline-grid;
  grid-auto-flow:column;
  align-items:center;
  justify-content:start;
  gap:6px;

  width:auto !important;
  max-width:100%;
  min-width:0;

  padding:4px 7px;
  border-radius:999px;
  color:var(--pillText);
  text-decoration:none;
  font-size:12px;
  line-height:1.2;
  cursor:pointer;
  user-select:none;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  justify-self:start;
}

.pill:hover{
  filter:brightness(1.03);
}

.pill:focus{
  outline:2px solid rgba(36,93,139,.28);
  outline-offset:2px;
}

.pill small{
  flex:0 0 auto;
  margin:0;
  font-size:11px;
  font-weight:700;
  opacity:.95;
  color:inherit;
  white-space:nowrap;
}

.pill span{
  display:block;
  min-width:0;
  max-width:12ch;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-weight:700;
  opacity:.96;
}

.pill.past{
  opacity:.72;
  filter:grayscale(.18);
} 

    .more{
      margin-top:0.1rem;
      font-size:0.82rem;
      color:var(--brand-dark);
      font-weight:900;
      cursor:pointer;
      user-select:none;
    }

    .empty{
      color:var(--muted);
      font-weight:800;
      padding:0.75rem;
    }

    @media (max-width:900px){
      .day{ min-height:100px; }
    }

    @media (max-width:720px){
      nav{
        grid-template-columns:1fr;
        row-gap:0.65rem;
        text-align:center;
      }
      .nav-left,.nav-center,.nav-right{ justify-self:center; }
      .legendHelp{ margin-left:0; }
      .dow{ font-size:.8rem; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-left">
      <a class="btn" href="index.html">Home</a>
      <a class="btn" href="members-info.html">Members Hub</a>
    </div>

    <div class="brand">Sanctuary Club — Calendar</div>

    <div class="nav-right">
      <a class="btn" href="events.html">Events List</a>
      <a class="btn primary" href="host-event-form.html">Create Event</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <div class="topbar">
        <div>
          <h1>Calendar</h1>
          <div class="subtitle">
  Click an event pill to open its notice.
</div>
          <div class="monthTitle" id="monthTitle"></div>
        </div>

        <div class="controls">
          <button class="btn ghost" id="prevBtn" type="button">◀</button>
          <button class="btn ghost" id="todayBtn" type="button">Today</button>
          <button class="btn ghost" id="nextBtn" type="button">▶</button>
        </div>
      </div>

      <div class="statusRow">
        <div class="statusBox statusInfo show" id="infoBox">Loading events…</div>
        <div class="statusBox statusWarn" id="warnBox"></div>
        <div class="statusBox statusErr" id="errBox"></div>
      </div>

      <div class="legend" id="legend">
        <div class="legendHelp">Filter categories</div>
      </div>

      <div class="dow">
        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <script src="logout.js?v=LO_3"></script>

  <script>
    const BACKEND_URL = "https://sanctuary-backend-8iqc.onrender.com";

    const CATEGORY_DEFS = [
      { key: "social", label: "Social", colorVar: "--cat-social" },
      { key: "sport", label: "Sport", colorVar: "--cat-sport" },
      { key: "games", label: "Games", colorVar: "--cat-games" },
      { key: "fitness", label: "Fitness", colorVar: "--cat-fitness" },
      { key: "food", label: "Food", colorVar: "--cat-food" },
      { key: "entertainment", label: "Entertainment", colorVar: "--cat-entertainment" },
      { key: "meeting", label: "Meeting", colorVar: "--cat-meeting" },
      { key: "external-service", label: "External Service", colorVar: "--cat-external-service" }
    ];

    const catOn = Object.fromEntries(CATEGORY_DEFS.map(c => [c.key, true]));
    const expandedDays = new Set();

    let EVENTS = [];
    let current = new Date();
    current = new Date(current.getFullYear(), current.getMonth(), 1, 12, 0, 0, 0);

    const monthTitleEl = document.getElementById("monthTitle");
    const gridEl = document.getElementById("grid");
    const legendEl = document.getElementById("legend");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const todayBtn = document.getElementById("todayBtn");

    const infoBox = document.getElementById("infoBox");
    const warnBox = document.getElementById("warnBox");
    const errBox = document.getElementById("errBox");

    function pad2(n){
      return String(n).padStart(2, "0");
    }

    function ymd(d){
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function parseYMD(dateStr){
      const text = String(dateStr || "").trim();
      const match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!match) return null;

      const year = Number(match[1]);
      const monthIndex = Number(match[2]) - 1;
      const day = Number(match[3]);

      const d = new Date(year, monthIndex, day, 12, 0, 0, 0);
      if(
        d.getFullYear() !== year ||
        d.getMonth() !== monthIndex ||
        d.getDate() !== day
      ){
        return null;
      }

      return d;
    }

    function parseDateAndTime(eventDate, startTime){
      const baseDate = parseYMD(eventDate);
      if(!baseDate) return null;

      const timeText = String(startTime || "").trim();
      const timeMatch = timeText.match(/^(\d{1,2}):(\d{2})$/);

      if(!timeMatch){
        return new Date(
          baseDate.getFullYear(),
          baseDate.getMonth(),
          baseDate.getDate(),
          12, 0, 0, 0
        );
      }

      const hours = Number(timeMatch[1]);
      const minutes = Number(timeMatch[2]);

      return new Date(
        baseDate.getFullYear(),
        baseDate.getMonth(),
        baseDate.getDate(),
        hours, minutes, 0, 0
      );
    }

    function monthName(d){
      return d.toLocaleString("en-GB", { month:"long", year:"numeric" });
    }

    function timeHM(d){
      return d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
    }

    function categoryDef(key){
      return CATEGORY_DEFS.find(c => c.key === key) || null;
    }

    function categoryColor(key){
      const def = categoryDef(key);
      if (!def) return "#005ea8";
      const v = getComputedStyle(document.documentElement).getPropertyValue(def.colorVar).trim();
      return v || "#005ea8";
    }

    function toCategoryKey(rawKey, rawLabel){
      const key = String(rawKey || "").trim().toLowerCase();
      const label = String(rawLabel || "").trim().toLowerCase();

      if (key === "external service" || key === "external_service" || key === "external-service") return "external-service";
      if (label === "external service") return "external-service";

      const map = {
        social: "social",
        sport: "sport",
        games: "games",
        fitness: "fitness",
        food: "food",
        entertainment: "entertainment",
        meeting: "meeting"
      };

      if (map[key]) return map[key];
      if (map[label]) return map[label];

      return key || label || "social";
    }

    function showInfo(msg){
      infoBox.textContent = msg;
      infoBox.classList.add("show");
    }

    function clearInfo(){
      infoBox.textContent = "";
      infoBox.classList.remove("show");
    }

    function showWarn(msg){
      warnBox.textContent = msg;
      warnBox.classList.add("show");
    }

    function clearWarn(){
      warnBox.textContent = "";
      warnBox.classList.remove("show");
    }

    function showErr(msg){
      errBox.textContent = msg;
      errBox.classList.add("show");
    }

    function clearErr(){
      errBox.textContent = "";
      errBox.classList.remove("show");
    }

    async function getJson(url, options = {}){
      const res = await fetch(url, options);
      const text = await res.text();
      let data = {};
      try{
        data = text ? JSON.parse(text) : {};
      }catch{
        data = {};
      }
      if (!res.ok){
        throw new Error(data.message || `HTTP ${res.status}`);
      }
      return data;
    }

    function startOfToday(){
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function isPastEvent(ev){
      const dayOnly = new Date(ev.dateObj.getFullYear(), ev.dateObj.getMonth(), ev.dateObj.getDate(), 0, 0, 0, 0);
      return dayOnly < startOfToday();
    }

        function eventHref(ev){
      return `events-details.html?v=HN_2&event_id=${encodeURIComponent(ev.backendId)}`;
    }

    function normalisedEvents(){
      return EVENTS
        .map(ev => {
          const dateObj = parseDateAndTime(ev.event_date, ev.start_time);
          if (!dateObj) return null;

          return {
            raw: ev,
            id: ev.event_ref || ev.event_id || "",
            backendId: ev.event_id || "",
            title: ev.title || "Untitled event",
            category: toCategoryKey(ev.category_key, ev.category_label),
            categoryLabel: ev.category_label || ev.category_key || "",
            dateObj,
            where: ev.location || "",
            hostName: ev.host_name || "",
            status: ev.status || "",
            endTime: ev.end_time || ""
          };
        })
        .filter(Boolean)
        .filter(ev => !!ev.backendId)
        .filter(ev => catOn[ev.category] !== false)
        .sort((a, b) => a.dateObj - b.dateObj);
    }

    function eventsByDayInMonth(year, monthIndex){
      const by = {};
      for (const e of normalisedEvents()){
        if (e.dateObj.getFullYear() === year && e.dateObj.getMonth() === monthIndex){
          const key = ymd(e.dateObj);
          (by[key] ||= []).push(e);
        }
      }
      Object.values(by).forEach(arr => arr.sort((a, b) => a.dateObj - b.dateObj));
      return by;
    }

    function mondayFirstIndex(jsDay){
      return (jsDay + 6) % 7;
    }

    function renderLegend(){
      [...legendEl.querySelectorAll(".legendItem")].forEach(n => n.remove());

      for (const c of CATEGORY_DEFS){
        const item = document.createElement("div");
        item.className = "legendItem" + (catOn[c.key] ? "" : " off");
        item.title = "Click to toggle";
        item.innerHTML = `<div class="swatch"></div><div>${c.label}</div>`;
        item.querySelector(".swatch").style.background = categoryColor(c.key);
        item.onclick = () => {
          catOn[c.key] = !catOn[c.key];
          renderLegend();
          renderCalendar();
        };
        legendEl.insertBefore(item, legendEl.querySelector(".legendHelp"));
      }
    }

    function renderCalendar(){
      const year = current.getFullYear();
      const month = current.getMonth();

      monthTitleEl.textContent = monthName(current);
      gridEl.innerHTML = "";

      const first = new Date(year, month, 1, 12, 0, 0, 0);
      const firstIndex = mondayFirstIndex(first.getDay());
      const start = new Date(year, month, 1 - firstIndex, 12, 0, 0, 0);
      const byDay = eventsByDayInMonth(year, month);
      const todayKey = ymd(new Date());

      for (let cell = 0; cell < 42; cell++){
        const d = new Date(start);
        d.setDate(start.getDate() + cell);

        const inMonth = d.getMonth() === month;
        const dayKey = ymd(d);

        const day = document.createElement("div");
        day.className = "day" + (inMonth ? "" : " out") + (dayKey === todayKey ? " today" : "");

        const header = document.createElement("div");
        header.className = "dayHeader";
        header.innerHTML = `
          <div class="dayNum">${d.getDate()}</div>
          <div class="dayBadge">${inMonth ? "" : d.toLocaleString("en-GB", { month:"short" })}</div>
        `;
        day.appendChild(header);

        const eventsWrap = document.createElement("div");
        eventsWrap.className = "events";

        if (inMonth){
          const evs = byDay[dayKey] || [];
          const isExpanded = expandedDays.has(dayKey);
          const show = isExpanded ? evs : evs.slice(0, 3);

          if (evs.some(isPastEvent)){
            day.classList.add("has-past-events");
          }

          for (const ev of show){
            const pill = document.createElement("a");
            const t = timeHM(ev.dateObj);
            pill.className = "pill" + (isPastEvent(ev) ? " past" : "");
            pill.style.background = isPastEvent(ev) ? "" : categoryColor(ev.category);
            pill.href = eventHref(ev);
            pill.title = `${t} — ${ev.title}`;
                      
            pill.innerHTML = `<small>${t}</small><span>${ev.title}</span>`;
            eventsWrap.appendChild(pill);
          }

          if (evs.length > 3 && !isExpanded){
            const more = document.createElement("div");
            more.className = "more";
            more.textContent = `+${evs.length - 3} more`;
            more.onclick = () => {
              expandedDays.add(dayKey);
              renderCalendar();
            };
            eventsWrap.appendChild(more);
          }

          if (evs.length > 3 && isExpanded){
            const less = document.createElement("div");
            less.className = "more";
            less.textContent = "Show less";
            less.onclick = () => {
              expandedDays.delete(dayKey);
              renderCalendar();
            };
            eventsWrap.appendChild(less);
          }
        }

        day.appendChild(eventsWrap);
        gridEl.appendChild(day);
      }
    }

    async function loadEvents(){
      clearWarn();
      clearErr();
      showInfo("Loading events…");

      try{
        const data = await getJson(`${BACKEND_URL}/api/events`);
        EVENTS = Array.isArray(data.events) ? data.events : [];
        showInfo(`${EVENTS.length} event${EVENTS.length === 1 ? "" : "s"} loaded.`);
        renderLegend();
        renderCalendar();

        if (!EVENTS.length){
          showWarn("There are no events yet.");
        }
      }catch(err){
        EVENTS = [];
        renderLegend();
        renderCalendar();
        clearInfo();
        showErr(err.message || "Could not load events.");
      }
    }

    prevBtn.onclick = () => {
      current = new Date(current.getFullYear(), current.getMonth() - 1, 1, 12, 0, 0, 0);
      renderCalendar();
    };

    nextBtn.onclick = () => {
      current = new Date(current.getFullYear(), current.getMonth() + 1, 1, 12, 0, 0, 0);
      renderCalendar();
    };

    todayBtn.onclick = () => {
      const t = new Date();
      current = new Date(t.getFullYear(), t.getMonth(), 1, 12, 0, 0, 0);
      renderCalendar();
    };

    renderLegend();
    renderCalendar();
    loadEvents();
  </script>
</body>
</html>
