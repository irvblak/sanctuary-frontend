<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Notice – Sanctuary Club</title>

  <meta name="robots" content="noindex, nofollow" />

  <script src="access.js?v=AC_1"></script>

  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#d9ecff 0%,#f2f7fb 45%,#ffffff 100%);
      color:#1b2733;
    }

    main{
      max-width:900px;
      margin:0 auto;
      padding:1rem;
    }

    .card{
      background:#fff;
      border-radius:16px;
      box-shadow:0 2px 12px rgba(0,0,0,0.08);
      overflow:hidden;
    }

    .poster-image{
      width:100%;
      display:block;
      object-fit:cover;
      max-height:420px;
    }

    .content{
      padding:1rem 1.1rem 1.2rem;
    }

    h1{
      margin:.2rem 0 .5rem;
      color:#003366;
    }

    .meta{
      color:#5d6a77;
      font-weight:600;
      margin-bottom:.6rem;
    }

    .section{
      margin-top:.9rem;
    }

    .btn{
      display:inline-block;
      margin-top:1rem;
      padding:.6rem .9rem;
      border-radius:999px;
      background:#005ea8;
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <img id="banner" class="poster-image" style="display:none" />

      <div class="content">
        <h1 id="title">Loading…</h1>
        <div class="meta" id="meta"></div>

        <div class="section" id="description"></div>

        <a id="bookBtn" class="btn" style="display:none">Book or register your interest</a>
      </div>
    </div>
  </main>

  <script>
    const BACKEND_URL = "https://sanctuary-backend-8iqc.onrender.com";

    const params = new URLSearchParams(window.location.search);
    const EVENT_ID = params.get("event_id");

    function bannerForCategory(category){
      const key = String(category || "").toLowerCase();
      return `images/banners/${key}.jpg`;
    }

    async function loadEvent(){
      if (!EVENT_ID){
        document.getElementById("title").textContent = "Event not found";
        return;
      }

      try{
        const res = await fetch(`${BACKEND_URL}/api/events/${EVENT_ID}`);
        const data = await res.json();

        if (!res.ok){
          throw new Error(data.message || "Error loading event");
        }

        const ev = data.event || data;

        document.getElementById("title").textContent = ev.title || "Event";

        document.getElementById("meta").textContent =
          `${ev.event_date || ""} ${ev.start_time || ""} · ${ev.location || ""}`;

        document.getElementById("description").textContent =
          ev.description || "";

        // Banner
        const banner = document.getElementById("banner");
        const src = bannerForCategory(ev.category_key || ev.category_label);
        banner.src = src;
        banner.style.display = "block";

        // Booking
        const btn = document.getElementById("bookBtn");
        btn.href = `event-booking.html?event_id=${encodeURIComponent(EVENT_ID)}`;
        btn.style.display = "inline-block";

      }catch(err){
        document.getElementById("title").textContent = err.message;
      }
    }

    loadEvent();
  </script>
</body>
</html>
